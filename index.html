<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#f4f1ea" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="生活" />
<meta name="format-detection" content="telephone=no" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<link rel="icon" href="./icon-192.png" />
<title>生活 · 记录</title>
<style>
/* =========================================================
   生活 · 设计令牌（与 Tempo 同源，换主题只换这一组）
   ========================================================= */
:root {
  --bg: #f4f1ea;
  --surface: #fffefb;
  --surface-2: #faf7f1;
  --hover: rgba(32, 32, 29, 0.04);
  --hover-2: rgba(32, 32, 29, 0.07);

  --ink: #211f1b;
  --ink-2: #5b564d;
  --ink-3: #948d80;

  --line: rgba(33, 31, 27, 0.075);
  --line-2: rgba(33, 31, 27, 0.14);

  --brand: #3d7a61;
  --brand-soft: rgba(61, 122, 97, 0.09);
  --brand-line: rgba(61, 122, 97, 0.26);

  --accent: #c4853f;
  --accent-soft: rgba(196, 133, 63, 0.12);
  --danger: #b5563f;
  --danger-soft: rgba(181, 86, 63, 0.12);

  --btn-bg: #221f1b;
  --btn-fg: #fbf9f4;
  --ghost-bg: rgba(32, 32, 29, 0.045);

  --shadow-1: 0 1px 2px rgba(32, 29, 24, 0.05), 0 1px 0 rgba(255, 255, 255, 0.6) inset;
  --shadow-2: 0 2px 5px -2px rgba(32, 29, 24, 0.07), 0 18px 38px -22px rgba(32, 29, 24, 0.28);

  --r-lg: 16px;
  --r-md: 12px;
  --r-sm: 9px;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --dur: 0.16s;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
    "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
}

[data-theme="dark"] {
  --bg: #101211;
  --surface: #191c1a;
  --surface-2: #141614;
  --hover: rgba(255, 255, 255, 0.05);
  --hover-2: rgba(255, 255, 255, 0.085);

  --ink: #eceae3;
  --ink-2: #a8a49a;
  --ink-3: #8b8880;

  --line: rgba(255, 255, 255, 0.075);
  --line-2: rgba(255, 255, 255, 0.16);

  --brand: #7db69a;
  --brand-soft: rgba(125, 182, 154, 0.13);
  --brand-line: rgba(125, 182, 154, 0.32);

  --accent: #d9a166;
  --accent-soft: rgba(217, 161, 102, 0.14);
  --danger: #d47f68;
  --danger-soft: rgba(212, 127, 104, 0.14);

  --btn-bg: #e9e6dd;
  --btn-fg: #12140f;
  --ghost-bg: rgba(255, 255, 255, 0.06);

  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
  --shadow-2: 0 2px 8px rgba(0, 0, 0, 0.35), 0 22px 48px -26px rgba(0, 0, 0, 0.75);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  user-select: none;
  touch-action: manipulation;
}
button, input, textarea { font-family: inherit; }
button { cursor: pointer; }
input, textarea { user-select: text; }

/* ---------------- 骨架 ---------------- */
.app {
  height: var(--vh, 100dvh);
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

.hdr {
  flex: 0 0 auto;
  height: calc(48px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top);
  padding-inline: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.hdr-title {
  font-size: 15.5px;
  font-weight: 620;
  letter-spacing: -0.005em;
  margin: 0;
}
.icon-btn {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: transparent; color: var(--ink-2);
  transition: background var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.icon-btn:active { transform: scale(0.92); background: var(--hover-2); }

.main { flex: 1; min-height: 0; position: relative; }
.view {
  position: absolute; inset: 0;
  display: none;
  flex-direction: column;
}
.view.is-active { display: flex; }

/* ---------------- 分段控件 ---------------- */
.seg {
  flex: 0 0 auto;
  margin: 0 20px 8px;
  display: flex; gap: 3px;
  padding: 3px;
  background: var(--ghost-bg);
  border-radius: 12px;
}
.seg-btn {
  flex: 1; height: 32px;
  border: 0; border-radius: 9px;
  background: transparent;
  color: var(--ink-3);
  font-size: 13px; font-weight: 600;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.seg-btn.is-on {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-1);
}

/* ---------------- 记账 ---------------- */
.pane { flex: 1; min-height: 0; display: none; flex-direction: column; }
.pane.is-active { display: flex; }

.amt-top {
  flex: 0 0 auto;
  height: 26px;
  display: flex; align-items: center;
  padding: 0 20px;
}
.amt-wrap {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px 8px;
  gap: 12px;
}
.amt-l { display: flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; line-height: 1; }
.amt-cur { font-size: 19px; color: var(--ink-3); font-weight: 500; }
.amt {
  font-size: 38px; font-weight: 620; line-height: 1;
  letter-spacing: -0.025em;
  font-variant-numeric: tabular-nums;
  transition: transform 0.18s var(--ease);
  white-space: nowrap;
}
.amt.is-pop { transform: scale(1.045); }
.amt.is-empty { color: var(--ink-3); font-weight: 500; }
.amt.is-long { font-size: 29px; }
.amt.is-shake { animation: shake 0.32s var(--ease); }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  65% { transform: translateX(4px); }
}

.dir { display: flex; gap: 2px; padding: 2px; background: var(--ghost-bg); border-radius: 10px; flex: 0 0 auto; }.dir-btn {
  height: 26px; padding: 0 11px;
  border: 0; border-radius: 8px;
  background: transparent; color: var(--ink-3);
  font-size: 12px; font-weight: 600;
  transition: all var(--dur) var(--ease);
}
.dir-btn.is-on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.dir-btn.is-on[data-dir="in"] { color: var(--brand); }

.save-btn {
  flex: 0 0 auto;
  height: 40px;
  padding: 0 20px;
  border: 0;
  border-radius: 20px;
  background: var(--btn-bg);
  color: var(--btn-fg);
  font-size: 14px; font-weight: 620;
  letter-spacing: 0.01em;
  transition: transform 0.1s var(--ease), opacity 0.1s var(--ease);
}
.save-btn:active { transform: scale(0.955); opacity: 0.9; }

.cats {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding: 0 20px;
}
.cat {
  height: 44px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  font-size: 11px; font-weight: 550; color: var(--ink-2);
  transition: all var(--dur) var(--ease);
  position: relative;
}
.cat .sw { width: 7px; height: 7px; border-radius: 50%; background: var(--c); opacity: 0.62; transition: all var(--dur) var(--ease); }
.cat.is-on {
  border-color: var(--c);
  background: var(--cs);
  color: var(--ink);
  font-weight: 650;
}
.cat.is-on .sw { opacity: 1; box-shadow: 0 0 0 3px var(--cs); }
.cat:active { transform: scale(0.955); }

.row-note {
  flex: 0 0 auto;
  display: flex; gap: 8px; align-items: center;
  padding: 10px 20px 6px;
}
.row-note input {
  flex: 1; min-width: 0; height: 38px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  padding: 0 12px;
  font-size: 13.5px; color: var(--ink);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.row-note input::placeholder { color: var(--ink-3); }
.row-note input:focus {
  outline: none;
  border-color: var(--brand-line);
  box-shadow: 0 0 0 3px var(--brand-soft);
}

.chip-toggle {
  flex: 0 0 auto;
  height: 32px; padding: 0 11px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  color: var(--ink-3);
  font-size: 11.5px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all var(--dur) var(--ease);
}
.chip-toggle .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ink-3); opacity: 0.4;
  transition: all var(--dur) var(--ease);
}
.chip-toggle[aria-pressed="true"] {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}
.chip-toggle[aria-pressed="true"] .dot { background: var(--accent); opacity: 1; }
.chip-toggle:active { transform: scale(0.96); }

.today {
  flex: 1; min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 2px 20px 14px;
}
.today-head {
  display: flex; align-items: baseline; gap: 8px;
  padding: 6px 0 2px;
  font-size: 11.5px; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.today-head b { color: var(--ink-2); font-weight: 600; }
.today-sep {
  display: flex; align-items: center; gap: 8px;
  margin: 10px 0 4px;
  font-size: 10.5px; color: var(--ink-3);
}
.today-sep::after {
  content: ""; flex: 1; height: 1px;
  background: var(--line);
}

.tx {
  display: flex; align-items: center; gap: 9px;
  height: 33px;
  font-size: 13px;
  border-radius: 8px;
  transition: background var(--dur) var(--ease);
}
.tx:active { background: var(--hover); }
.tx-time { width: 36px; flex: 0 0 auto; font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tx-dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }
.tx-cat { color: var(--ink-2); flex: 0 0 auto; max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-note { flex: 1; min-width: 0; color: var(--ink-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-amt { flex: 0 0 auto; font-weight: 620; font-variant-numeric: tabular-nums; }
.tx-amt.out { color: var(--ink); }
.tx-amt.in { color: var(--brand); }
.tx-trk { font-size: 9px; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 3px; line-height: 13px; flex: 0 0 auto; }

.empty {
  padding: 26px 4px;
  text-align: center;
  color: var(--ink-3);
  font-size: 12.5px;
  line-height: 1.8;
}
.empty b { display: block; color: var(--ink-2); font-size: 13.5px; font-weight: 600; margin-bottom: 2px; }

/* ---------------- 数字键盘 ---------------- */
.keypad {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  padding: 8px 16px 8px;
  background: var(--surface-2);
  border-top: 1px solid var(--line);
}
.keypad[hidden] { display: none; }
.kb-open .keypad { display: none; }
.key {
  height: clamp(46px, 6.4vh, 56px);
  border: 0;
  border-radius: var(--r-md);
  background: var(--surface);
  color: var(--ink);
  font-size: 20px; font-weight: 500;
  font-variant-numeric: tabular-nums;
  box-shadow: var(--shadow-1);
  transition: transform 0.09s var(--ease), background 0.09s var(--ease);
  display: grid; place-items: center;
}
.key:active { transform: scale(0.955); background: var(--hover-2); }
.key.del { font-size: 14px; color: var(--ink-2); }

/* ---------------- 随笔 ---------------- */
.note-editor { flex: 0 0 auto; padding: 0 20px 8px; }
#note-text {
  width: 100%;
  min-height: 74px;
  max-height: 150px;
  resize: none;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--surface);
  padding: 12px 14px;
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--ink);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
#note-text::placeholder { color: var(--ink-3); }
#note-text:focus {
  outline: none;
  border-color: var(--brand-line);
  box-shadow: 0 0 0 3px var(--brand-soft);
}
.note-acts {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 8px;
}
.btn-primary {
  height: 34px; padding: 0 18px;
  border: 0; border-radius: 17px;
  background: var(--btn-bg); color: var(--btn-fg);
  font-size: 13px; font-weight: 600;
  transition: transform 0.1s var(--ease), opacity 0.1s var(--ease);
}
.btn-primary:active { transform: scale(0.96); opacity: 0.88; }

.note-feed {
  flex: 1; min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 12px 20px 12px;
}
.nf-day {
  font-size: 11px; color: var(--ink-3);
  padding: 10px 0 4px;
  font-variant-numeric: tabular-nums;
}
.nf-item {
  display: flex; gap: 8px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--ink-2);
}
.nf-item:last-child { border-bottom: 0; }
.nf-time { flex: 0 0 auto; width: 36px; font-size: 11px; color: var(--ink-3); padding-top: 2px; font-variant-numeric: tabular-nums; }
.nf-text { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
.nf-item.is-big .nf-text { color: var(--ink); font-weight: 550; }
.nf-flag { color: var(--accent); font-size: 10px; border: 1px solid var(--accent); border-radius: 5px; padding: 0 4px; height: 15px; line-height: 13px; flex: 0 0 auto; margin-top: 3px; }

/* ---------------- 轨迹 ---------------- */
.track {
  flex: 1; min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 2px 20px 20px;
}
.day { position: relative; padding-left: 20px; padding-bottom: 14px; }
.day::before {
  content: "";
  position: absolute; left: 4px; top: 9px; bottom: -4px;
  width: 1px; background: var(--line-2);
}
.day:last-child::before { display: none; }
.day-dot {
  position: absolute; left: 0; top: 4px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--line-2);
}
.day.has-mile .day-dot { border-color: var(--accent); background: var(--accent); }
.day-label {
  display: flex; align-items: baseline; gap: 7px;
  font-size: 11.5px; color: var(--ink-3);
  margin-bottom: 6px;
  font-variant-numeric: tabular-nums;
}
.day-label b { color: var(--ink-2); font-weight: 600; font-size: 12.5px; }
.mile {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 10px 12px;
  margin-bottom: 6px;
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--ink);
  box-shadow: var(--shadow-1);
  white-space: pre-wrap;
  word-break: break-word;
}
.mile-tx {
  display: flex; align-items: center; gap: 8px;
  font-size: 12.5px;
  color: var(--ink-2);
  padding: 8px 12px 8px 11px;
  border-left: 2px solid var(--accent);
  border-radius: 4px var(--r-md) var(--r-md) 4px;
  box-shadow: none;
}
.mile-tx .mt-amt {
  margin-left: auto;
  font-weight: 620;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.spend {
  padding: 5px 0 1px;
  font-size: 12px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.01em;
}
.spend b { color: var(--ink-2); font-weight: 600; }
.spend .sep { margin: 0 3px; opacity: 0.55; }

/* ---------------- 计划 ---------------- */
.plan {
  flex: 1; min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 2px 20px 16px;
}
.plan-h {
  display: flex; align-items: baseline; justify-content: space-between;
  margin: 6px 0 4px;
}
.plan-h h2 { margin: 0; font-size: 13.5px; font-weight: 650; }
.plan-h .sub { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.rate-box {
  display: flex; align-items: baseline; gap: 6px;
  margin: 2px 0 14px;
  font-size: 11.5px; color: var(--ink-3);
}
.rate-box b { font-size: 26px; font-weight: 620; color: var(--brand); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.pl-sec { margin-bottom: 18px; }
.pl-sec-h {
  font-size: 11.5px; font-weight: 650; color: var(--ink-3);
  letter-spacing: 0.04em;
  margin: 0 0 2px;
}
.pl-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
  transition: opacity var(--dur) var(--ease);
}
.pl-item:last-child { border-bottom: 0; }
.pl-box {
  width: 19px; height: 19px; flex: 0 0 auto;
  border: 1.5px solid var(--line-2);
  border-radius: 6px;
  display: grid; place-items: center;
  transition: all var(--dur) var(--ease);
}
.pl-box svg { width: 11px; height: 11px; opacity: 0; transform: scale(0.6); transition: all var(--dur) var(--ease); }
.pl-item.done .pl-box { background: var(--brand); border-color: var(--brand); }
.pl-item.done .pl-box svg { opacity: 1; transform: none; }
.pl-text { flex: 1; min-width: 0; font-size: 14px; line-height: 1.45; word-break: break-word; }
.pl-item.done .pl-text { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1px; }
.pl-item.stretch .pl-box { border-radius: 50%; }
.pl-item.stretch.done .pl-box { background: var(--accent); border-color: var(--accent); }
.pl-empty { font-size: 12px; color: var(--ink-3); padding: 8px 0 2px; }

.add-bar {
  flex: 0 0 auto;
  display: flex; gap: 8px;
  padding: 9px 20px;
  background: var(--surface-2);
  border-top: 1px solid var(--line);
}
.add-bar input {
  flex: 1; min-width: 0; height: 38px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  padding: 0 12px;
  font-size: 13.5px; color: var(--ink);
}
.add-bar input:focus { outline: none; border-color: var(--brand-line); box-shadow: 0 0 0 3px var(--brand-soft); }
.add-bar button {
  flex: 0 0 auto; width: 38px; height: 38px;
  border: 0; border-radius: var(--r-md);
  background: var(--btn-bg); color: var(--btn-fg);
  font-size: 19px; font-weight: 400;
  display: grid; place-items: center;
  transition: transform 0.1s var(--ease);
}
.add-bar button:active { transform: scale(0.94); }
.seg-mini {
  display: flex; gap: 2px; padding: 2px; background: var(--ghost-bg); border-radius: 9px;
  margin-right: 2px; flex: 0 0 auto;
}
.seg-mini button {
  width: auto; height: 34px; padding: 0 9px;
  border: 0; border-radius: 7px; background: transparent;
  font-size: 11.5px; font-weight: 600; color: var(--ink-3);
}
.seg-mini button.is-on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

/* ---------------- 备忘录 ---------------- */
.memo {
  flex: 1; min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 2px 20px 16px;
}
.mm-item {
  display: flex; gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  transition: opacity var(--dur) var(--ease);
}
.mm-box {
  width: 18px; height: 18px; flex: 0 0 auto; margin-top: 2px;
  border: 1.5px solid var(--line-2); border-radius: 5px;
  display: grid; place-items: center;
  transition: all var(--dur) var(--ease);
}
.mm-box svg { width: 10px; height: 10px; opacity: 0; transition: all var(--dur) var(--ease); }
.mm-item.done .mm-box { background: var(--ink-3); border-color: var(--ink-3); }
.mm-item.done .mm-box svg { opacity: 1; }
.mm-text { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.6; word-break: break-word; }
.mm-item.done .mm-text { color: var(--ink-3); text-decoration: line-through; }

/* ---------------- 底部 tab ---------------- */
.tabbar {
  flex: 0 0 auto;
  height: calc(52px + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: var(--surface);
  border-top: 1px solid var(--line);
}
.tab {
  border: 0; background: transparent;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-3);
  font-size: 10px; font-weight: 550;
  transition: color var(--dur) var(--ease);
}
.tab svg { width: 20px; height: 20px; stroke-width: 1.7; }
.tab.is-on { color: var(--ink); }
.tab.is-on svg { stroke-width: 2.1; }
.tab:active { opacity: 0.6; }

/* ---------------- 我的 ---------------- */
.sheet {
  position: fixed; inset: 0; z-index: 40;
  background: var(--bg);
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.3s var(--ease);
  visibility: hidden;
}
.sheet.is-open { transform: none; visibility: visible; }
.sheet-hdr {
  flex: 0 0 auto;
  height: calc(52px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top);
  padding-inline: 14px;
  display: flex; align-items: center; gap: 6px;
}
.sheet-hdr h2 { font-size: 16px; margin: 0; font-weight: 650; }
.sheet-body {
  flex: 1; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 4px 20px calc(28px + env(safe-area-inset-bottom));
  max-width: 560px; width: 100%; margin: 0 auto;
}
.stat-row {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; margin: 6px 0 20px;
}
.stat-cell {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px 10px;
  text-align: center;
}
.stat-cell b {
  display: block;
  font-size: 21px; font-weight: 620;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.stat-cell span { font-size: 10.5px; color: var(--ink-3); }
.me-sec { margin-bottom: 20px; }
.me-sec h3 {
  font-size: 11px; color: var(--ink-3);
  letter-spacing: 0.05em; font-weight: 650;
  margin: 0 0 6px;
}
.row-btn {
  width: 100%;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0;
  border: 0; border-bottom: 1px solid var(--line);
  background: transparent;
  font-size: 14px; color: var(--ink);
  text-align: left;
}
.row-btn:last-child { border-bottom: 0; }
.row-btn .hint { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.row-btn.danger { color: var(--danger); }
.row-btn:active { opacity: 0.55; }

.theme-row { display: flex; gap: 6px; padding: 6px 0 10px; }
.theme-opt {
  flex: 1; height: 38px;
  border: 1px solid var(--line); border-radius: var(--r-md);
  background: transparent; color: var(--ink-3);
  font-size: 12.5px; font-weight: 600;
  transition: all var(--dur) var(--ease);
}
.theme-opt.is-on { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }

.me-note {
  font-size: 11.5px; color: var(--ink-3);
  line-height: 1.75;
  padding: 10px 0 0;
}
.me-ver { font-size: 11px; color: var(--ink-3); text-align: center; padding: 18px 0 0; }

/* ---------------- toast ---------------- */
/* 顶部横幅式提示：临时顶替标题行，不做半遮半掩的胶囊 */
.toast {
  position: fixed;
  left: 50%;
  top: calc(env(safe-area-inset-top) + 5px);
  width: calc(min(100vw, 560px) - 32px);
  transform: translate(-50%, -10px);
  background: #22201c;
  color: #faf8f2;
  font-size: 12.5px;
  line-height: 1.45;
  min-height: 38px;
  padding: 8px 14px;
  border-radius: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s var(--ease), transform 0.18s var(--ease);
  z-index: 60;
  display: flex; align-items: center; gap: 12px;
  box-shadow: 0 6px 20px -8px rgba(20, 18, 14, 0.5);
}
.toast span { flex: 1; min-width: 0; }
.toast.is-on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button {
  border: 0; background: transparent;
  color: #e8b981; font-size: 12.5px; font-weight: 650;
  padding: 2px 0;
  flex: 0 0 auto;
}

@media (max-height: 700px) {
  .amt { font-size: 32px; }
  .cat { height: 40px; }
  .key { height: 43px; }
  .note-editor #note-text { min-height: 64px; }
}
</style>
</head>

  <nav class="tabbar" id="tabbar">

<!-- ============ 我的 ============ -->
<div class="sheet" id="sheet-me">
  <div class="sheet-hdr">
    <button class="icon-btn" id="close-me" aria-label="返回">

  </div>
  <div class="sheet-body">
    <div class="stat-row">

      <div class="stat-cell"><b id="st-note">0</b><span>条随笔</span></div>

<input type="file" id="file-import" accept=".json,application/json" hidden />
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   生活 · M1
   记录（记账/随笔）· 轨迹 · 计划 · 备忘录
   ========================================================= */
"use strict";

/* ---------- 工具 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.prototype.slice.call(r.querySelectorAll(s));
const pad2 = (n) => String(n).padStart(2, "0");
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const dayKey = (ts) => { const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const fmtHM = (ts) => { const d = new Date(ts); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const fmtMD = (ts) => { const d = new Date(ts); return `${d.getMonth() + 1}/${d.getDate()}`; };
const WEEK_CN = ["日", "一", "二", "三", "四", "五", "六"];
const fmtMoney = (n) => {
  const v = Math.round(n * 100) / 100;
  return v % 1 === 0 ? String(v) : v.toFixed(2);
};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hexToRgba = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
};
/* 一周从周一开始 */
function weekStart(d) {
  const t = startOfDay(d || Date.now());
  const off = (t.getDay() + 6) % 7;
  const m = new Date(t);
  m.setDate(t.getDate() - off);
  return m;
}
const weekKey = (d) => dayKey(weekStart(d));
function weekRangeLabel(d) {
  const s = weekStart(d);
  const e = new Date(s); e.setDate(s.getDate() + 6);
  return `${s.getMonth() + 1}/${s.getDate()} – ${e.getMonth() + 1}/${e.getDate()}`;
}

/* ---------- 分类 ---------- */
const CATS = [
  { id: "food",    name: "餐饮", c: "#c4853f" },
  { id: "traffic", name: "交通", c: "#5b7fa6" },
  { id: "shop",    name: "购物", c: "#8f6ba8" },
  { id: "home",    name: "居住", c: "#6b8f71" },
  { id: "fun",     name: "娱乐", c: "#c26b6b" },
  { id: "health",  name: "医教", c: "#4f8f8a" },
  { id: "social",  name: "人情", c: "#b07a4a" },
  { id: "other",   name: "其他", c: "#8b8478" }
];
const catById = (id) => CATS.find((c) => c.id === id) || CATS[CATS.length - 1];

/* ---------- 状态 ---------- */
const ST = {
  txns: [],
  notes: [],
  plans: [],
  memos: [],
  view: "record",
  mode: "txn",
  dir: "out",
  cat: "food",
  draft: "",
  inTrack: false,
  big: false,
  planKind: "must",
  prefs: { theme: "auto", lastExport: 0, lastCat: "food" }
};

/* ---------- IndexedDB ---------- */
const DB_NAME = "life";
const DB_VER = 1;
let _db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("txns")) db.createObjectStore("txns", { keyPath: "id" });
      if (!db.objectStoreNames.contains("notes")) db.createObjectStore("notes", { keyPath: "id" });
      if (!db.objectStoreNames.contains("plans")) db.createObjectStore("plans", { keyPath: "id" });
      if (!db.objectStoreNames.contains("memos")) db.createObjectStore("memos", { keyPath: "id" });
      if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", { keyPath: "k" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function store(name, mode) {
  return _db.transaction(name, mode || "readonly").objectStore(name);
}
function dbAll(name) {
  return new Promise((res, rej) => {
    const r = store(name).getAll();
    r.onsuccess = () => res(r.result || []);
    r.onerror = () => rej(r.error);
  });
}
function dbPut(name, val) {
  return new Promise((res, rej) => {
    const r = store(name, "readwrite").put(val);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}
function dbDel(name, id) {
  return new Promise((res, rej) => {
    const r = store(name, "readwrite").delete(id);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}
function dbClear(name) {
  return new Promise((res, rej) => {
    const r = store(name, "readwrite").clear();
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg, action, onAction) {
  const el = $("#toast");
  el.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button>${esc(action)}</button>` : "");
  el.classList.add("is-on");
  if (action) {
    const btn = el.querySelector("button");
    btn.addEventListener("click", () => {
      el.classList.remove("is-on");
      onAction && onAction();
    }, { once: true });
  }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("is-on"), action ? 5200 : 2000);
}
/* iOS 不支持 vibrate；Chrome 在用户触摸前调用会报 console error，故先用标志拦住 */
let CAN_VIB = false;
document.addEventListener("pointerdown", () => { CAN_VIB = true; }, { once: true, passive: true });
function buzz(ms) {
  if (!CAN_VIB || !navigator.vibrate) return;
  try { navigator.vibrate(ms || 8); } catch (e) {}
}

/* ---------- 主题 ---------- */
function applyTheme() {
  const t = ST.prefs.theme;
  const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", dark ? "#101211" : "#f4f1ea");
  $$("#theme-row .theme-opt").forEach((b) => b.classList.toggle("is-on", b.dataset.theme === t));
}
function saveMeta() {
  return dbPut("meta", { k: "prefs", v: ST.prefs });
}

/* ---------- 记录：分类 ---------- */
function renderCats() {
  $("#cats").innerHTML = CATS.map((c) => `
    <button class="cat ${c.id === ST.cat ? "is-on" : ""}" data-cat="${c.id}"
            style="--c:${c.c};--cs:${hexToRgba(c.c, 0.11)}">
      <span class="sw"></span><span>${c.name}</span>
    </button>`).join("");
}

/* ---------- 记录：金额 ---------- */
function groupDigits(v) {
  if (v === "") return "0";
  const dot = v.indexOf(".");
  const intPart = dot < 0 ? v : v.slice(0, dot);
  const rest = dot < 0 ? "" : v.slice(dot);
  return intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + rest;
}
function renderAmount() {
  const el = $("#amt");
  const v = ST.draft;
  el.textContent = groupDigits(v);
  el.classList.toggle("is-empty", v === "");
  el.classList.toggle("is-long", v.replace(".", "").length > 6);
}
function keyPress(k) {
  if (k === "del") {
    ST.draft = ST.draft.slice(0, -1);
  } else if (k === ".") {
    if (!ST.draft) ST.draft = "0.";
    else if (ST.draft.indexOf(".") < 0) ST.draft += ".";
  } else {
    const dot = ST.draft.indexOf(".");
    if (dot >= 0 && ST.draft.length - dot > 2) return;      // 最多两位小数
    const digits = ST.draft.replace(".", "");
    if (digits.length >= 9) return;                          // 金额上限
    if (ST.draft === "0") ST.draft = k;
    else ST.draft += k;
  }
  renderAmount();
}
function buildKeypad() {
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", ".", "0", "del"];
  const box = $("#keypad");
  box.innerHTML = keys.map((k) => {
    if (k === "del") return `<button class="key del" data-k="del">⌫</button>`;
    return `<button class="key" data-k="${k}">${k}</button>`;
  }).join("");
  box.addEventListener("click", (e) => {
    const btn = e.target.closest(".key");
    if (!btn) return;
    keyPress(btn.dataset.k);
    buzz(6);
  });
}

/* ---------- 记录：保存流水 ---------- */
async function saveTxn() {
  const amount = Math.round(parseFloat(ST.draft || "0") * 100) / 100;
  if (!(amount > 0)) {
    const el = $("#amt");
    el.classList.remove("is-shake");
    void el.offsetWidth;
    el.classList.add("is-shake");
    toast("先输个金额");
    return;
  }
  const t = {
    id: uid("t"),
    at: Date.now(),
    amount,
    dir: ST.dir,
    cat: ST.cat,
    note: $("#txn-note").value.trim(),
    inTrack: ST.inTrack,
    origin: "manual",
    createdAt: Date.now()
  };
  ST.txns.unshift(t);
  await dbPut("txns", t);

  ST.prefs.lastCat = ST.cat;
  saveMeta();

  ST.draft = "";
  $("#txn-note").value = "";
  $("#txn-note").blur();
  ST.inTrack = false;
  $("#t-track").setAttribute("aria-pressed", "false");
  renderAmount();
  if (navigator.vibrate) buzz(10);
  const el = $("#amt");
  el.classList.add("is-pop");
  setTimeout(() => el.classList.remove("is-pop"), 180);
  renderToday();
  renderTrack();
  renderStats();
}

/* ---------- 记录：今日流水 ---------- */
function txRow(t) {
  const c = catById(t.cat);
  return `<div class="tx" data-id="${t.id}">
      <span class="tx-time">${fmtHM(t.at)}</span>
      <span class="tx-dot" style="background:${c.c}"></span>
      <span class="tx-cat">${esc(c.name)}</span>
      <span class="tx-note">${esc(t.note || "")}</span>
      ${t.inTrack ? `<span class="tx-trk">轨迹</span>` : ""}
      <span class="tx-amt ${t.dir}">${t.dir === "out" ? "-" : "+"}${fmtMoney(t.amount)}</span>
    </div>`;
}

function renderToday() {
  const box = $("#today");
  const today = dayKey(Date.now());
  const all = ST.txns.slice().sort((a, b) => b.at - a.at);
  const todays = all.filter((t) => dayKey(t.at) === today);
  const earlier = all.filter((t) => dayKey(t.at) !== today).slice(0, 8);

  if (!todays.length && !earlier.length) {
    box.innerHTML = `<div class="empty"><b>今天还没记</b>上面输金额，选个分类，点「记下来」</div>`;
    return;
  }

  let html = "";
  if (todays.length) {
    let out = 0, inc = 0;
    todays.forEach((t) => { if (t.dir === "out") out += t.amount; else inc += t.amount; });
    html += `<div class="today-head">今天 · <b>${todays.length}</b> 笔` +
      (out ? ` · 支出 <b>¥${fmtMoney(out)}</b>` : "") +
      (inc ? ` · 收入 <b>¥${fmtMoney(inc)}</b>` : "") + `</div>`;
    html += todays.map(txRow).join("");
  } else {
    html += `<div class="today-head">今天还没有记录</div>`;
  }

  if (earlier.length) {
    html += `<div class="today-sep">更早</div>` + earlier.map((t) => {
      const c = catById(t.cat);
      return `<div class="tx" data-id="${t.id}">
        <span class="tx-time">${fmtMD(t.at)}</span>
        <span class="tx-dot" style="background:${c.c}"></span>
        <span class="tx-cat">${esc(c.name)}</span>
        <span class="tx-note">${esc(t.note || "")}</span>
        <span class="tx-amt ${t.dir}">${t.dir === "out" ? "-" : "+"}${fmtMoney(t.amount)}</span>
      </div>`;
    }).join("");
  }

  box.innerHTML = html;
}

/* ---------- 记录：随笔 ---------- */
async function saveNote() {
  const ta = $("#note-text");
  const text = ta.value.trim();
  if (!text) { toast("写点什么再存"); ta.focus(); return; }
  const n = {
    id: uid("n"),
    at: Date.now(),
    text,
    big: ST.big,
    createdAt: Date.now()
  };
  ST.notes.unshift(n);
  await dbPut("notes", n);
  ta.value = "";
  ST.big = false;
  $("#n-big").setAttribute("aria-pressed", "false");
  buzz(10);
  renderNoteFeed();

function renderNoteFeed() {
  const box = $("#note-feed");
  const list = ST.notes.slice().sort((a, b) => b.at - a.at).slice(0, 40);
  if (!list.length) {
    box.innerHTML = `<div class="empty"><b>还没有随笔</b>想记什么就写，标了「大事」的会进轨迹</div>`;
    return;
  }
  let html = "";
  let lastDay = "";
  list.forEach((n) => {
    const k = dayKey(n.at);
    if (k !== lastDay) {
      const d = new Date(n.at);
      html += `<div class="nf-day">${d.getMonth() + 1}月${d.getDate()}日 · 周${WEEK_CN[d.getDay()]}</div>`;
      lastDay = k;
    }
    html += `<div class="nf-item ${n.big ? "is-big" : ""}" data-id="${n.id}">
      <span class="nf-time">${fmtHM(n.at)}</span>
      <span class="nf-text">${esc(n.text)}</span>
      ${n.big ? `<span class="nf-flag">大事</span>` : ""}
    </div>`;
  });
  box.innerHTML = html;
}

/* ---------- 轨迹 ---------- */
function renderTrack() {
  const box = $("#track");
  const days = new Map();
  const touch = (ts) => {
    const k = dayKey(ts);
    if (!days.has(k)) days.set(k, { key: k, at: startOfDay(ts).getTime(), notes: [], out: 0, inc: 0, n: 0, trackTxns: [] });
    return days.get(k);
  };
  ST.notes.forEach((n) => { if (n.big) touch(n.at).notes.push(n); });
  ST.txns.forEach((t) => {
    const d = touch(t.at);
    d.n++;
    if (t.dir === "out") d.out += t.amount; else d.inc += t.amount;
    if (t.inTrack) d.trackTxns.push(t);
  });

  const arr = Array.from(days.values()).sort((a, b) => b.key.localeCompare(a.key));
  if (!arr.length) {
    box.innerHTML = `<div class="empty"><b>轨迹还是空的</b>记一笔账，或写一条标为「大事」的随笔，这里就会长出来</div>`;
    return;
  }

  box.innerHTML = arr.map((d) => {
    const dt = new Date(d.at);
    const hasMile = d.notes.length > 0;
    let inner = "";
    d.notes.forEach((n) => {
      inner += `<div class="mile">${esc(n.text)}</div>`;
    });
    d.trackTxns.forEach((t) => {
      const c = catById(t.cat);
      inner += `<div class="mile mile-tx">
        <span style="width:6px;height:6px;border-radius:50%;background:${c.c};flex:0 0 auto"></span>
        <span>${esc(c.name)}${t.note ? " · " + esc(t.note) : ""}</span>
        <span class="mt-amt">-${fmtMoney(t.amount)}</span>
      </div>`;
    });
    if (d.n) {
      const parts = [];
      if (d.out) parts.push(`支出 <b>¥${fmtMoney(d.out)}</b>`);
      if (d.inc) parts.push(`收入 <b>¥${fmtMoney(d.inc)}</b>`);
      parts.push(`${d.n} 笔`);
      inner += `<div class="spend">${parts.join('<span class="sep">·</span>')}</div>`;
    }
    return `<div class="day ${hasMile ? "has-mile" : ""}">
      <span class="day-dot"></span>
      <div class="day-label"><b>${dt.getMonth() + 1}/${dt.getDate()}</b> 周${WEEK_CN[dt.getDay()]}</div>
      ${inner}
    </div>`;
  }).join("");
}

/* ---------- 计划 ---------- */
function currentPlans() {
  const wk = weekKey();
  return ST.plans.filter((p) => p.week === wk);
}
function renderPlan() {
  const box = $("#plan");
  const list = currentPlans();
  const must = list.filter((p) => p.kind === "must");
  const stretch = list.filter((p) => p.kind === "stretch");
  const doneMust = must.filter((p) => p.done).length;
  const rate = must.length ? Math.round((doneMust / must.length) * 100) : 0;

  const row = (p) => `<div class="pl-item ${p.done ? "done" : ""} ${p.kind === "stretch" ? "stretch" : ""}" data-id="${p.id}">
    <span class="pl-box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
    <span class="pl-text">${esc(p.title)}</span>
  </div>`;

  box.innerHTML = `
    <div class="plan-h">
      <h2>本周</h2>
      <span class="sub">${weekRangeLabel()}</span>
    </div>
    <div class="rate-box">
      <b>${must.length ? rate : "–"}${must.length ? "%" : ""}</b>
      <span>${must.length ? `必做 ${doneMust}/${must.length}` : "还没有必做事项"}</span>
    </div>

    <div class="pl-sec">
      <div class="pl-sec-h">必做</div>
      ${must.length ? must.map(row).join("") : `<div class="pl-empty">这周必须完成的事，加一条</div>`}
    </div>

    <div class="pl-sec">
      <div class="pl-sec-h">弹性目标</div>
      ${stretch.length ? stretch.map(row).join("") : `<div class="pl-empty">想做但不强求，不计入达标率</div>`}
    </div>
  `;
}
async function addPlan() {
  const input = $("#plan-input");
  const title = input.value.trim();

  const p = { id: uid("p"), week: weekKey(), kind: ST.planKind, title, done: false, doneAt: 0, createdAt: Date.now() };
  ST.plans.push(p);
  await dbPut("plans", p);
  input.value = "";
  renderPlan();
  renderStats();
  buzz(8);
}
async function togglePlan(id) {
  const p = ST.plans.find((x) => x.id === id);

  p.done = !p.done;

function renderStats() {

  else {

function exportBackup() {
  const data = {
    app: "life",
    version: 1,
    exportedAt: Date.now(),
    txns: ST.txns,
    notes: ST.notes,
    plans: ST.plans,
    memos: ST.memos
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `life-backup-${dayKey(Date.now())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  ST.prefs.lastExport = Date.now();
  saveMeta();
  renderStats();
  toast("备份已导出，存到「文件」里");
}
async function importBackup(file) {
  let d;
  try {
    d = JSON.parse(await file.text());
  } catch (e) {
    toast("这个文件读不了");
    return;
  }
  if (!d || d.app !== "life") { toast("这不是本应用的备份"); return; }
  const n = (d.txns || []).length + (d.notes || []).length + (d.plans || []).length + (d.memos || []).length;
  if (!n) { toast("备份里没有数据"); return; }
  if (!confirm(`将用这份备份覆盖当前数据（备份含 ${n} 条记录），继续？`)) return;

  await dbClear("txns"); await dbClear("notes"); await dbClear("plans"); await dbClear("memos");
  ST.txns = d.txns || []; ST.notes = d.notes || []; ST.plans = d.plans || []; ST.memos = d.memos || [];
  for (const t of ST.txns) await dbPut("txns", t);
  for (const x of ST.notes) await dbPut("notes", x);
  for (const x of ST.plans) await dbPut("plans", x);
  for (const x of ST.memos) await dbPut("memos", x);
  renderAll();
  toast(`恢复了 ${n} 条记录`);
}
async function wipeAll() {
  if (!confirm("清空所有数据？这会删掉全部账目、随笔、计划与备忘录。\n\n建议先导出备份。")) return;
  if (!confirm("真的要清空吗？此操作无法撤销。")) return;
  await dbClear("txns"); await dbClear("notes"); await dbClear("plans"); await dbClear("memos");
  ST.txns = []; ST.notes = []; ST.plans = []; ST.memos = [];
  ST.prefs.lastExport = 0;
  saveMeta();
  renderAll();
  toast("已清空");
}

/* ---------- 长按（pointer 事件：触摸与鼠标都通） ---------- */
let suppressClickUntil = 0;
function bindLongPress(container, selector, onLong) {
  let timer = null, sx = 0, sy = 0;
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  container.addEventListener("pointerdown", (e) => {
    const row = e.target.closest(selector);
    if (!row) return;
    sx = e.clientX; sy = e.clientY;
    cancel();
    timer = setTimeout(() => {
      timer = null;
      suppressClickUntil = Date.now() + 600;
      buzz(18);
      onLong(row);
    }, 520);
  });
  container.addEventListener("pointermove", (e) => {
    if (!timer) return;
    if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) cancel();
  });
  container.addEventListener("pointerup", cancel);
  container.addEventListener("pointercancel", cancel);
  container.addEventListener("pointerleave", cancel);
  container.addEventListener("contextmenu", (e) => e.preventDefault());
}

/* ---------- 视口高度（iOS 键盘弹出时压缩布局） ---------- */
function fixViewport() {
  const vv = window.visualViewport;
  if (!vv) return;
  const full = Math.max(window.innerHeight, vv.height);
  const set = () => {
    document.documentElement.style.setProperty("--vh", vv.height + "px");
    /* 可视高度明显变矮 = 系统键盘弹出，这时必须让出位置，否则自绘键盘会压住输入框 */
    const kbd = full - vv.height > 130;
    document.documentElement.classList.toggle("kb-open", kbd);
  };
  set();
  vv.addEventListener("resize", set);
  vv.addEventListener("scroll", set);
  window.addEventListener("orientationchange", () => setTimeout(set, 220));
}

  renderTrack();
  renderPlan();
  renderMemo();
  renderStats();
}

async function boot() {
  try {
    _db = await openDB();
  } catch (e) {
    document.body.innerHTML =
      '<div style="padding:40px 24px;font:14px/1.8 -apple-system,sans-serif;color:#5b564d">' +
      "这台设备的浏览器不允许本地存储，应用无法运行。<br>换 Safari 或 Chrome 再试。" +
      "</div>";
    return;
  }
  const [txns, notes, plans, memos, meta] = await Promise.all([
    dbAll("txns"), dbAll("notes"), dbAll("plans"), dbAll("memos"), dbAll("meta")
  ]);
  ST.txns = txns.sort((a, b) => b.at - a.at);
  ST.notes = notes.sort((a, b) => b.at - a.at);
  ST.plans = plans;
  ST.memos = memos;
  const p = meta.find((x) => x.k === "prefs");
  if (p && p.v) Object.assign(ST.prefs, p.v);
  ST.cat = ST.prefs.lastCat || "food";

  applyTheme();
  buildKeypad();
  bindEvents();
  fixViewport();
  renderAll();
  setMode("txn");
  setView("record");

  /* 备份提醒：超过 14 天没导出 */
  const le = ST.prefs.lastExport;
  const total = ST.txns.length + ST.notes.length;
  if (total > 0 && (!le || Date.now() - le > 14 * 86400000)) {
    setTimeout(() => {
      toast(le ? "两周没备份了，去「我的」导出一次" : "还没备份过，去「我的」导出一次");
    }, 900);
  }
}

boot();

/* PWA：只在 http(s) 下注册，file:// 打开也不报错 */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
