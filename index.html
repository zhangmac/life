   记一笔 / 改一笔
   ========================================================= */
function firstCatId(dir) {
  const l = catsOf(dir, "");
  return l.length ? l[0].id : "";
}
function firstSubName(catId) {
  const l = catsOf(ST.editDir, catId);
  return l.length ? l[0].name : "";
}

function openEdit(txn) {
  if (txn) {
    ST.editId = txn.id;
    ST.editDir = txn.dir;
    ST.editCat = txn.cat;
    ST.editSub = txn.sub || "";
    ST.editDate = dayKey(txn.at);
    ST.editInTrack = !!txn.inTrack;
    ST.draft = txn.amount ? String(txn.amount) : "";
    $("#ed-note").value = txn.note || "";
  } else {
    ST.editId = null;
    ST.editDir = ST.prefs.lastDir || "out";
    if (!catsOf(ST.editDir, "").length) ST.editDir = "out";
    ST.editCat = (ST.prefs.lastCat && catById(ST.prefs.lastCat).id) ? ST.prefs.lastCat : firstCatId(ST.editDir);
    if (catById(ST.editCat).dir !== ST.editDir) ST.editCat = firstCatId(ST.editDir);
    ST.editSub = ST.subOf[ST.editCat] || firstSubName(ST.editCat);
    ST.editDate = dayKey(Date.now());
    ST.editInTrack = false;
    ST.draft = "";
    $("#ed-note").value = "";
  }
  lastAmt = parseFloat(ST.draft || "0") || 0;
  renderEdit();
  $("#sheet-edit").classList.add("is-open");
}
function closeEdit() {
  closeDatePop();
  $("#sheet-edit").classList.remove("is-open");
  $("#ed-note").blur();
}

function renderEdit() {
  $$("#ed-dir button").forEach((b) => b.classList.toggle("is-on", b.dataset.dir === ST.editDir));
  renderEditCats();
  renderEditSubs();
  renderAmount(true);
  $("#ed-track").setAttribute("aria-pressed", String(ST.editInTrack));
  paintDateLabel();
}

function paintDateLabel() {
  const dt = ST.editDate === dayKey(Date.now()) ? "今天" : (() => {
    const [y, m, d] = ST.editDate.split("-").map(Number);
    const now = new Date();
    return (y === now.getFullYear()) ? `${m}月${d}日` : `${y}/${m}/${d}`;
  })();
  $("#ed-date-txt").textContent = dt;
}

/* ---------- 选日期：自研面板 ----------
   原生 input[type=date] 靠 opacity:0 铺满来接管点击，触发点在部分浏览器
   （尤其 iframe / 桌面 WebView）会被吞掉，点了没反应。改自绘。 */
const DP = { y: 0, m: 0 };

function setEditDate(key) {
  ST.editDate = key;
  paintDateLabel();
  buzz(6);
}
function openDatePop() {
  const base = ST.editDate.split("-").map(Number);
  DP.y = base[0]; DP.m = base[1] - 1;
  renderDatePop();
  $("#date-mask").classList.add("is-open");
  $("#date-pop").classList.add("is-open");
  buzz(6);
}
function closeDatePop() {
  $("#date-mask").classList.remove("is-open");
  $("#date-pop").classList.remove("is-open");
}
function renderDatePop() {
  const todayKey = dayKey(Date.now());
  const pad = new Date(DP.y, DP.m, 1).getDay();
  const days = new Date(DP.y, DP.m + 1, 0).getDate();
  $("#dp-title").textContent = `${DP.y}年${DP.m + 1}月`;
  let h = "";
  for (let i = 0; i < pad; i++) h += '<button class="dp-cell is-blank" disabled tabindex="-1"></button>';
  for (let d = 1; d <= days; d++) {
    const key = `${DP.y}-${pad2(DP.m + 1)}-${pad2(d)}`;
    const cls = ["dp-cell"];
    if (key === todayKey) cls.push("is-today");
    if (key === ST.editDate) cls.push("is-on");
    h += `<button type="button" class="${cls.join(" ")}" data-k="${key}"${key > todayKey ? " disabled" : ""}>${d}</button>`;
  }
  $("#dp-grid").innerHTML = h;
  /* 已经到当前月，就不许再往后翻 —— 记账没有未来 */
  $("#dp-next").disabled = `${DP.y}-${pad2(DP.m + 1)}` >= todayKey.slice(0, 7);
}

function renderEditCats() {
  const tops = catsOf(ST.editDir, "");
  let html = tops.map((c) => {
    const on = c.id === ST.editCat;
    return `<button class="cat-cell ${on ? "is-on" : ""}" data-cat="${c.id}"
              style="--c:${c.c};--cs:${hexToRgba(c.c, 0.14)}">
      <i class="cat-face">${esc(c.name.slice(0, 1))}</i>
      <span>${esc(c.name)}</span>
    </button>`;
  }).join("");
  html += `<button class="cat-cell ghost" data-cat="__new">
      <i class="cat-face">＋</i><span>新增</span>
    </button>`;
  $("#ed-cats").innerHTML = html;
}

function renderEditSubs() {
  const box = $("#ed-subs");
  const subs = catsOf(ST.editDir, ST.editCat);
  if (!subs.length) { box.className = "subs is-empty"; box.innerHTML = ""; return; }
  box.className = "subs";
  box.innerHTML = subs.map((s) => `
    <button class="sub ${s.name === ST.editSub ? "is-on" : ""}" data-sub="${esc(s.name)}">${esc(s.name)}</button>`).join("");
}

function pickEditCat(id) {
  if (id === "__new") { openCatMgr(ST.editDir); return; }
  ST.editCat = id;
  ST.editSub = ST.subOf[id] || firstSubName(id);
  renderEditCats();
  renderEditSubs();
  renderAmount(true);
  const box = $("#ed-subs");
  if (box) box.scrollLeft = 0;
}
function pickEditSub(name) {
  ST.editSub = name;
  ST.subOf[ST.editCat] = name;
  renderEditSubs();
  renderAmount(true);
  const on = $("#ed-subs .sub.is-on");
  if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
}

function shakeAmount() {
  const el = $("#ed-win");
  el.classList.remove("is-shake");
  void el.offsetWidth;
  el.classList.add("is-shake");
}

async function saveEdit(again) {
  const amount = Math.round((parseFloat(ST.draft || "0") || 0) * 100) / 100;
  if (!(amount > 0)) { shakeAmount(); toast("先输个金额"); return; }
  if (!ST.editCat || !CATS.some((c) => c.id === ST.editCat)) {
    toast("先在分类管理里加一个项目");
    return;
  }

  const [y, mo, d] = ST.editDate.split("-").map(Number);
  const now = new Date();
  const picked = new Date(y, mo - 1, d, now.getHours(), now.getMinutes(), now.getSeconds()).getTime();

  let at = picked;
  let old = null;
  if (ST.editId) {
    old = ST.txns.find((x) => x.id === ST.editId);
    /* 日期没动就保留原来的时分秒，避免改个备注把时间也改了 */
    if (old && dayKey(old.at) === ST.editDate) at = old.at;
  }

  const item = {
    id: ST.editId || uid("t"),
    at,
    amount,
    dir: ST.editDir,
    cat: ST.editCat,
    sub: ST.editSub || "",
    note: ($("#ed-note").value || "").trim(),
    inTrack: ST.editInTrack,
    origin: old ? (old.origin || "manual") : "manual",
    createdAt: old ? old.createdAt : Date.now(),
    updatedAt: Date.now()
  };

  if (old) {
    const i = ST.txns.indexOf(old);
    ST.txns[i] = item;
  } else {
    ST.txns.push(item);
  }
  ST.txns.sort((a, b) => b.at - a.at);
  await dbPut("txns", item);

  ST.prefs.lastCat = ST.editCat;
  ST.prefs.lastDir = ST.editDir;
  saveMeta();

  buzz(10);
  renderBook();
  renderTrack();
  renderStat();
  renderMeStats();

  if (again) {
    ST.draft = "";
    $("#ed-note").value = "";
    renderAmount();
    toast("记下了，接着记下一笔");
  } else {
    closeEdit();
    toast(old ? "已更新" : `记下 ${ST.editDir === "out" ? "-" : "+"}${fmtMoney(amount)}`);
  }
}

/* =========================================================
   分类管理
   ========================================================= */
function openCatMgr(dir, from) {
  ST.mgrDir = dir || ST.editDir || "out";
  ST.mgrFrom = from || "edit";
  renderCatMgr();
  if (ST.mgrFrom === "me") $("#sheet-me").classList.remove("is-open");
  else $("#sheet-edit").classList.remove("is-open");
  $("#sheet-cat").classList.add("is-open");
}
function renderCatMgr() {
  $$("#mgr-dir button").forEach((b) => b.classList.toggle("is-on", b.dataset.dir === ST.mgrDir));
  const tops = catsOf(ST.mgrDir, "");
  $("#mgr-list").innerHTML = tops.map((c) => {
    const subs = catsOf(ST.mgrDir, c.id);
    return `<div class="mgr-row" data-id="${c.id}">
      <span class="mgr-dot" style="background:${c.c}"></span>
      <div class="mgr-main">
        <b>${esc(c.name)}</b>
        ${subs.length ? `<div class="mgr-subs">${subs.map((s) => `<span>${esc(s.name)}</span>`).join("")}</div>` : ""}
      </div>
      <button class="mgr-act" data-act="edit" aria-label="修改">✎</button>
      <button class="mgr-act del" data-act="del" aria-label="删除">✕</button>
    </div>`;
  }).join("") || `<p class="f-hint">这一类还没有项目，点下面新增。</p>`;
}

async function addCat() {
  const cat = {
    id: uid("c"),
    name: "新项目",
    dir: ST.mgrDir,
    c: PALETTE[Math.floor(Math.random() * PALETTE.length)],
    parent: "",
    order: Date.now()
  };
  CATS.push(cat);
  await dbPut("cats", cat);
  renderCatMgr();
  editCatDialog(cat);
}

async function delCat(cat) {
  const subs = catsOf(cat.dir, cat.id);
  const used = ST.txns.filter((t) => t.cat === cat.id).length;
  const msg = `删除「${cat.name}」` +
    (subs.length ? `和它下面的 ${subs.length} 个子项目` : "") + `？` +
    (used ? `\n\n有 ${used} 笔账用了它，删除后这些账显示为「未分类」，金额和笔数都不变。` : "");
  if (!confirm(msg)) return;
  CATS = CATS.filter((c) => c.id !== cat.id && c.parent !== cat.id);
  await dbDel("cats", cat.id);
  for (const s of subs) await dbDel("cats", s.id);
  if (ST.editCat === cat.id) {
    ST.editCat = firstCatId(ST.editDir);
    ST.editSub = firstSubName(ST.editCat);
  }
  renderCatMgr();
  renderEdit();
  renderBook();
  renderStat();
  toast("已删除");
}

let modalOk = null;
function openModal(opt) {
  $("#m-title").textContent = opt.title || "";
  $("#m-body").innerHTML = opt.body || "";
  $("#m-ok").textContent = opt.okText || "确定";

}
function closeModal() {

function editCatDialog(cat) {
  const subs = catsOf(cat.dir, cat.id);
  let picked = cat.c;
  let subsHtml = subs.map((s) => `<span class="f-sub">${esc(s.name)}<button data-del="${s.id}" aria-label="删">×</button></span>`).join("");

  openModal({
    title: "修改项目",
    okText: "保存",
    body: `
      <div class="f-row"><label>名称</label>
        <input class="f-in" id="cf-name" maxlength="8" value="${esc(cat.name)}" />
      </div>
      <div class="f-row"><label>颜色</label>
        <div class="f-colors" id="cf-colors">
          ${PALETTE.map((c) => `<button class="f-c ${c === picked ? "is-on" : ""}" data-c="${c}" style="--c:${c}" aria-label="选色"></button>`).join("")}
        </div>
      </div>
      <div class="f-row"><label>子项目</label>
        <div class="f-subs" id="cf-subs">${subsHtml || `<span class="f-hint" style="margin:0">还没有子项目</span>`}</div>
        <div class="f-add">
          <input class="f-in" id="cf-sub" placeholder="加一个，如「午餐」" maxlength="8" />
          <button id="cf-sub-add">加</button>
        </div>
      </div>
    `,
    onOpen: (body) => {
      body.querySelector("#cf-colors").addEventListener("click", (e) => {
        const b = e.target.closest(".f-c");
        if (!b) return;
        picked = b.dataset.c;
        $$("#cf-colors .f-c").forEach((x) => x.classList.toggle("is-on", x === b));
      });

      const addSub = async () => {
        const input = body.querySelector("#cf-sub");
        const name = input.value.trim();
        if (!name) { input.focus(); return; }
        if (catsOf(cat.dir, cat.id).some((s) => s.name === name)) { toast("已经有这个子项目了"); return; }
        const s = {
          id: uid("s"), name, dir: cat.dir, c: cat.c,
          parent: cat.id, order: Date.now()
        };
        CATS.push(s);
        await dbPut("cats", s);
        input.value = "";
        upsertSubChip(body, s);
      };
      body.querySelector("#cf-sub-add").addEventListener("click", addSub);
      body.querySelector("#cf-sub").addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); addSub(); }
      });

      body.addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-del]");
        if (!btn) return;
        const id = btn.dataset.del;
        CATS = CATS.filter((c) => c.id !== id);
        await dbDel("cats", id);
        const chip = btn.closest(".f-sub");
        if (chip) chip.remove();
        if (!body.querySelectorAll(".f-sub").length) {
          body.querySelector("#cf-subs").innerHTML = `<span class="f-hint" style="margin:0">还没有子项目</span>`;
        }
      });
    },
    onOk: async () => {
      const name = ($("#cf-name").value || "").trim();
      if (!name) { toast("名称不能为空"); return false; }
      cat.name = name;
      cat.c = picked;
      await dbPut("cats", cat);
      CATS = CATS.map((c) => (c.id === cat.id ? cat : c));
      /* 子项目跟着换色 */
      for (const s of catsOf(cat.dir, cat.id)) {
        s.c = picked;
        await dbPut("cats", s);
      }
      renderCatMgr();
      renderEdit();
      renderBook();
      renderStat();
      closeModal();
      toast("已保存");
      return true;
    }
  });
}
function upsertSubChip(body, s) {
  const box = body.querySelector("#cf-subs");
  const empty = box.querySelector(".f-hint");
  if (empty) empty.remove();
  const span = document.createElement("span");
  span.className = "f-sub";
  span.innerHTML = `${esc(s.name)}<button data-del="${s.id}" aria-label="删">×</button>`;
  box.appendChild(span);
}

/* =========================================================
   统计
   ========================================================= */
function statPeriod() {
  const a = ST.statAnchor;
  if (ST.statRange === "month") {
    const d = new Date(a.getFullYear(), a.getMonth(), 1);
    return {
      start: d.getTime(),
      end: new Date(a.getFullYear(), a.getMonth() + 1, 1).getTime(),
      label: `${a.getFullYear()}年${a.getMonth() + 1}月`,
      anchorMonth: d
    };
  }
  const d = new Date(a.getFullYear(), 0, 1);
  return {
    start: d.getTime(),
    end: new Date(a.getFullYear() + 1, 0, 1).getTime(),
    label: `${a.getFullYear()}年`,
    anchorMonth: d
  };
}

/** 柱状图要覆盖的 12 个月：月视图 = 往前 11 个月，年视图 = 该年 1–12 月 */
function barMonths() {
  const p = statPeriod();
  const base = new Date(p.anchorMonth);
  const out = [];
  const startM = ST.statRange === "year"
    ? new Date(base.getFullYear(), 0, 1)
    : new Date(base.getFullYear(), base.getMonth() - 11, 1);
  for (let i = 0; i < 12; i++) {
    const s = new Date(startM.getFullYear(), startM.getMonth() + i, 1);
    out.push({
      s: s.getTime(),
      e: new Date(s.getFullYear(), s.getMonth() + 1, 1).getTime(),
      m: s.getMonth() + 1,
      y: s.getFullYear()
    });
  }
  return out;
}

function renderStat() {
  const p = statPeriod();
  const inRange = ST.txns.filter((t) => t.at >= p.start && t.at < p.end);
  const s = sumOf(inRange);

  const nowM = new Date();
  const isNowMonth = ST.statRange === "month" && p.anchorMonth.getFullYear() === nowM.getFullYear() && p.anchorMonth.getMonth() === nowM.getMonth();
  const isNowYear = ST.statRange === "year" && p.anchorMonth.getFullYear() === nowM.getFullYear();

  const months = barMonths();
  const mdata = months.map((m) => sumOf(ST.txns.filter((t) => t.at >= m.s && t.at < m.e)));
  const maxV = Math.max(1, ...mdata.map((x) => Math.max(x.inc, x.out)));
  const hasBar = mdata.some((x) => x.inc > 0 || x.out > 0);

  /* 分类聚合 */
  const byCat = new Map();
  inRange.filter((t) => t.dir === ST.statDir).forEach((t) => {
    const k = t.cat || "";
    byCat.set(k, (byCat.get(k) || 0) + t.amount);
  });
  const ranks = Array.from(byCat.entries())
    .map(([id, v]) => ({ id, v, c: catById(id) }))
    .sort((a, b) => b.v - a.v);
  const rankTotal = ranks.reduce((x, r) => x + r.v, 0);

  $("#stat").innerHTML = `
    <div class="stat-body">
    <div class="st-tabs" id="st-tabs">
      <button class="${ST.statRange === "month" ? "is-on" : ""}" data-r="month">按月</button>
      <button class="${ST.statRange === "year" ? "is-on" : ""}" data-r="year">按年</button>
    </div>

    <div class="st-period">
      <button id="st-prev" aria-label="上一段">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <b>${p.label}</b>
      <button id="st-next" aria-label="下一段" ${(isNowMonth || isNowYear) ? "disabled" : ""}>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <div class="st-hero">
      <div class="c"><em>收入</em><b class="in">${fmtMoney(s.inc)}</b></div>
      <div class="c"><em>支出</em><b class="out">${fmtMoney(s.out)}</b></div>
      <div class="c"><em>结余</em><b class="${s.bal < 0 ? "neg" : "bal"}">${fmtMoney(s.bal)}</b></div>
    </div>

    <div class="st-card">
      <h3>
        <span>收支统计<em style="margin-left:7px">${ST.statRange === "year" ? "全年 12 个月" : "近 12 个月"}</em></span>
        <span class="lg-wrap">
          <span class="lg" style="color:var(--brand)"><i style="background:var(--brand)"></i>收入</span>
          <span class="lg" style="color:var(--danger)"><i style="background:var(--danger)"></i>支出</span>
        </span>
      </h3>
      ${hasBar ? `
      <div class="bars">
        ${mdata.map((x) => `<div class="bar-col">
          <div class="bar in" style="height:${Math.max(2, (x.inc / maxV) * 100)}%"></div>
          <div class="bar out" style="height:${Math.max(2, (x.out / maxV) * 100)}%"></div>
        </div>`).join("")}
      </div>
      <div class="bar-x">
        ${months.map((m) => `<span class="${m.m === nowM.getMonth() + 1 && m.y === nowM.getFullYear() ? "is-now" : ""}">${m.m}</span>`).join("")}
      </div>` : `<div class="empty" style="padding:34px 0">这 12 个月还没有收支</div>`}
    </div>

    <div class="st-card">
      <h3>
        <span>${ST.statDir === "out" ? "支出" : "收入"}构成</span>
        <span class="st-mini" id="st-dir">
          <button data-d="out" class="${ST.statDir === "out" ? "is-on" : ""}">支出</button>
          <button data-d="in" class="${ST.statDir === "in" ? "is-on" : ""}">收入</button>
        </span>
      </h3>
      ${rankTotal ? `
      <div class="share-wrap">
        <div class="donut-box">
          <div class="donut" style="background:${donutOf(ranks, rankTotal)}"></div>
          <div class="donut-mid"><b>${fmtMoney(rankTotal)}</b><span>共 ${ranks.length} 项</span></div>        </div>
        <div class="share-legend">
          ${ranks.slice(0, 5).map((r) => `<div class="sl-row">
            <i style="background:${r.c.c}"></i>
            <span>${esc(r.c.name)}</span>
            <b>${((r.v / rankTotal) * 100).toFixed(1)}%</b>
          </div>`).join("")}
          ${ranks.length > 5 ? `<div class="sl-row"><i style="background:var(--line-2)"></i><span>其他 ${ranks.length - 5} 项</span><b>${((ranks.slice(5).reduce((a, b) => a + b.v, 0) / rankTotal) * 100).toFixed(1)}%</b></div>` : ""}
        </div>
      </div>` : `<div class="empty" style="padding:16px 0">这段时间没有${ST.statDir === "out" ? "支出" : "收入"}</div>`}
    </div>

    ${ranks.length ? `<div class="st-card">
      <h3><span>${ST.statDir === "out" ? "支出" : "收入"}明细</span><em>按金额排序</em></h3>

/** 环图：conic-gradient 拼色，中间由 CSS mask 掏空 */
function donutOf(ranks, total) {
  let acc = 0;
  const stops = ranks.map((r) => {
    const from = (acc / total) * 100;
    acc += r.v;
    const to = (acc / total) * 100;
    return `${r.c.c} ${from.toFixed(2)}% ${to.toFixed(2)}%`;
  });
  return `conic-gradient(${stops.join(",")})`;
}

/* =========================================================
   分类下钻：点统计页的一级分类，看它内部的二级构成
   颜色在这里收敛成同一色相，靠明度阶梯区分 —— 一级已经统一，
   下钻层再上花色，层级感就没了。
   ========================================================= */
const CS = { catId: "" };

function rampColor(i, n) {
  const t = n <= 1 ? 0 : i / (n - 1);
  const dark = document.documentElement.dataset.theme === "dark";
  const L = dark ? 70 - t * 34 : 30 + t * 44;
  const S = dark ? 26 - t * 9 : 34 - t * 13;
  return `hsl(155 ${S.toFixed(0)}% ${L.toFixed(0)}%)`;
}

function prevPeriod() {
  const a = ST.statAnchor;
  if (ST.statRange === "month") {
    const d = new Date(a.getFullYear(), a.getMonth() - 1, 1);
    return {
      start: d.getTime(),
      end: new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime(),
      label: `${d.getMonth() + 1}月`
    };
  }
  const d = new Date(a.getFullYear() - 1, 0, 1);
  return {
    start: d.getTime(),
    end: new Date(d.getFullYear() + 1, 0, 1).getTime(),
    label: `${d.getFullYear()}年`
  };
}

/** 下钻页点二级：按当前分类 + 期间 + 方向重新筛，不依赖渲染时的缓存 */
function openSubTxns(subName) {
  const cat = catById(CS.catId);
  const p = statPeriod();
  const dir = ST.statDir;
  const isOrphan = !cat.id;
  const list = ST.txns.filter((t) => {
    if (t.dir !== dir || t.at < p.start || t.at >= p.end) return false;
    if ((t.sub || "未分类") !== subName) return false;
    return isOrphan ? !CATS.some((c) => c.id === t.cat) : t.cat === cat.id;
  }).sort((a, b) => b.at - a.at);
  openTxns(`${cat.name} · ${subName}`, list, dir);
}

function renderCatStat() {
  const cat = catById(CS.catId);
  const p = statPeriod();
  const dir = ST.statDir;
  const unit = dir === "out" ? "支出" : "收入";
  $("#cs-title").textContent = cat.name;

  /* 未分类（分类被删或导入没映射上）也能进来，按「查无此分类」过滤 */
  const isOrphan = !cat.id;
  const pick = (s, e) => ST.txns.filter((t) => {
    if (t.dir !== dir || t.at < s || t.at >= e) return false;
    return isOrphan ? !CATS.some((c) => c.id === t.cat) : t.cat === cat.id;
  });
  const list = pick(p.start, p.end);
  const total = list.reduce((a, t) => a + t.amount, 0);
  const n = list.length;
  const avg = n ? total / n : 0;

  const pv = prevPeriod();
  const prevTotal = pick(pv.start, pv.end).reduce((a, t) => a + t.amount, 0);
  const chg = prevTotal > 0 ? ((total - prevTotal) / prevTotal) * 100 : null;

  const bySub = new Map();
  for (const t of list) {
    const k = t.sub || "未分类";
    bySub.set(k, (bySub.get(k) || 0) + t.amount);
  }
  const raw = [...bySub.entries()].map(([name, v]) => ({ name, v })).sort((a, b) => b.v - a.v);
  const subs = raw.map((s, i) => ({ ...s, c: { c: rampColor(i, raw.length) } }));
  const subCnt = (name) => list.filter((t) => (t.sub || "未分类") === name).length;

  const months = barMonths();
  const mdata = months.map((m) => pick(m.s, m.e).reduce((a, t) => a + t.amount, 0));

  const denom = total || 1;

  $("#cs-body").innerHTML = `
    <div class="cs-hero">
      <div class="c"><em>${ST.statRange === "month" ? ST.statAnchor.getMonth() + 1 + "月共" + unit : "全年共" + unit}</em><b>${fmtMoney(total)}</b></div>
      <div class="c"><em>笔数</em><b>${n}</b></div>
      <div class="c"><em>笔均</em><b>${fmtMoney(avg)}</b></div>
    </div>
    ${chg === null ? "" : `<p class="cs-compare">较${pv.label}<span class="${chg >= 0 ? "up" : "down"}">${chg >= 0 ? "↑" : "↓"} ${Math.abs(chg).toFixed(1)}%</span></p>`}

    <div class="st-card">
      <h3><span>月度走势</span><em>${ST.statRange === "year" ? "全年 12 个月" : "近 12 个月"}</em></h3>
      ${total ? `<div class="bars">
        ${mdata.map((v, i) => `<div class="bar-col">
          <div class="bar" style="height:${Math.max(2, (v / maxV) * 100)}%;background:${rampColor(i, 12)}"></div>
        </div>`).join("")}
      </div>
      <div class="bar-x">
        ${months.map((m) => `<span class="${m.m === now.getMonth() + 1 && m.y === now.getFullYear() ? "is-now" : ""}">${m.m}</span>`).join("")}
      </div>` : `<div class="empty" style="padding:16px 0">还没有记录</div>`}
    </div>

    ${raw.length ? `<div class="st-card">
      <h3><span>${unit}占比</span><em>${raw.length} 项</em></h3>
      <div class="share-wrap">
        <div class="donut-box">
          <div class="donut" style="background:${donutOf(subs, denom)}"></div>
          <div class="donut-mid"><b>${fmtMoney(total)}</b><span>共 ${n} 笔</span></div>
        </div>
        <div class="share-legend">
          ${subs.slice(0, 5).map((s) => `<div class="sl-row">
            <i style="background:${s.c.c}"></i>
            <span>${esc(s.name)}</span>
            <b>${((s.v / denom) * 100).toFixed(1)}%</b>
          </div>`).join("")}
          ${subs.length > 5 ? `<div class="sl-row"><i style="background:var(--line-2)"></i><span>其他 ${subs.length - 5} 项</span><b>${((subs.slice(5).reduce((a, b) => a + b.v, 0) / denom) * 100).toFixed(1)}%</b></div>` : ""}
        </div>
      </div>
    </div>

    <div class="st-card">
      <h3><span>${unit}数据</span><em>点一行看账单</em></h3>
      <div class="cs-list">
        ${subs.map((s) => `<div class="cs-row is-click" data-sub="${esc(s.name)}" role="button" tabindex="0">
          <div class="cs-top">
            <span class="cs-name">${esc(s.name)}<span class="cs-go">›</span></span>
            <span class="cs-amt">${dir === "out" ? "-" : "+"}${fmtMoney(s.v)}</span>
          </div>
          <div class="cs-meta">
            <span>${subCnt(s.name)} 笔</span>
            <span>${((s.v / denom) * 100).toFixed(1)}%</span>
          </div>
          <span class="cs-bar"><i style="width:${(s.v / denom) * 100}%;background:${s.c.c}"></i></span>
        </div>`).join("")}
      </div>
    </div>` : `<div class="st-card"><div class="cs-empty">这段时间这个分类没有记录</div></div>`}
  `;
}

/* =========================================================
   轨迹
   ========================================================= */
function renderTrack() {
  const box = $("#track");
  const days = new Map();
  const touch = (ts) => {
    const k = dayKey(ts);
    if (!days.has(k)) days.set(k, { key: k, at: startOfDay(ts).getTime(), notes: [], out: 0, inc: 0, n: 0, trackTxns: [] });
    return days.get(k);
  };
  ST.notes.forEach((n) => { if (n.big) touch(n.at).notes.push(n); });
  ST.txns.forEach((t) => {
    const d = touch(t.at);
    d.n++;
    if (t.dir === "out") d.out += t.amount; else d.inc += t.amount;
    if (t.inTrack) d.trackTxns.push(t);
  });

  const arr = Array.from(days.values()).sort((a, b) => b.key.localeCompare(a.key));
  if (!arr.length) {
    box.innerHTML = `<div class="empty"><b>轨迹还是空的</b>记一笔账，或写一条标为「大事」的随笔，这里就会长出来</div>`;
    return;
  }

  box.innerHTML = arr.map((d) => {
    const dt = new Date(d.at);
    const hasMile = d.notes.length > 0;
    let inner = "";
    d.notes.forEach((n) => { inner += `<div class="mile">${esc(n.text)}</div>`; });
    d.trackTxns.forEach((t) => {
      const c = catById(t.cat);
      inner += `<div class="mile mile-tx">
        <span style="width:6px;height:6px;border-radius:50%;background:${c.c};flex:0 0 auto"></span>
        <span>${esc(catLabel(t))}${t.note ? " · " + esc(t.note) : ""}</span>
        <span class="mt-amt">${t.dir === "out" ? "-" : "+"}${fmtMoney(t.amount)}</span>
      </div>`;
    });
    if (d.n && !hasMile && !d.trackTxns.length) {
      inner += `<div class="tr-hint">这一天的记录没标进轨迹</div>`;
    }
    if (d.n) {
      const parts = [];
      if (d.out) parts.push(`支出 <b>¥${fmtMoney(d.out)}</b>`);
      if (d.inc) parts.push(`收入 <b>¥${fmtMoney(d.inc)}</b>`);
      parts.push(`${d.n} 笔`);
      inner += `<div class="spend">${parts.join('<span class="sep">·</span>')}</div>`;
    }
    return `<div class="day ${hasMile ? "has-mile" : ""}">
      <span class="day-dot"></span>
      <div class="day-label"><b>${dt.getMonth() + 1}/${dt.getDate()}</b> 周${WEEK_CN[dt.getDay()]}</div>
      ${inner}
    </div>`;
  }).join("");
}

function currentPlans() {
  const wk = weekKey();
  return ST.plans.filter((p) => p.week === wk);
}
let rateArr = [];

function renderPlan() {
  const box = $("#plan");
  const list = currentPlans();
  const must = list.filter((p) => p.kind === "must");
  const stretch = list.filter((p) => p.kind === "stretch");
  const doneMust = must.filter((p) => p.done).length;
  const rate = must.length ? Math.round((doneMust / must.length) * 100) : 0;

  const row = (p) => `<div class="pl-item ${p.done ? "done" : ""} ${p.kind === "stretch" ? "stretch" : ""}" data-id="${p.id}">
    <span class="pl-box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
    <span class="pl-text">${esc(p.title)}</span>
  </div>`;

  box.innerHTML = `
    <div class="plan-h">
      <h2>本周</h2>
      <span class="week-lb">${weekRangeLabel()}</span>
    </div>
    <div class="rate-box">
      <span class="rate-well"${must.length ? "" : " hidden"}>
        <span class="wheels" id="rate-wheels"></span><span class="pct">%</span>
      </span>
      <span class="rate-cap">${must.length ? `必做 <b>${doneMust}/${must.length}</b>` : "还没有必做事项"}</span>
    </div>

    <div class="pl-sec">
      <div class="pl-sec-h">必做</div>
      ${must.length ? must.map(row).join("") : `<div class="pl-empty">这周必须完成的事，加一条</div>`}
    </div>

    <div class="pl-sec">
      <div class="pl-sec-h">弹性目标</div>
      ${stretch.length ? stretch.map(row).join("") : `<div class="pl-empty">想做但不强求，不计入达标率</div>`}
    </div>
  `;
  /* 每次都是新 DOM，旧轮子引用已失效，必须从空数组重来 */
  rateArr.length = 0;
  if (must.length) setWheelGroup($("#rate-wheels"), rateArr, String(rate), 1, 0);
}
async function addPlan() {
  const input = $("#plan-input");

  if (!title) { input.focus(); return; }
  const p = { id: uid("p"), week: weekKey(), kind: ST.planKind, title, done: false, doneAt: 0, createdAt: Date.now() };
  ST.plans.push(p);
  await dbPut("plans", p);
  input.value = "";
  renderPlan();
  renderMeStats();
  buzz(8);
}
async function togglePlan(id) {
  const p = ST.plans.find((x) => x.id === id);

  p.doneAt = p.done ? Date.now() : 0;

}

  const big = $("#n-big").getAttribute("aria-pressed") === "true";

function renderNoteFeed() {
  const box = $("#note-feed");
  const list = ST.notes.slice().sort((a, b) => b.at - a.at).slice(0, 60);
  if (!list.length) {
    box.innerHTML = `<div class="empty"><b>还没有随笔</b>想记什么就写，标了「大事」的会进轨迹</div>`;
    return;
  }
  let html = "";

    html += `<div class="nf-item ${n.big ? "is-big" : ""}" data-id="${n.id}">
      <span class="nf-time">${fmtHM(n.at)}</span>
      <span class="nf-text">${esc(n.text)}</span>
      ${n.big ? `<span class="nf-flag">大事</span>` : ""}
    </div>`;
  });
  box.innerHTML = html;
}

  const le = ST.prefs.lastExport;
  return total > 0 && (!le || Date.now() - le > 14 * 86400000);
}

/* =========================================================
   导入账单：CSV / XLSX，零依赖
   .xls（OLE2 二进制 BIFF）不支持 —— 自己写解析器要八百行，
   换来的只是省一次「另存为」。让用户另存为 xlsx/csv 更划算。
   ========================================================= */

/* CSV 编码：WPS 导出的中文 CSV 常是 GBK，utf-8 严格解码失败才退 */
async function readTextSmart(file) {
  const buf = await file.arrayBuffer();
  try {
    return new TextDecoder("utf-8", { fatal: true }).decode(buf);
  } catch (e) {
    try { return new TextDecoder("gbk").decode(buf); } catch (_) {}
    return new TextDecoder("utf-8").decode(buf);
  }
}

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", q = false;
  const s = text.replace(/^\uFEFF/, "");
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (q) {
      if (ch === '"') {
        if (s[i + 1] === '"') { cell += '"'; i++; }
        else q = false;
      } else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (ch !== "\r") cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

/* ---- ZIP：只认中央目录 + stored/deflate，够读 xlsx ---- */
async function unzipXlsx(buf) {
  const dv = new DataView(buf);
  const u8 = new Uint8Array(buf);
  let eocd = -1;
  const low = Math.max(0, u8.length - 66000);
  for (let i = u8.length - 22; i >= low; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("不是有效的 xlsx");
  const cnt = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const index = {};
  for (let i = 0; i < cnt; i++) {
    if (off + 46 > u8.length || dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize = dv.getUint32(off + 20, true);
    const nlen = dv.getUint16(off + 28, true);
    const elen = dv.getUint16(off + 30, true);
    const clen = dv.getUint16(off + 32, true);
    const lho = dv.getUint32(off + 42, true);
    const name = new TextDecoder().decode(u8.subarray(off + 46, off + 46 + nlen));
    index[name] = { method, csize, lho };
    off += 46 + nlen + elen + clen;
  }
  async function read(name) {
    const f = index[name];
    if (!f) return null;
    const nlen = dv.getUint16(f.lho + 26, true);
    const elen = dv.getUint16(f.lho + 28, true);
    const start = f.lho + 30 + nlen + elen;
    const data = u8.subarray(start, start + f.csize);
    if (f.method === 0) return new TextDecoder().decode(data);
    if (typeof DecompressionStream !== "function") {
      throw new Error("这个浏览器不支持解压 xlsx，请改用 CSV");
    }
    const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return await new Response(stream).text();
  }
  return { names: Object.keys(index), read };
}

function xlsxShared(xml) {
  if (!xml) return [];
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  return Array.from(doc.getElementsByTagName("si")).map((si) =>
    Array.from(si.getElementsByTagName("t")).map((t) => t.textContent).join("")
  );
}

const colIndexOf = (ref) => {
  const s = String(ref).replace(/[^A-Z]/gi, "").toUpperCase();
  let n = 0;
  for (let i = 0; i < s.length; i++) n = n * 26 + (s.charCodeAt(i) - 64);
  return n - 1;
};

function xlsxRows(xml, shared) {
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const out = [];
  for (const row of Array.from(doc.getElementsByTagName("row"))) {
    const arr = [];
    for (const c of Array.from(row.getElementsByTagName("c"))) {
      const col = colIndexOf(c.getAttribute("r") || "");
      const t = c.getAttribute("t");
      let v = "";
      if (t === "s") {
        const id = Number((c.getElementsByTagName("v")[0] || {}).textContent);
        v = shared[id] || "";
      } else if (t === "inlineStr") {
        v = Array.from(c.getElementsByTagName("t")).map((e) => e.textContent).join("");
      } else {
        const vn = c.getElementsByTagName("v")[0];
        v = vn ? vn.textContent : "";
      }
      arr[col] = v;
    }
    out.push(arr);
  }
  return out;
}

async function readXlsx(file) {
  const zip = await unzipXlsx(await file.arrayBuffer());
  const shared = xlsxShared(await zip.read("xl/sharedStrings.xml"));
  let sheetName = zip.names.find((n) => /^xl\/worksheets\/sheet1\.xml$/.test(n));
  if (!sheetName) sheetName = zip.names.filter((n) => /^xl\/worksheets\/.*\.xml$/.test(n)).sort()[0];
  if (!sheetName) throw new Error("这个文件里没有工作表");
  return xlsxRows(await zip.read(sheetName), shared);
}

/* 日期：支持 2026-11-18 / 2026/11/18 / 2026年11月18日 22:35，以及 Excel 序列号 */
function parseDateCell(raw) {
  const s = String(raw == null ? "" : raw).trim();
  if (!s) return 0;
  if (/^\d{5}(\.\d+)?$/.test(s)) {
    const n = Number(s);
    if (n > 20000 && n < 80000) return Math.round((n - 25569) * 86400000);
  }
  const m = s.match(/(\d{4})\D{1,2}(\d{1,2})\D{1,2}(\d{1,2})(?:\D{1,2}(\d{1,2}):(\d{1,2}))?/);
  if (!m) return 0;
  const y = +m[1], mo = +m[2], d = +m[3];
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return 0;
  return new Date(y, mo - 1, d, +(m[4] || 0), +(m[5] || 0)).getTime();
}

/* 表头识别：不写死列号，按名字找，兼容不同账本导出 */
function guessHeader(rows) {
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const r = (rows[i] || []).map((x) => String(x == null ? "" : x));
    const hasDate = r.some((x) => /日期|时间/.test(x));
    const hasAmt = r.some((x) => /金额/.test(x));
    if (hasDate && hasAmt) return i;
  }
  return -1;
}

function pickCol(head, kws, used) {
  for (let i = 0; i < head.length; i++) {
    const h = String(head[i] == null ? "" : head[i]);
    if (!h) continue;
    if (used.has(i)) continue;
    if (kws.some((k) => h.includes(k))) return i;
  }
  return -1;
}

/* 账单分类 → 现有分类：精确优先，再按名字互相包含 */
function matchCat(name, dir) {
  const pool = catsOf(dir, "");
  const norm = (s) => String(s).replace(/[\s·・\-—_/]/g, "");
  const n = norm(name);
  if (!n) return null;
  const exact = pool.find((c) => norm(c.name) === n);
  if (exact) return exact;
  const partial = pool.filter((c) => {
    const cn = norm(c.name);
    return cn && (cn.includes(n) || n.includes(cn));
  });
  /* 多个都能匹配时取名字最接近的 */
  partial.sort((a, b) => Math.abs(norm(a.name).length - n.length) - Math.abs(norm(b.name).length - n.length));
  return partial[0] || null;
}

const NEW_CAT_COLORS = ["#3d7a61", "#c4853f", "#5b7fa6", "#8f6ba8", "#c26b6b", "#4f8f8a", "#b07a4a", "#8b8478"];

async function importBill(file) {
  const nm = String(file.name || "").toLowerCase();
  let rows;
  try {
    if (nm.endsWith(".csv")) rows = parseCSV(await readTextSmart(file));
    else if (nm.endsWith(".xlsx")) rows = await readXlsx(file);
    else {
      toast("只认 .xlsx 和 .csv，.xls 请先另存为 xlsx");
      return;
    }
  } catch (e) {
    toast("这个文件读不了：" + (e.message || "格式不对"));
    return;
  }

  const hi = guessHeader(rows);
  if (hi < 0) {
    toast("没找到表头（需要同时有「日期」和「金额」两列）");
    return;
  }
  const head = rows[hi];
  const used = new Set();
  const col = {
    date: pickCol(head, ["日期", "交易时间", "时间"], used)
  };
  if (col.date >= 0) used.add(col.date);
  col.dir = pickCol(head, ["收支", "方向", "类型"], used); if (col.dir >= 0) used.add(col.dir);
  col.amount = pickCol(head, ["金额"], used); if (col.amount >= 0) used.add(col.amount);
  col.cat = pickCol(head, ["类别", "分类"], used); if (col.cat >= 0) used.add(col.cat);
  col.sub = pickCol(head, ["二级", "子类", "子分类"], used); if (col.sub >= 0) used.add(col.sub);
  col.note = pickCol(head, ["备注", "说明", "摘要"], used); if (col.note >= 0) used.add(col.note);

  if (col.date < 0 || col.amount < 0) {
    toast("缺「日期」或「金额」列，导不了");
    return;
  }

  const items = [];
  let bad = 0;
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i] || [];
    const at = parseDateCell(r[col.date]);
    const rawAmt = String(r[col.amount] == null ? "" : r[col.amount]).replace(/[^\d.\-]/g, "");
    const amt = Math.abs(parseFloat(rawAmt) || 0);
    if (!at || !(amt > 0)) { if (String(r[col.date] || "").trim() || rawAmt) bad++; continue; }
    const dirTxt = String(col.dir >= 0 ? r[col.dir] || "" : "");
    let dir = /收|入/.test(dirTxt) ? "in" : "out";
    if (!dirTxt) dir = /^-/.test(rawAmt) ? "out" : "in";
    items.push({
      at,
      dir,
      amount: Math.round(amt * 100) / 100,
      catName: String(col.cat >= 0 ? r[col.cat] || "" : "").trim(),
      subName: String(col.sub >= 0 ? r[col.sub] || "" : "").trim(),
      note: String(col.note >= 0 ? r[col.note] || "" : "").trim()
    });
  }

  if (!items.length) {
    toast("一行都没读出来");
    return;
  }

  /* 分类映射预演：命中就复用，没命中就排队新建 */
  const plan = { reuse: new Map(), create: new Map() };
  for (const it of items) {
    const name = it.catName || "未分类";
    if (plan.reuse.has(name) || plan.create.has(name)) continue;
    if (!it.catName) { plan.reuse.set("未分类", { id: "", name: "未分类" }); continue; }
    const hit = matchCat(name, it.dir);
    if (hit) plan.reuse.set(name, hit);
    else plan.create.set(name, it.dir);
  }

  /* 去重：多重集。指纹只用日期/方向/金额/备注 ——
     分类和二级可能被改名，放进去会导致同一笔认不出来 */
  const fp = (t) => `${dayKey(t.at)}|${t.dir}|${t.amount}|${t.note || ""}`;
  const pool = new Map();
  for (const t of ST.txns) pool.set(fp(t), (pool.get(fp(t)) || 0) + 1);
  let dup = 0;
  const fresh = [];
  for (const it of items) {
    const k = fp(it);
    const cur = pool.get(k) || 0;
    if (cur > 0) { pool.set(k, cur - 1); dup++; continue; }
    pool.set(k, 0);
    fresh.push(it);
  }

  const income = items.filter((x) => x.dir === "in").reduce((a, x) => a + x.amount, 0);
  const outcome = items.filter((x) => x.dir === "out").reduce((a, x) => a + x.amount, 0);

  const newList = Array.from(plan.create.keys());
  openModal({
    title: "导入账单",
    okText: fresh.length ? `导入 ${fresh.length} 笔` : "知道了",
    body: `
      <div class="f-row"><label>文件</label><div class="f-hint" style="margin:0">${esc(file.name)}</div></div>
      <div class="f-row"><label>读出来</label>
        <div class="f-hint" style="margin:0">
          共 ${items.length} 笔：支出 ${fmtMoney(outcome)} · 收入 ${fmtMoney(income)}
          ${bad ? `<br>${bad} 行没日期或金额，已跳过` : ""}
        </div>
      </div>
      <div class="f-row"><label>重复</label>
        <div class="f-hint" style="margin:0">${dup ? `${dup} 笔和已有账目一样，会跳过` : "没有重复"}</div>
      </div>
      <div class="f-row"><label>分类</label>
        <div class="f-hint" style="margin:0">
          ${Array.from(plan.reuse.entries()).map(([n, c]) => `${esc(n)} → ${esc(c.name)}`).join("、") || "—"}
          ${newList.length ? `<br>新建 ${newList.length} 个：${newList.map(esc).join("、")}` : ""}
        </div>
      </div>
      <p class="f-hint">导入只增不删，已有账目不受影响。导入后在统计页能按分类翻查。</p>`,
    onOk: async () => {
      if (!fresh.length) return true;
      await commitBillImport(fresh, plan);
      return true;
    }
  });
}

async function commitBillImport(items, plan) {
  /* 1 先补分类：新建的一级 + 它下面的二级 */
  const nameToId = new Map();
  for (const [n, c] of plan.reuse) nameToId.set(n, c.id);
  let seq = 0;
  for (const [n, dir] of plan.create) {
    const id = "im" + Date.now().toString(36) + (seq++);
    const cat = { id, name: n, dir, c: NEW_CAT_COLORS[seq % NEW_CAT_COLORS.length], parent: "", order: 900 + seq };
    CATS.push(cat);
    await dbPut("cats", cat);
    nameToId.set(n, id);
  }

  /* 2 二级：落在所属一级下面，重名不重复建 */
  const subIds = new Map();
  for (const it of items) {
    if (!it.subName) continue;
    const cid = nameToId.get(it.catName) ?? nameToId.get("未分类") ?? "";
    if (!cid) continue;
    const k = cid + "|" + it.subName;
    if (subIds.has(k)) continue;
    const exist = CATS.find((c) => c.parent === cid && c.name === it.subName);
    if (exist) { subIds.set(k, exist.name); continue; }
    const sid = "is" + Date.now().toString(36) + (seq++);
    const parent = catById(cid);
    const sub = { id: sid, name: it.subName, dir: parent.dir, c: parent.c, parent: cid, order: 900 + seq };
    CATS.push(sub);
    await dbPut("cats", sub);
    subIds.set(k, sub.name);
  }

  /* 3 流水 */
  const add = [];
  for (const it of items) {
    const cid = nameToId.get(it.catName) ?? nameToId.get("未分类") ?? "";
    const t = {
      id: uid("t"),
      at: it.at,
      amount: it.amount,
      dir: it.dir,
      cat: cid,
      sub: it.subName || "",
      note: it.note || "",
      inTrack: false,
      origin: "import",
      createdAt: Date.now()
    };
    add.push(t);
    ST.txns.push(t);
  }
  ST.txns.sort((a, b) => b.at - a.at);
  await dbBulkPut("txns", add);
  await dbBulkPut("cats", CATS);

  renderAll();
  toast(`导入了 ${add.length} 笔`);
}

async function wipeAll() {
  if (!confirm("清空所有数据？这会删掉全部账目、随笔、计划与备忘录。\n\n建议先导出备份。")) return;
  if (!confirm("真的要清空吗？此操作无法撤销。")) return;
  await dbClear("txns"); await dbClear("notes"); await dbClear("plans"); await dbClear("memos"); await dbClear("cats");
  ST.txns = []; ST.notes = []; ST.plans = []; ST.memos = [];
  CATS = buildSeed();
  await dbBulkPut("cats", CATS);
  ST.prefs.lastExport = 0;
  ST.prefs.opening = 0;
  saveMeta();
  renderAll();
  toast("已清空");
}

/* ---------- 长按（pointer 事件：触摸与鼠标都通） ---------- */
let suppressClickUntil = 0;
function bindLongPress(container, selector, onLong) {
  let timer = null, sx = 0, sy = 0;
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  container.addEventListener("pointerdown", (e) => {
    const row = e.target.closest(selector);
    if (!row) return;
    sx = e.clientX; sy = e.clientY;
    cancel();
    timer = setTimeout(() => {
      timer = null;
      suppressClickUntil = Date.now() + 600;
      buzz(18);
      onLong(row);
    }, 520);
  });
  container.addEventListener("pointermove", (e) => {
    if (!timer) return;
    if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) cancel();
  });
  container.addEventListener("pointerup", cancel);
  container.addEventListener("pointercancel", cancel);
  container.addEventListener("pointerleave", cancel);
  container.addEventListener("contextmenu", (e) => e.preventDefault());
}

/* ---------- 事件 ---------- */
function bindEvents() {
  /* tab */
  $("#tabbar").addEventListener("click", (e) => {
    const b = e.target.closest(".tab");

    if (Date.now() < suppressClickUntil) return;

      ST.txns.sort((a, b) => b.at - a.at);
      await dbPut("txns", item);
      renderBook(); renderTrack(); renderStat(); renderMeStats();

    });

  /* ---- 编辑面板 ---- */
  $("#ed-close").addEventListener("click", closeEdit);
  $("#ed-manage").addEventListener("click", () => openCatMgr(ST.editDir));
  $("#ed-dir").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    ST.editDir = b.dataset.dir;
    ST.editCat = (ST.prefs.lastCat && catById(ST.prefs.lastCat).dir === ST.editDir && catsOf(ST.editDir, "").some((c) => c.id === ST.prefs.lastCat))
      ? ST.prefs.lastCat : firstCatId(ST.editDir);

    renderEdit();
    buzz(6);
  });
  $("#ed-cats").addEventListener("click", (e) => {
    const b = e.target.closest(".cat-cell");
    if (!b) return;
    pickEditCat(b.dataset.cat);
    buzz(6);
  });
  $("#ed-subs").addEventListener("click", (e) => {
    const b = e.target.closest(".sub");
    if (!b) return;
    pickEditSub(b.dataset.sub);
    buzz(6);
  });
  $("#ed-pad").addEventListener("click", (e) => {
    const b = e.target.closest(".pk");
    if (!b) return;
    const k = b.dataset.k;
    if (k === "ok") { saveEdit(false); return; }

  $("#ed-date").addEventListener("click", openDatePop);
  $("#date-mask").addEventListener("click", closeDatePop);
  $("#dp-prev").addEventListener("click", () => {

  });
  $("#dp-next").addEventListener("click", () => {
    DP.m++; if (DP.m > 11) { DP.m = 0; DP.y++; }

  $("#dp-grid").addEventListener("click", (e) => {
    const b = e.target.closest(".dp-cell[data-k]");

  $("#date-pop .dp-foot").addEventListener("click", (e) => {
    const b = e.target.closest("[data-off]");
    if (!b) return;
    const d = new Date();
    d.setDate(d.getDate() - Number(b.dataset.off));
    setEditDate(dayKey(d.getTime()));
    closeDatePop();

  $("#ed-track").addEventListener("click", () => {
    ST.editInTrack = !ST.editInTrack;
    $("#ed-track").setAttribute("aria-pressed", String(ST.editInTrack));
    buzz(6);
  });
  const edNote = $("#ed-note");
  edNote.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); edNote.blur(); saveEdit(false); }
  });
  edNote.addEventListener("focus", () => {
    setTimeout(() => edNote.scrollIntoView({ block: "center", behavior: "smooth" }), 260);
  });

  /* ---- 分类管理 ---- */
  $("#close-cat").addEventListener("click", () => {
    $("#sheet-cat").classList.remove("is-open");
    if (ST.mgrFrom === "me") {
      $("#sheet-me").classList.add("is-open");
      renderMeStats();
    } else {
      $("#sheet-edit").classList.add("is-open");
      renderEdit();
    }
  });
  $("#mgr-dir").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    ST.mgrDir = b.dataset.dir;
    renderCatMgr();
    buzz(6);
  });
  $("#mgr-list").addEventListener("click", async (e) => {
    const row = e.target.closest(".mgr-row");
    if (!row) return;
    const cat = CATS.find((c) => c.id === row.dataset.id);
    if (!cat) return;
    const act = e.target.closest("[data-act]");
    if (!act) return;
    if (act.dataset.act === "edit") editCatDialog(cat);

  $("#mgr-add").addEventListener("click", addCat);

  /* ---- 弹层 ---- */
  $("#m-cancel").addEventListener("click", closeModal);
  $("#m-ok").addEventListener("click", async () => {
    if (!modalOk) { closeModal(); return; }
    const keep = await modalOk();
    if (keep !== false) closeModal();
  });
  $("#modal").addEventListener("click", (e) => {
    if (e.target === $("#modal")) closeModal();
  });

  /* ---- 随笔 ---- */
  $("#note-save").addEventListener("click", saveNote);
  $("#note-text").addEventListener("input", () => {
    const ta = $("#note-text");
    ta.rows = Math.min(6, Math.max(3, ta.value.split("\n").length + 1));
  });
  $("#n-big").addEventListener("click", () => {
    const on = $("#n-big").getAttribute("aria-pressed") === "true";
    $("#n-big").setAttribute("aria-pressed", String(!on));
    buzz(6);
  });
  bindLongPress($("#note-feed"), ".nf-item", async (row) => {
    const id = row.dataset.id;
    const item = ST.notes.find((x) => x.id === id);
    if (!item) return;
    ST.notes = ST.notes.filter((x) => x.id !== id);
    await dbDel("notes", id);
    renderNoteFeed(); renderTrack(); renderMeStats();
    toast("删了这条随笔", "撤销", async () => {
      ST.notes.push(item);
      ST.notes.sort((a, b) => b.at - a.at);
      await dbPut("notes", item);
      renderNoteFeed(); renderTrack(); renderMeStats();
      toast("已恢复");
    });
  });

  /* ---- 计划 ---- */
  $("#plan-add").addEventListener("click", addPlan);
  $("#plan-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); addPlan(); }
  });
  $("#plan-kind").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    ST.planKind = b.dataset.kind;
    $$("#plan-kind button").forEach((x) => x.classList.toggle("is-on", x === b));
    buzz(6);
  });
  $("#plan").addEventListener("click", (e) => {
    if (Date.now() < suppressClickUntil) return;
    const row = e.target.closest(".pl-item");
    if (row) togglePlan(row.dataset.id);
  });
  bindLongPress($("#plan"), ".pl-item", async (row) => {
    const id = row.dataset.id;
    ST.plans = ST.plans.filter((x) => x.id !== id);
    await dbDel("plans", id);
    renderPlan(); renderMeStats();
    toast("删掉了这一项");
  });

  /* ---- 备忘录 ---- */
  $("#memo-add").addEventListener("click", addMemo);
  $("#memo-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); addMemo(); }
  });
  $("#memo").addEventListener("click", (e) => {
    if (Date.now() < suppressClickUntil) return;
    const row = e.target.closest(".mm-item");
    if (row) toggleMemo(row.dataset.id);
  });
  bindLongPress($("#memo"), ".mm-item", async (row) => {
    const id = row.dataset.id;
    ST.memos = ST.memos.filter((x) => x.id !== id);
    await dbDel("memos", id);
    renderMemo();
    toast("删掉了这一条");
  });

  /* ---- 我的 ---- */
  $("#open-me").addEventListener("click", () => {
    $("#sheet-me").classList.add("is-open");
    renderMeStats();
  });
  $("#close-me").addEventListener("click", () => $("#sheet-me").classList.remove("is-open"));
  $("#btn-cats").addEventListener("click", () => openCatMgr("out", "me"));
  $("#btn-opening").addEventListener("click", editOpening);
  $("#btn-export").addEventListener("click", exportBackup);
  $("#btn-import").addEventListener("click", () => $("#file-import").click());
  $("#btn-bill").addEventListener("click", () => $("#file-bill").click());
  $("#file-bill").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) importBill(f);
    e.target.value = "";
  });
  $("#file-import").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) importBackup(f);
    e.target.value = "";
  });
  $("#btn-wipe").addEventListener("click", wipeAll);
  $("#cs-close").addEventListener("click", () => {
    closeTxns();
    $("#sheet-catstat").classList.remove("is-open");
  });
  $("#tx-close").addEventListener("click", closeTxns);
  $("#txn-mask").addEventListener("click", closeTxns);
  $("#cs-body").addEventListener("click", (e) => {
    const row = e.target.closest(".cs-row[data-sub]");
    if (row) openSubTxns(row.dataset.sub);
  });
  $("#stat").addEventListener("click", (e) => {
    const cell = e.target.closest("td.link[data-dir]");
    if (cell) { openMonthTxns(cell.dataset.s, cell.dataset.e, cell.dataset.dir); return; }
    const row = e.target.closest(".rank-row[data-cat]");
    if (row) openCatStat(row.dataset.cat);
  });
  $("#store-bar-x").addEventListener("click", () => {
    $("#store-bar").hidden = true;
    document.documentElement.style.setProperty("--bar-h", "0px");
  });
  const bp = $("#bpad-btn");
  if (bp) bp.addEventListener("click", () => {
    ST.prefs.browserPad = ST.prefs.browserPad === false;
    applyBpad();
    saveMeta();
    buzz(6);
  });
  $("#theme-row").addEventListener("click", (e) => {
    const b = e.target.closest(".theme-opt");
    if (!b) return;
    ST.prefs.theme = b.dataset.theme;
    applyTheme();
    saveMeta();
    buzz(6);
  });
}

/* ---------- 视口高度 ---------- */
/* 键盘弹出 / 地址栏伸缩 / 从后台回来，都要重算，否则底部 tab 会被顶出屏幕 */
function fixViewport() {
  const vv = window.visualViewport;
  const set = () => {
    const h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty("--vh", Math.round(h) + "px");
  };
  set();
  requestAnimationFrame(set);
  if (vv) {
    vv.addEventListener("resize", set);
    vv.addEventListener("scroll", set, { passive: true });
  }
  window.addEventListener("resize", set);
  window.addEventListener("orientationchange", () => setTimeout(set, 240));
  window.addEventListener("pageshow", set);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) setTimeout(set, 60);
  });
}

/* 浏览器内 vs 装成应用：底部工具栏是浮层，占位与否只能靠这个开关区分 */
function applyDisplayMode() {
  const mq = window.matchMedia ? window.matchMedia("(display-mode: standalone)") : null;
  const standalone = (mq && mq.matches) || window.navigator.standalone === true;
  document.documentElement.dataset.mode = standalone ? "app" : "browser";
  applyBpad();
  if (mq && mq.addEventListener) mq.addEventListener("change", applyDisplayMode);
}

/* 底部留白开关：真机上留白多了或少了，用户自己就能关/开 */
function applyBpad() {
  const on = ST.prefs.browserPad !== false;
  document.documentElement.dataset.bpad = on ? "on" : "off";
  const b = $("#bpad-btn");
  if (b) {
    b.classList.toggle("is-on", on);
    b.textContent = on ? "浏览器内底部留白 · 开" : "浏览器内底部留白 · 关";
  }
}

/* ---------- 启动 ---------- */
function renderAll() {
  renderBook();
  renderStat();
  renderTrack();
  renderPlan();
  renderMemo();
  renderNoteFeed();
  renderMeStats();
  renderEdit();
}

async function boot() {
  await initStore();

  let txns, notes, plans, memos, cats, meta;
  try {
    [txns, notes, plans, memos, cats, meta] = await Promise.all([
      dbAll("txns"), dbAll("notes"), dbAll("plans"), dbAll("memos"), dbAll("cats"), dbAll("meta")
    ]);
  } catch (e) {
    /* 能 open 但读不动（配额、损坏、被清权限）：退一级重试，不再白屏 */
    _db = null;
    try { indexedDB.deleteDatabase(DB_NAME); } catch (_) {}
    if (probeLS()) { STORE.mode = "ls"; }
    else { STORE.mode = "mem"; }
    [txns, notes, plans, memos, cats, meta] = await Promise.all([
      dbAll("txns"), dbAll("notes"), dbAll("plans"), dbAll("memos"), dbAll("cats"), dbAll("meta")
    ]);
  }

  ST.txns = txns.sort((a, b) => b.at - a.at);
  ST.notes = notes.sort((a, b) => b.at - a.at);
  ST.plans = plans;
  ST.memos = memos;
  CATS = cats;
  /* 第一次打开、或旧版本升级上来：写入默认分类 */
  if (!CATS.length) {
    CATS = buildSeed();
    await dbBulkPut("cats", CATS);
  }
  const p = meta.find((x) => x.k === "prefs");
  if (p && p.v) Object.assign(ST.prefs, p.v);

  if (!catsOf("out", "").length) {
    const extra = buildSeed().filter((c) => c.dir === "out");
    CATS = CATS.concat(extra);
    await dbBulkPut("cats", extra);
  }

  ST.editDir = ST.prefs.lastDir || "out";
  ST.editCat = (ST.prefs.lastCat && catById(ST.prefs.lastCat).dir === ST.editDir && catsOf(ST.editDir, "").some((c) => c.id === ST.prefs.lastCat))
    ? ST.prefs.lastCat : firstCatId(ST.editDir);
  ST.editSub = ST.subOf[ST.editCat] || firstSubName(ST.editCat);

  applyTheme();
  buildPad();
  initAmount();
  bindEvents();
  applyDisplayMode();
  fixViewport();
  renderAll();
  setPlanPane("plan");
  setView("book");
  showStoreBar();
}

/* 存储降级时的说明条：只在存不住 / 存得不稳时出现 */
function showStoreBar() {
  const bar = $("#store-bar");
  const txt = $("#store-bar-txt");
  if (!bar || !txt) return;
  if (STORE.mode === "mem") {
    txt.innerHTML = "浏览器禁用了本地存储，这次记的账关掉页面就没了。" +
      "<br>换 Safari / Chrome 直接打开本文件，或用 https 地址访问即可正常保存。";
    bar.hidden = false;
    bar.dataset.level = "mem";
    $("#store-bar-x").hidden = true;
  } else if (STORE.mode === "ls") {
    txt.innerHTML = "这个浏览器不让用 IndexedDB，已自动换成兼容存储，记账照常保存。" +
      "<br>如果之前记的账没显示，说明换了浏览器或打开方式，数据还在原来那个环境里。";
    bar.hidden = false;
    bar.dataset.level = "ls";
  } else {
    bar.hidden = true;
  }
  /* 提示条占的高度传给 toast，避免盖住标题栏 */
  const h = bar.hidden ? 0 : bar.offsetHeight;
  document.documentElement.style.setProperty("--bar-h", h + "px");
}

boot();

/* PWA：只在 http(s) 下注册，file:// 打开也不报错 */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
