/* =========================================================
   导入账单：CSV / XLSX，零依赖
   .xls（OLE2 二进制 BIFF）不支持 —— 自己写解析器要八百行，
   换来的只是省一次「另存为」。让用户另存为 xlsx/csv 更划算。
   ========================================================= */

/* CSV 编码：WPS 导出的中文 CSV 常是 GBK，utf-8 严格解码失败才退 */
async function readTextSmart(file) {
  const buf = await file.arrayBuffer();
  try {
    return new TextDecoder("utf-8", { fatal: true }).decode(buf);
  } catch (e) {
    try { return new TextDecoder("gbk").decode(buf); } catch (_) {}
    return new TextDecoder("utf-8").decode(buf);
  }
}

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", q = false;
  const s = text.replace(/^\uFEFF/, "");
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (q) {
      if (ch === '"') {
        if (s[i + 1] === '"') { cell += '"'; i++; }
        else q = false;
      } else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (ch !== "\r") cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

/* ---- ZIP：只认中央目录 + stored/deflate，够读 xlsx ---- */
async function unzipXlsx(buf) {
  const dv = new DataView(buf);
  const u8 = new Uint8Array(buf);
  let eocd = -1;
  const low = Math.max(0, u8.length - 66000);
  for (let i = u8.length - 22; i >= low; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("不是有效的 xlsx");
  const cnt = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const index = {};
  for (let i = 0; i < cnt; i++) {
    if (off + 46 > u8.length || dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize = dv.getUint32(off + 20, true);
    const nlen = dv.getUint16(off + 28, true);
    const elen = dv.getUint16(off + 30, true);
    const clen = dv.getUint16(off + 32, true);
    const lho = dv.getUint32(off + 42, true);
    const name = new TextDecoder().decode(u8.subarray(off + 46, off + 46 + nlen));
    index[name] = { method, csize, lho };
    off += 46 + nlen + elen + clen;
  }
  async function read(name) {
    const f = index[name];
    if (!f) return null;
    const nlen = dv.getUint16(f.lho + 26, true);
    const elen = dv.getUint16(f.lho + 28, true);
    const start = f.lho + 30 + nlen + elen;
    const data = u8.subarray(start, start + f.csize);
    if (f.method === 0) return new TextDecoder().decode(data);
    if (typeof DecompressionStream !== "function") {
      throw new Error("这个浏览器不支持解压 xlsx，请改用 CSV");
    }
    const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return await new Response(stream).text();
  }
  return { names: Object.keys(index), read };
}

function xlsxShared(xml) {
  if (!xml) return [];
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  return Array.from(doc.getElementsByTagName("si")).map((si) =>
    Array.from(si.getElementsByTagName("t")).map((t) => t.textContent).join("")
  );
}

const colIndexOf = (ref) => {
  const s = String(ref).replace(/[^A-Z]/gi, "").toUpperCase();
  let n = 0;
  for (let i = 0; i < s.length; i++) n = n * 26 + (s.charCodeAt(i) - 64);
  return n - 1;
};

function xlsxRows(xml, shared) {
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const out = [];
  for (const row of Array.from(doc.getElementsByTagName("row"))) {
    const arr = [];
    for (const c of Array.from(row.getElementsByTagName("c"))) {
      const col = colIndexOf(c.getAttribute("r") || "");
      const t = c.getAttribute("t");
      let v = "";
      if (t === "s") {
        const id = Number((c.getElementsByTagName("v")[0] || {}).textContent);
        v = shared[id] || "";
      } else if (t === "inlineStr") {
        v = Array.from(c.getElementsByTagName("t")).map((e) => e.textContent).join("");
      } else {
        const vn = c.getElementsByTagName("v")[0];
        v = vn ? vn.textContent : "";
      }
      arr[col] = v;
    }
    out.push(arr);
  }
  return out;
}

async function readXlsx(file) {
  const zip = await unzipXlsx(await file.arrayBuffer());
  const shared = xlsxShared(await zip.read("xl/sharedStrings.xml"));
  let sheetName = zip.names.find((n) => /^xl\/worksheets\/sheet1\.xml$/.test(n));
  if (!sheetName) sheetName = zip.names.filter((n) => /^xl\/worksheets\/.*\.xml$/.test(n)).sort()[0];
  if (!sheetName) throw new Error("这个文件里没有工作表");
  return xlsxRows(await zip.read(sheetName), shared);
}

/* 日期：支持 2026-11-18 / 2026/11/18 / 2026年11月18日 22:35，以及 Excel 序列号 */
function parseDateCell(raw) {
  const s = String(raw == null ? "" : raw).trim();
  if (!s) return 0;
  if (/^\d{5}(\.\d+)?$/.test(s)) {
    const n = Number(s);
    if (n > 20000 && n < 80000) return Math.round((n - 25569) * 86400000);
  }
  const m = s.match(/(\d{4})\D{1,2}(\d{1,2})\D{1,2}(\d{1,2})(?:\D{1,2}(\d{1,2}):(\d{1,2}))?/);
  if (!m) return 0;
  const y = +m[1], mo = +m[2], d = +m[3];
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return 0;
  return new Date(y, mo - 1, d, +(m[4] || 0), +(m[5] || 0)).getTime();
}

/* 表头识别：不写死列号，按名字找，兼容不同账本导出 */
function guessHeader(rows) {
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const r = (rows[i] || []).map((x) => String(x == null ? "" : x));
    const hasDate = r.some((x) => /日期|时间/.test(x));
    const hasAmt = r.some((x) => /金额/.test(x));
    if (hasDate && hasAmt) return i;
  }
  return -1;
}

function pickCol(head, kws, used) {
  for (let i = 0; i < head.length; i++) {
    const h = String(head[i] == null ? "" : head[i]);
    if (!h) continue;
    if (used.has(i)) continue;
    if (kws.some((k) => h.includes(k))) return i;
  }
  return -1;
}

/* 账单分类 → 现有分类：精确优先，再按名字互相包含 */
function matchCat(name, dir) {
  const pool = catsOf(dir, "");
  const norm = (s) => String(s).replace(/[\s·・\-—_/]/g, "");
  const n = norm(name);
  if (!n) return null;
  const exact = pool.find((c) => norm(c.name) === n);
  if (exact) return exact;
  const partial = pool.filter((c) => {
    const cn = norm(c.name);
    return cn && (cn.includes(n) || n.includes(cn));
  });
  /* 多个都能匹配时取名字最接近的 */
  partial.sort((a, b) => Math.abs(norm(a.name).length - n.length) - Math.abs(norm(b.name).length - n.length));
  return partial[0] || null;
}

const NEW_CAT_COLORS = ["#3d7a61", "#c4853f", "#5b7fa6", "#8f6ba8", "#c26b6b", "#4f8f8a", "#b07a4a", "#8b8478"];

async function importBill(file) {
  const nm = String(file.name || "").toLowerCase();
  let rows;
  try {
    if (nm.endsWith(".csv")) rows = parseCSV(await readTextSmart(file));
    else if (nm.endsWith(".xlsx")) rows = await readXlsx(file);
    else {
      toast("只认 .xlsx 和 .csv，.xls 请先另存为 xlsx");
      return;
    }
  } catch (e) {
    toast("这个文件读不了：" + (e.message || "格式不对"));
    return;
  }

  const hi = guessHeader(rows);
  if (hi < 0) {
    toast("没找到表头（需要同时有「日期」和「金额」两列）");
    return;
  }
  const head = rows[hi];
  const used = new Set();
  const col = {
    date: pickCol(head, ["日期", "交易时间", "时间"], used)
  };
  if (col.date >= 0) used.add(col.date);
  col.dir = pickCol(head, ["收支", "方向", "类型"], used); if (col.dir >= 0) used.add(col.dir);
  col.amount = pickCol(head, ["金额"], used); if (col.amount >= 0) used.add(col.amount);
  col.cat = pickCol(head, ["类别", "分类"], used); if (col.cat >= 0) used.add(col.cat);
  col.sub = pickCol(head, ["二级", "子类", "子分类"], used); if (col.sub >= 0) used.add(col.sub);
  col.note = pickCol(head, ["备注", "说明", "摘要"], used); if (col.note >= 0) used.add(col.note);

  if (col.date < 0 || col.amount < 0) {
    toast("缺「日期」或「金额」列，导不了");
    return;
  }

  const items = [];
  let bad = 0;
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i] || [];
    const at = parseDateCell(r[col.date]);
    const rawAmt = String(r[col.amount] == null ? "" : r[col.amount]).replace(/[^\d.\-]/g, "");
    const amt = Math.abs(parseFloat(rawAmt) || 0);
    if (!at || !(amt > 0)) { if (String(r[col.date] || "").trim() || rawAmt) bad++; continue; }
    const dirTxt = String(col.dir >= 0 ? r[col.dir] || "" : "");
    let dir = /收|入/.test(dirTxt) ? "in" : "out";
    if (!dirTxt) dir = /^-/.test(rawAmt) ? "out" : "in";
    items.push({
      at,
      dir,
      amount: Math.round(amt * 100) / 100,
      catName: String(col.cat >= 0 ? r[col.cat] || "" : "").trim(),
      subName: String(col.sub >= 0 ? r[col.sub] || "" : "").trim(),
      note: String(col.note >= 0 ? r[col.note] || "" : "").trim()
    });
  }

  if (!items.length) {
    toast("一行都没读出来");
    return;
  }

  /* 分类映射预演：命中就复用，没命中就排队新建 */
  const plan = { reuse: new Map(), create: new Map() };
  for (const it of items) {
    const name = it.catName || "未分类";
    if (plan.reuse.has(name) || plan.create.has(name)) continue;
    if (!it.catName) { plan.reuse.set("未分类", { id: "", name: "未分类" }); continue; }
    const hit = matchCat(name, it.dir);
    if (hit) plan.reuse.set(name, hit);
    else plan.create.set(name, it.dir);
  }

  /* 去重：多重集。指纹只用日期/方向/金额/备注 ——
     分类和二级可能被改名，放进去会导致同一笔认不出来 */
  const fp = (t) => `${dayKey(t.at)}|${t.dir}|${t.amount}|${t.note || ""}`;
  const pool = new Map();
  for (const t of ST.txns) pool.set(fp(t), (pool.get(fp(t)) || 0) + 1);
  let dup = 0;
  const fresh = [];
  for (const it of items) {
    const k = fp(it);
    const cur = pool.get(k) || 0;
    if (cur > 0) { pool.set(k, cur - 1); dup++; continue; }
    pool.set(k, 0);
    fresh.push(it);
  }

  const income = items.filter((x) => x.dir === "in").reduce((a, x) => a + x.amount, 0);
  const outcome = items.filter((x) => x.dir === "out").reduce((a, x) => a + x.amount, 0);

  const newList = Array.from(plan.create.keys());
  openModal({
    title: "导入账单",
    okText: fresh.length ? `导入 ${fresh.length} 笔` : "知道了",
    body: `
      <div class="f-row"><label>文件</label><div class="f-hint" style="margin:0">${esc(file.name)}</div></div>
      <div class="f-row"><label>读出来</label>
        <div class="f-hint" style="margin:0">
          共 ${items.length} 笔：支出 ${fmtMoney(outcome)} · 收入 ${fmtMoney(income)}
          ${bad ? `<br>${bad} 行没日期或金额，已跳过` : ""}
        </div>
      </div>
      <div class="f-row"><label>重复</label>
        <div class="f-hint" style="margin:0">${dup ? `${dup} 笔和已有账目一样，会跳过` : "没有重复"}</div>
      </div>
      <div class="f-row"><label>分类</label>
        <div class="f-hint" style="margin:0">
          ${Array.from(plan.reuse.entries()).map(([n, c]) => `${esc(n)} → ${esc(c.name)}`).join("、") || "—"}
          ${newList.length ? `<br>新建 ${newList.length} 个：${newList.map(esc).join("、")}` : ""}
        </div>
      </div>
`,
    onOk: async () => {
      if (!fresh.length) return true;
      await commitBillImport(fresh, plan);
      return true;
    }
  });
}

async function commitBillImport(items, plan) {
  /* 1 先补分类：新建的一级 + 它下面的二级 */
  const nameToId = new Map();
  for (const [n, c] of plan.reuse) nameToId.set(n, c.id);
  let seq = 0;
  for (const [n, dir] of plan.create) {
    const id = "im" + Date.now().toString(36) + (seq++);
    const cat = { id, name: n, dir, c: NEW_CAT_COLORS[seq % NEW_CAT_COLORS.length], parent: "", order: 900 + seq };
    CATS.push(cat);
    await dbPut("cats", cat);
    nameToId.set(n, id);
  }

  /* 2 二级：落在所属一级下面，重名不重复建 */
  const subIds = new Map();
  for (const it of items) {
    if (!it.subName) continue;
    const cid = nameToId.get(it.catName) ?? nameToId.get("未分类") ?? "";
    if (!cid) continue;
    const k = cid + "|" + it.subName;
    if (subIds.has(k)) continue;
    const exist = CATS.find((c) => c.parent === cid && c.name === it.subName);
    if (exist) { subIds.set(k, exist.name); continue; }
    const sid = "is" + Date.now().toString(36) + (seq++);
    const parent = catById(cid);
    const sub = { id: sid, name: it.subName, dir: parent.dir, c: parent.c, parent: cid, order: 900 + seq };
    CATS.push(sub);
    await dbPut("cats", sub);
    subIds.set(k, sub.name);
  }

  /* 3 流水 */
  const add = [];
  for (const it of items) {
    const cid = nameToId.get(it.catName) ?? nameToId.get("未分类") ?? "";
    const t = {
      id: uid("t"),
      at: it.at,
      amount: it.amount,
      dir: it.dir,
      cat: cid,
      sub: it.subName || "",
      note: it.note || "",
      inTrack: false,
      origin: "import",
      createdAt: Date.now()
    };
    add.push(t);
    ST.txns.push(t);
  }
  ST.txns.sort((a, b) => b.at - a.at);
  await dbBulkPut("txns", add);
  await dbBulkPut("cats", CATS);

  renderAll();
  toast(`导入了 ${add.length} 笔`);
}

async function wipeAll() {
  if (!confirm("清空所有数据？这会删掉全部账目、随笔、计划与备忘录。\n\n建议先导出备份。")) return;

}

/* ---------- 长按（pointer 事件：触摸与鼠标都通） ---------- */
let suppressClickUntil = 0;
function bindLongPress(container, selector, onLong) {
  let timer = null, sx = 0, sy = 0;
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  container.addEventListener("pointerdown", (e) => {
    const row = e.target.closest(selector);
    if (!row) return;
    sx = e.clientX; sy = e.clientY;
    cancel();
    timer = setTimeout(() => {
      timer = null;
      suppressClickUntil = Date.now() + 600;
      buzz(18);
      onLong(row);
    }, 520);
  });
  container.addEventListener("pointermove", (e) => {
    if (!timer) return;
    if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) cancel();
  });
  container.addEventListener("pointerup", cancel);
  container.addEventListener("pointercancel", cancel);
  container.addEventListener("pointerleave", cancel);
  container.addEventListener("contextmenu", (e) => e.preventDefault());
}

  const edNote = $("#ed-note");

    if (e.key === "Enter") { e.preventDefault(); edNote.blur(); saveEdit(false); }
  });
  edNote.addEventListener("focus", () => {
    setTimeout(() => edNote.scrollIntoView({ block: "center", behavior: "smooth" }), 260);
  });

  /* ---- 分类管理 ---- */
  $("#close-cat").addEventListener("click", () => {
    $("#sheet-cat").classList.remove("is-open");
    if (ST.mgrFrom === "me") {
      $("#sheet-me").classList.add("is-open");
      renderMeStats();
    } else {
      $("#sheet-edit").classList.add("is-open");
      renderEdit();
    }
  });
  $("#mgr-dir").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    ST.mgrDir = b.dataset.dir;
    renderCatMgr();
    buzz(6);
  });
  $("#mgr-list").addEventListener("click", async (e) => {
    const row = e.target.closest(".mgr-row");
    if (!row) return;
    const cat = CATS.find((c) => c.id === row.dataset.id);
    if (!cat) return;
    const act = e.target.closest("[data-act]");
    if (!act) return;
    if (act.dataset.act === "edit") editCatDialog(cat);
    else if (act.dataset.act === "del") await delCat(cat);
  });
  $("#mgr-add").addEventListener("click", addCat);

  /* ---- 弹层 ---- */
  $("#m-cancel").addEventListener("click", closeModal);
  $("#m-ok").addEventListener("click", async () => {
    if (!modalOk) { closeModal(); return; }
    const keep = await modalOk();
    if (keep !== false) closeModal();
  });
  $("#modal").addEventListener("click", (e) => {
    if (e.target === $("#modal")) closeModal();
  });

  /* ---- 轨迹 ---- */
  $("#tr-add").addEventListener("click", backfillTrack);
  $("#seg-track").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tpane]");
    if (b) setTrackPane(b.dataset.tpane);
  });
  bindMap();
  $("#v-track").addEventListener("click", (e) => {
    if (Date.now() < suppressClickUntil) return;
    const hit = e.target.closest("[data-nid]");
    if (hit) editMile(hit.dataset.nid);
  });

  /* ---- 随笔 ---- */
  $("#note-save").addEventListener("click", saveNote);
  $("#note-text").addEventListener("input", () => {
    const ta = $("#note-text");
    ta.rows = Math.min(6, Math.max(3, ta.value.split("\n").length + 1));
  });
  $("#n-big").addEventListener("click", () => {
    const on = $("#n-big").getAttribute("aria-pressed") === "true";
    $("#n-big").setAttribute("aria-pressed", String(!on));
    buzz(6);
  });
  $("#note-feed").addEventListener("click", (e) => {
    if (Date.now() < suppressClickUntil) return;
    const row = e.target.closest(".nc");
    if (row) editNote(row.dataset.id);
  });
  bindLongPress($("#note-feed"), ".nc", async (row) => {
    const id = row.dataset.id;
    const item = ST.notes.find((x) => x.id === id);
    if (!item) return;
    ST.notes = ST.notes.filter((x) => x.id !== id);
    await dbDel("notes", id);
    renderNoteFeed(); renderTrack(); renderMeStats();
    toast("删了这条随笔", "撤销", async () => {
      ST.notes.push(item);
      ST.notes.sort((a, b) => b.at - a.at);
      await dbPut("notes", item);
      renderNoteFeed(); renderTrack(); renderMeStats();
      toast("已恢复");
    });
  });

  /* ---- 目标 ---- */
  $("#pane-plan").addEventListener("click", (e) => {
    if (Date.now() < suppressClickUntil) return;
    if (e.target.closest("#g-prev")) { shiftGoalPeriod(-1); return; }
    if (e.target.closest("#g-next")) { shiftGoalPeriod(1); return; }
    if (e.target.closest("#g-label")) { ST.goalAnchor = Date.now(); renderGoals(); buzz(6); return; }
    if (e.target.closest("#goal-more")) { editGoal(null); return; }
    const it = e.target.closest("[data-act]");
    if (!it) return;
    editGoal(it.dataset.id);
  });
  bindLongPress($("#goal"), "[data-act]", async (row) => {
    const g = ST.goals.find((x) => x.id === row.dataset.id);
    if (!g) return;
    if (!confirm(`删掉「${g.title}」？`)) return;
    ST.goals = ST.goals.filter((x) => x.id !== g.id);
    await dbDel("goals", g.id);
    renderGoals(); renderMeStats();
    toast("删掉了这个目标");
  });

  /* ---- 计划 ---- */
  $("#memo-more").addEventListener("click", () => editMemo(null));
  $("#memo").addEventListener("click", (e) => {
    if (Date.now() < suppressClickUntil) return;
    const more = e.target.closest(".pl-more");
    if (more) { editMemo(more.dataset.more); return; }
    const row = e.target.closest(".pl-item");
    if (row) toggleMemo(row.dataset.id);
  });
  bindLongPress($("#memo"), ".pl-item", (row) => editMemo(row.dataset.id));
  $("#memo-top").addEventListener("click", (e) => {
    if (e.target.closest("#m-prev")) { shiftMemoWeek(-1); return; }
    if (e.target.closest("#m-next")) { shiftMemoWeek(1); return; }
    if (e.target.closest("#m-label")) { ST.memoAnchor = Date.now(); renderMemo(); buzz(6); }
  });

  /* ---- 我的 ---- */
  $("#open-me").addEventListener("click", () => {
    $("#sheet-me").classList.add("is-open");
    renderMeStats();
  });
  $("#close-me").addEventListener("click", () => $("#sheet-me").classList.remove("is-open"));
  $("#btn-cats").addEventListener("click", () => openCatMgr("out", "me"));
  $("#btn-opening").addEventListener("click", editOpening);
  $("#btn-export").addEventListener("click", exportBackup);
  $("#btn-import").addEventListener("click", () => $("#file-import").click());
  $("#btn-bill").addEventListener("click", () => $("#file-bill").click());
  $("#file-bill").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) importBill(f);
    e.target.value = "";
  });
  $("#file-import").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) importBackup(f);
    e.target.value = "";
  });
  $("#btn-wipe").addEventListener("click", wipeAll);
  $("#cs-close").addEventListener("click", () => {
    closeTxns();
    $("#sheet-catstat").classList.remove("is-open");
  });
  $("#tx-close").addEventListener("click", closeTxns);
  $("#txn-mask").addEventListener("click", closeTxns);
  $("#cs-body").addEventListener("click", (e) => {
    const row = e.target.closest(".cs-row[data-sub]");
    if (row) openSubTxns(row.dataset.sub);
  });
  $("#stat").addEventListener("click", (e) => {
    const cell = e.target.closest("td.link[data-dir]");
    if (cell) { openMonthTxns(cell.dataset.s, cell.dataset.e, cell.dataset.dir); return; }
    const row = e.target.closest(".rank-row[data-cat]");
    if (row) openCatStat(row.dataset.cat);
  });
  $("#store-bar-x").addEventListener("click", () => {
    $("#store-bar").hidden = true;
    document.documentElement.style.setProperty("--bar-h", "0px");
  });
  const bp = $("#bpad-btn");
  if (bp) bp.addEventListener("click", () => {
    ST.prefs.browserPad = ST.prefs.browserPad === false;
    applyBpad();
    saveMeta();
    buzz(6);
  });
  $("#theme-row").addEventListener("click", (e) => {
    const b = e.target.closest(".theme-opt");
    if (!b) return;
    ST.prefs.theme = b.dataset.theme;
    applyTheme();
    saveMeta();
    buzz(6);
  });
}

/* ---------- 视口高度 ---------- */
/* 键盘弹出 / 地址栏伸缩 / 从后台回来，都要重算，否则底部 tab 会被顶出屏幕 */
function fixViewport() {
  const vv = window.visualViewport;
  const set = () => {
    const h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty("--vh", Math.round(h) + "px");
  };
  set();
  requestAnimationFrame(set);
  if (vv) {
    vv.addEventListener("resize", set);
    vv.addEventListener("scroll", set, { passive: true });
  }
  window.addEventListener("resize", set);
  window.addEventListener("orientationchange", () => setTimeout(set, 240));
  window.addEventListener("pageshow", set);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) setTimeout(set, 60);
  });
}

/* 浏览器内 vs 装成应用：底部工具栏是浮层，占位与否只能靠这个开关区分 */
function applyDisplayMode() {
  const mq = window.matchMedia ? window.matchMedia("(display-mode: standalone)") : null;
  const standalone = (mq && mq.matches) || window.navigator.standalone === true;
  document.documentElement.dataset.mode = standalone ? "app" : "browser";
  applyBpad();
  if (mq && mq.addEventListener) mq.addEventListener("change", applyDisplayMode);
}

/* 底部留白开关：真机上留白多了或少了，用户自己就能关/开 */
function applyBpad() {
  const on = ST.prefs.browserPad !== false;
  document.documentElement.dataset.bpad = on ? "on" : "off";
  const b = $("#bpad-btn");
  if (b) {
    b.classList.toggle("is-on", on);
    b.textContent = on ? "浏览器内底部留白 · 开" : "浏览器内底部留白 · 关";
  }
}

/* ---------- 启动 ---------- */
function renderAll() {
  renderBook();
  renderStat();
  renderTrack();
  renderGoals();
  renderMemo();
  renderNoteFeed();
  renderMeStats();
  renderEdit();
}

async function boot() {
  await initStore();

  let txns, notes, plans, goals, memos, cats, meta;
  try {
    [txns, notes, plans, goals, memos, cats, meta] = await Promise.all([
      dbAll("txns"), dbAll("notes"), dbAll("plans"), dbAll("goals"), dbAll("memos"), dbAll("cats"), dbAll("meta")
    ]);
  } catch (e) {
    /* 能 open 但读不动（配额、损坏、被清权限）：退一级重试，不再白屏 */
    _db = null;
    try { indexedDB.deleteDatabase(DB_NAME); } catch (_) {}
    if (probeLS()) { STORE.mode = "ls"; }
    else { STORE.mode = "mem"; }
    [txns, notes, plans, goals, memos, cats, meta] = await Promise.all([
      dbAll("txns"), dbAll("notes"), dbAll("plans"), dbAll("goals"), dbAll("memos"), dbAll("cats"), dbAll("meta")
    ]);
  }

  ST.txns = txns.sort((a, b) => b.at - a.at);
  ST.notes = notes.sort((a, b) => b.at - a.at);
  ST.plans = plans;
  ST.goals = (goals || []).map(normGoal);
  ST.memos = memos;
  CATS = cats;
  /* 第一次打开、或旧版本升级上来：写入默认分类 */
  if (!CATS.length) {
    CATS = buildSeed();
    await dbBulkPut("cats", CATS);
  }
  const p = meta.find((x) => x.k === "prefs");
  if (p && p.v) Object.assign(ST.prefs, p.v);

  if (!catsOf("out", "").length) {
    const extra = buildSeed().filter((c) => c.dir === "out");
    CATS = CATS.concat(extra);
    await dbBulkPut("cats", extra);
  }

  ST.editDir = ST.prefs.lastDir || "out";
  ST.editCat = (ST.prefs.lastCat && catById(ST.prefs.lastCat).dir === ST.editDir && catsOf(ST.editDir, "").some((c) => c.id === ST.prefs.lastCat))
    ? ST.prefs.lastCat : firstCatId(ST.editDir);
  ST.editSub = ST.subOf[ST.editCat] || firstSubName(ST.editCat);

  await migratePlans(meta);
  await migrateOnceGoals();
  await migrateNoteKind();
  await migrateGoalYear();
  await migrateMemoWeek();

  applyTheme();
  buildPad();
  initAmount();
  bindEvents();
  applyDisplayMode();
  fixViewport();
  renderAll();
  setPlanPane("plan");
  setView("book");
  showStoreBar();
}

/* 存储降级时的说明条：只在存不住 / 存得不稳时出现 */
function showStoreBar() {
  const bar = $("#store-bar");
  const txt = $("#store-bar-txt");
  if (!bar || !txt) return;
  if (STORE.mode === "mem") {
    txt.innerHTML = "浏览器禁用了本地存储，这次记的账关掉页面就没了。" +
      "<br>换 Safari / Chrome 直接打开本文件，或用 https 地址访问即可正常保存。";
    bar.hidden = false;
    bar.dataset.level = "mem";
    $("#store-bar-x").hidden = true;
  } else if (STORE.mode === "ls") {
    txt.innerHTML = "这个浏览器不让用 IndexedDB，已自动换成兼容存储，记账照常保存。" +
      "<br>如果之前记的账没显示，说明换了浏览器或打开方式，数据还在原来那个环境里。";
    bar.hidden = false;
    bar.dataset.level = "ls";
  } else {
    bar.hidden = true;
  }
  /* 提示条占的高度传给 toast，避免盖住标题栏 */
  const h = bar.hidden ? 0 : bar.offsetHeight;
  document.documentElement.style.setProperty("--bar-h", h + "px");
}

boot();

/* PWA：只在 http(s) 下注册，file:// 打开也不报错 */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
