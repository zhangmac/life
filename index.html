"use strict";

/* ---------- 工具 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.prototype.slice.call(r.querySelectorAll(s));
const pad2 = (n) => String(n).padStart(2, "0");
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const dayKey = (ts) => { const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const fmtHM = (ts) => { const d = new Date(ts); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const WEEK_CN = ["日", "一", "二", "三", "四", "五", "六"];
const fmtMoney = (n) => {
  const v = Math.round((Number(n) || 0) * 100) / 100;
  const neg = v < 0;
  const [ip, dp] = Math.abs(v).toFixed(2).split(".");
  return (neg ? "-" : "") + ip.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "." + dp;
};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hexToRgba = (hex, a) => {
  const n = parseInt(String(hex).slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
};
/* 一周从周一开始 */
function weekStart(d) {
  const t = startOfDay(d || Date.now());
  const off = (t.getDay() + 6) % 7;
  const m = new Date(t);
  m.setDate(t.getDate() - off);
  return m;
}
const weekKey = (d) => dayKey(weekStart(d));
function weekRangeLabel(d) {
  const s = weekStart(d);
  const e = new Date(s); e.setDate(s.getDate() + 6);
  return `${s.getMonth() + 1}/${s.getDate()} – ${e.getMonth() + 1}/${e.getDate()}`;
}
const monthStart = (d) => new Date(d.getFullYear(), d.getMonth(), 1).getTime();
const monthEnd = (d) => new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime();
const dateLabel = (d) => `${d.getMonth() + 1}月${d.getDate()}日`;

/* ---------- 分类 ---------- */
/* 数据结构：{ id, name, dir: 'out'|'in', c, parent: ''|父id, order } */
const PALETTE = ["#3d7a61", "#c4853f", "#b5563f", "#5b7fa6", "#8f6ba8", "#6b8f71", "#c26b6b", "#4f8f8a", "#b07a4a", "#8b8478"];

/* 种子：沿用旧的 id，历史账目不会失联 */
const SEED_OUT = [
  { id: "food",    name: "餐饮", c: "#c4853f", subs: ["早餐", "午餐", "晚餐", "咖啡", "外卖", "零食", "买菜"] },
  { id: "traffic", name: "交通", c: "#5b7fa6", subs: ["地铁", "公交", "打车", "加油", "停车", "高铁"] },
  { id: "shop",    name: "购物", c: "#8f6ba8", subs: ["日用", "服饰", "数码", "美妆", "家居"] },
  { id: "home",    name: "居住", c: "#6b8f71", subs: ["房租", "水电", "燃气", "物业", "维修"] },
  { id: "fun",     name: "娱乐", c: "#c26b6b", subs: ["电影", "游戏", "运动", "旅行", "演出"] },
  { id: "health",  name: "医教", c: "#4f8f8a", subs: ["药品", "门诊", "体检", "书籍", "课程"] },
  { id: "social",  name: "人情", c: "#b07a4a", subs: ["红包", "请客", "礼物", "孝亲"] },
  { id: "other",   name: "其他", c: "#8b8478", subs: ["其他"] }
];
const SEED_IN = [
  { id: "salary",  name: "工资", c: "#3d7a61", subs: ["月薪", "奖金", "补贴"] },
  { id: "parttime", name: "兼职", c: "#4f8f8a", subs: ["外包", "稿费", "私活"] },
  { id: "invest",  name: "理财", c: "#c4853f", subs: ["利息", "分红", "收益"] },
  { id: "gift",    name: "红包", c: "#b07a4a", subs: ["礼金", "压岁", "中奖"] },
  { id: "refund",  name: "退款", c: "#8f6ba8", subs: ["退货", "报销"] },
  { id: "other-in", name: "其他", c: "#8b8478", subs: ["其他"] }
];

let CATS = [];

function catsOf(dir, parent) {
  const p = parent || "";
  return CATS.filter((c) => c.dir === dir && (c.parent || "") === p)
    .sort((a, b) => (a.order || 0) - (b.order || 0));
}
function catById(id) {
  return CATS.find((c) => c.id === id) || { id: "", name: "未分类", c: "#8b8478" };
}
/** 一级 + 二级的完整叫法（二级存的是当时的名字，改名不影响旧账） */
function catLabel(t) {
  const c = CATS.find((x) => x.id === t.cat);
  if (!c) return "未分类";                 // 分类被删了，只留这一层
  return t.sub ? `${c.name} · ${t.sub}` : c.name;
}
function buildSeed() {
  const out = [];
  const push = (list, dir) => {
    list.forEach((c, i) => {
      out.push({ id: c.id, name: c.name, dir, c: c.c, parent: "", order: i });
      c.subs.forEach((s, j) => {
        out.push({ id: c.id + "-s" + j, name: s, dir, c: c.c, parent: c.id, order: j });
      });
    });
  };
  push(SEED_OUT, "out");
  push(SEED_IN, "in");
  return out;
}

/* ---------- 状态 ---------- */
const ST = {
  txns: [],
  notes: [],
  plans: [],
  goals: [],
  memos: [],
  view: "book",
  planPane: "plan",
  /* 计划页：本周锚点 */
  memoAnchor: Date.now(),
  /* 轨迹页：大事记 / 空间 */
  trackPane: "mile",
  /* 目标页：当前周期与锚点 */
  goalAnchor: Date.now(),
  /* 编辑面板 */
  editId: null,
  editDir: "out",
  editCat: "",
  editSub: "",
  editDate: dayKey(Date.now()),
  editInTrack: false,
  draft: "",
  subOf: {},
  bookLimit: 40,
  /* 统计 */
  statRange: "month",
  statAnchor: new Date(),
  statDir: "out",
  mgrDir: "out",
  mgrFrom: "edit",
  prefs: { theme: "auto", lastExport: 0, opening: 0, lastCat: "", lastDir: "out" }
};

/* ---------- 存储层：IndexedDB → localStorage → 内存，三级降级 ----------
   Safari 双击打开本地文件、无痕模式、iframe 沙箱都会让 indexedDB.open 抛错，
   老版本在这里直接白屏。现在任何环境都能跑，只是保存能力递减。 */
const DB_NAME = "life";
const DB_VER = 3;
const KEYS = { txns: "id", notes: "id", plans: "id", goals: "id", memos: "id", cats: "id", meta: "k" };
let _db = null;

/* idb | ls | mem */
const STORE = { mode: "idb", why: "" };
const MEM = { txns: [], notes: [], plans: [], goals: [], memos: [], cats: [], meta: [] };

function openDB() {
  return new Promise((resolve, reject) => {
    let done = false;
    const fail = (e) => { if (!done) { done = true; reject(e || new Error("idb blocked")); } };
    /* 有的环境 open 既不 success 也不 error，挂着不动，给个上限 */
    const timer = setTimeout(() => fail(new Error("idb timeout")), 2000);
    let req;
    try {
      req = indexedDB.open(DB_NAME, DB_VER);
    } catch (e) {
      clearTimeout(timer);
      return fail(e);
    }
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("txns")) db.createObjectStore("txns", { keyPath: "id" });
      if (!db.objectStoreNames.contains("notes")) db.createObjectStore("notes", { keyPath: "id" });
      if (!db.objectStoreNames.contains("plans")) db.createObjectStore("plans", { keyPath: "id" });
      if (!db.objectStoreNames.contains("goals")) db.createObjectStore("goals", { keyPath: "id" });
      if (!db.objectStoreNames.contains("memos")) db.createObjectStore("memos", { keyPath: "id" });
      if (!db.objectStoreNames.contains("cats")) db.createObjectStore("cats", { keyPath: "id" });
      if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", { keyPath: "k" });
    };
    req.onsuccess = () => { if (done) { try { req.result.close(); } catch (e) {} return; } done = true; clearTimeout(timer); resolve(req.result); };
    req.onerror = () => { clearTimeout(timer); fail(req.error); };
    req.onblocked = () => { clearTimeout(timer); fail(new Error("idb blocked")); };
  });
}
function idbStore(name, mode) {
  return _db.transaction(name, mode || "readonly").objectStore(name);
}

/* localStorage 后端：一张表一个 key，个人记账量级完全够用 */
function lsKey(name) { return "life:" + name; }
function lsRead(name) {
  try {
    const raw = localStorage.getItem(lsKey(name));
    const v = raw ? JSON.parse(raw) : [];
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
}
function lsWrite(name, arr) {
  localStorage.setItem(lsKey(name), JSON.stringify(arr));
}

function probeLS() {
  try {
    const k = "life:__probe";
    localStorage.setItem(k, "1");
    const ok = localStorage.getItem(k) === "1";
    localStorage.removeItem(k);
    return ok;
  } catch (e) { return false; }
}

function isOpaque() {
  try {
    /* iframe sandbox 无 allow-same-origin 时 origin 为字符串 "null" */
    return location.origin === "null" || !location.origin;
  } catch (e) { return true; }
}

async function initStore() {
  if ("indexedDB" in window && !isOpaque()) {
    try {
      _db = await openDB();
      STORE.mode = "idb";
      return;
    } catch (e) {
      STORE.why = (e && e.name) || "error";
    }
  } else {
    STORE.why = isOpaque() ? "opaque" : "no-idb";
  }
  if (probeLS()) { STORE.mode = "ls"; return; }
  STORE.mode = "mem";
}

/* ---------- 对外统一接口，全部 Promise ---------- */
function dbAll(name) {
  if (STORE.mode === "idb") {
    return new Promise((res, rej) => {
      const r = idbStore(name).getAll();
      r.onsuccess = () => res(r.result || []);
      r.onerror = () => rej(r.error);
    });
  }
  if (STORE.mode === "ls") return Promise.resolve(lsRead(name));
  return Promise.resolve((MEM[name] || []).slice());
}
function dbPut(name, val) {
  if (STORE.mode === "idb") {
    return new Promise((res, rej) => {
      const r = idbStore(name, "readwrite").put(val);
      r.onsuccess = () => res();
      r.onerror = () => rej(r.error);
    });
  }
  const key = KEYS[name] || "id";
  if (STORE.mode === "ls") {
    return new Promise((res, rej) => {
      try {
        const arr = lsRead(name);
        const i = arr.findIndex((x) => x[key] === val[key]);
        if (i >= 0) arr[i] = val; else arr.push(val);
        lsWrite(name, arr);
        res();
      } catch (e) {
        /* 配额满：降级到内存，提醒一次 */
        if (!STORE.warned) {
          STORE.warned = true;
          toast("本地存储已满，改用临时模式，请先导出备份");
        }
        STORE.mode = "mem";
        MEM[name] = lsRead(name);
        const j = MEM[name].findIndex((x) => x[key] === val[key]);
        if (j >= 0) MEM[name][j] = val; else MEM[name].push(val);
        res();
      }
    });
  }
  const arr = MEM[name];
  const i = arr.findIndex((x) => x[key] === val[key]);
  if (i >= 0) arr[i] = val; else arr.push(val);
  return Promise.resolve();
}
function dbDel(name, id) {
  if (STORE.mode === "idb") {
    return new Promise((res, rej) => {
      const r = idbStore(name, "readwrite").delete(id);
      r.onsuccess = () => res();
      r.onerror = () => rej(r.error);
    });
  }
  if (STORE.mode === "ls") {
    try {
      lsWrite(name, lsRead(name).filter((x) => x[KEYS[name] || "id"] !== id));
    } catch (e) {}
    return Promise.resolve();
  }
  const key = KEYS[name] || "id";
  MEM[name] = MEM[name].filter((x) => x[key] !== id);
  return Promise.resolve();
}
function dbClear(name) {
  if (STORE.mode === "idb") {
    return new Promise((res, rej) => {
      const r = idbStore(name, "readwrite").clear();
      r.onsuccess = () => res();
      r.onerror = () => rej(r.error);
    });
  }
  if (STORE.mode === "ls") {
    try { lsWrite(name, []); } catch (e) {}
    return Promise.resolve();
  }
  MEM[name] = [];
  return Promise.resolve();
}
/* 批量写：恢复备份时一次落地，避免逐条 await 造成 O(n²) 序列化 */
function dbBulkPut(name, arr) {
  if (!arr || !arr.length) return Promise.resolve();
  const key = KEYS[name] || "id";
  if (STORE.mode === "idb") {
    return new Promise((res, rej) => {
      let tx;
      try { tx = _db.transaction(name, "readwrite"); } catch (e) { return rej(e); }
      const os = tx.objectStore(name);
      for (const v of arr) os.put(v);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  }
  if (STORE.mode === "ls") {
    try {
      const cur = lsRead(name);
      const map = new Map(cur.map((x) => [x[key], x]));
      for (const v of arr) map.set(v[key], v);
      lsWrite(name, [...map.values()]);
      return Promise.resolve();
    } catch (e) {
      if (!STORE.warned) { STORE.warned = true; toast("本地存储已满，改用临时模式，请先导出备份"); }
      STORE.mode = "mem";
      MEM[name] = lsRead(name);
    }
  }
  const map = new Map(MEM[name].map((x) => [x[key], x]));
  for (const v of arr) map.set(v[key], v);
  MEM[name] = [...map.values()];
  return Promise.resolve();
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg, action, onAction) {
  const el = $("#toast");
  el.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button>${esc(action)}</button>` : "");
  el.classList.add("is-on");
  if (action) {
    const btn = el.querySelector("button");
    btn.addEventListener("click", () => {
      el.classList.remove("is-on");
      onAction && onAction();
    }, { once: true });
  }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("is-on"), action ? 5200 : 2000);
}
/* iOS 不支持 vibrate；Chrome 在用户触摸前调用会报 console error，故先用标志拦住 */
let CAN_VIB = false;
document.addEventListener("pointerdown", () => { CAN_VIB = true; }, { once: true, passive: true });
function buzz(ms) {
  if (!CAN_VIB || !navigator.vibrate) return;
  try { navigator.vibrate(ms || 8); } catch (e) {}
}

/* =========================================================
   机械滚轮计数器
   strip 里放 0-9 三遍：正反各滚一圈都撞不到边界。
   每一位是独立的一只轮子，低位先动、也停得快。
   ========================================================= */
const WCELLS = 30;
function makeWheel() {
  const el = document.createElement("span");
  el.className = "wheel";
  const strip = document.createElement("span");
  strip.className = "wstrip";
  let h = "";
  for (let i = 0; i < WCELLS; i++) h += "<i>" + (i % 10) + "</i>";
  strip.innerHTML = h;
  strip.style.setProperty("--y", 10);
  el.appendChild(strip);
  el._pos = 10;
  return el;
}
/**
 * @param idx 从右数第几位（0 = 最末位）。越靠右越快，模拟进位
 */
function setWheel(el, d, dir, idx) {
  const strip = el.firstChild;
  let pos = el._pos;
  if (pos < 10 || pos > 19) {            /* 静默拉回中圈：三圈重复，看不出变化 */
    pos = pos < 10 ? pos + 10 : pos - 10;
    el._pos = pos;
    strip.style.transition = "none";
    strip.style.setProperty("--y", pos);
    void strip.offsetHeight;
    strip.style.transition = "";
  }
  const cur = pos % 10;
  if (cur === d) return;
  const delta = dir >= 0 ? (d - cur + 10) % 10 : -((cur - d + 10) % 10);
  const next = pos + delta;
  el._pos = next;
  const t = 190 + idx * 44 + Math.min(Math.abs(delta), 6) * 12;
  strip.style.setProperty("--t", t + "ms");
  strip.style.setProperty("--d", idx * 16 + "ms");
  strip.style.setProperty("--y", next);

  clearTimeout(el._reset);
  if (next > 19 || next < 10) {
    el._reset = setTimeout(() => {
      const p = el._pos;
      const back = p > 19 ? p - 10 : p + 10;
      el._pos = back;
      strip.style.transition = "none";
      strip.style.setProperty("--y", back);
      void strip.offsetHeight;
      strip.style.transition = "";
    }, t + idx * 16 + 60);
  }
}
/**
 * 让一组轮子显示 str（左侧可增位），offset = 右侧还有几位
 *
 * 位数变少时不能把高位先滚成 0 再收走 —— 那样眼睛会先看到一个 0。
 * 正确做法：高位直接把宽度收到 0 消失，剩下那几位原地不动。
 */
function setWheelGroup(box, arr, str, dir, offset) {
  /* 位数变多：往左补新轮子，从 0 宽展开 */
  while (arr.length < str.length) {
    const w = makeWheel();
    w.classList.add("is-new");
    box.insertBefore(w, box.firstChild);
    arr.unshift(w);
    requestAnimationFrame(() => w.classList.remove("is-new"));
  }
  /* 位数变少：高位当场收窄移除，不经过 0 */
  if (arr.length > str.length) {
    const gone = arr.splice(0, arr.length - str.length);
    gone.forEach((w) => {
      w.classList.add("is-gone");
      w.style.pointerEvents = "none";
      setTimeout(() => { if (w.parentNode) w.parentNode.removeChild(w); }, 220);
    });
  }
  const n = arr.length;
  for (let i = 0; i < str.length; i++) {
    setWheel(arr[i], +str[i], dir, n - 1 - i + offset);
  }
}

/* ---------- 金额 ---------- */
function amountParts(v) {
  const di = v.indexOf(".");
  let ip = di < 0 ? v : v.slice(0, di);
  let dp = di < 0 ? "" : v.slice(di + 1);
  ip = (ip || "0").replace(/^0+(?=\d)/, "") || "0";
  dp = (dp + "00").slice(0, 2);
  return [ip, dp];
}

let edInt = [], edDec = [], lastAmt = 0;

function initAmount() {
  const ib = $("#ed-int"), db = $("#ed-dec");
  ib.innerHTML = ""; db.innerHTML = "";
  edInt = [makeWheel()]; ib.appendChild(edInt[0]);
  edDec = [makeWheel(), makeWheel()];
  edDec.forEach((w) => db.appendChild(w));
  renderAmount(true);
}

function renderAmount(silent) {
  const v = ST.draft;
  const [ip, dp] = amountParts(v);
  const now = parseFloat(v || "0") || 0;
  const dir = silent ? 1 : (now >= lastAmt ? 1 : -1);
  lastAmt = now;

  setWheelGroup($("#ed-int"), edInt, ip, dir, 2);
  setWheel(edDec[0], +dp[0], dir, 1);
  setWheel(edDec[1], +dp[1], dir, 0);

  $("#ed-win").classList.toggle("is-empty", v === "");
  const total = $("#ed-total");
  total.textContent = fmtMoney(now);
  total.classList.toggle("in", ST.editDir === "in" && now > 0);
}

function keyPress(k) {
  if (k === "del") {
    ST.draft = ST.draft.slice(0, -1);
  } else if (k === ".") {
    if (!ST.draft) ST.draft = "0.";
    else if (ST.draft.indexOf(".") < 0) ST.draft += ".";
  } else {
    const dot = ST.draft.indexOf(".");
    if (dot >= 0 && ST.draft.length - dot > 2) return;      // 最多两位小数
    const digits = ST.draft.replace(".", "");
    if (digits.length >= 9) return;                          // 金额上限
    if (ST.draft === "0") ST.draft = k;
    else ST.draft += k;
  }
  renderAmount();
}

function buildPad() {
  const box = $("#ed-pad");
  const cells = [
    ["1", "n1"], ["2", "n2"], ["3", "n3"],
    ["4", "n4"], ["5", "n5"], ["6", "n6"],
    ["7", "n7"], ["8", "n8"], ["9", "n9"],
    [".", "dt"], ["0", "n0"]
  ];
  box.innerHTML =
    cells.map((c) => `<button class="pk" data-k="${c[0]}" style="grid-area:${c[1]}">${c[0]}</button>`).join("") +
    `<button class="pk del" data-k="del">⌫</button>` +
    `<button class="pk a-g" data-k="again">再记</button>` +
    `<button class="pk ok" data-k="ok">完成</button>`;
}

/* =========================================================
   记账首页
   ========================================================= */
function sumOf(list) {
  let inc = 0, out = 0;
  for (const t of list) { if (t.dir === "in") inc += t.amount; else out += t.amount; }
  return { inc, out, bal: inc - out };
}
/** 全部账目 + 期初 = 当前余额 */
function nowBalance() {
  const s = sumOf(ST.txns);
  return (Number(ST.prefs.opening) || 0) + s.inc - s.out;
}

function renderBook() {
  const now = new Date();
  const ms = monthStart(now), me = monthEnd(now);
  const m = sumOf(ST.txns.filter((t) => t.at >= ms && t.at < me));

  const bal = nowBalance();
  const balShown = Date.now() < (ST.balShowUntil || 0);
  $("#book").innerHTML = `
    <div class="sum-card">
      <div class="sum-row">
        <div class="sum-cell"><em>本月收入</em><b class="in">${fmtMoney(m.inc)}</b></div>
        <div class="sum-cell"><em>本月支出</em><b class="out">${fmtMoney(m.out)}</b></div>
        <div class="sum-cell"><em>本月结余</em><b class="${m.bal < 0 ? "neg" : "bal"}">${fmtMoney(m.bal)}</b></div>
      </div>
      <div class="sum-bal" id="sum-bal">
        <span>当前余额 · 长按设期初</span>
        <b class="${balShown ? (bal < 0 ? "neg" : "") : "masked"}">${balShown ? fmtMoney(bal) : "¥ ••••"}</b>
        <button class="bal-eye" id="bal-eye" aria-label="${balShown ? "隐藏余额" : "显示余额 5 秒"}">
          ${balShown
            ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 6.2A9.5 9.5 0 0 1 21 12a15 15 0 0 1-2.4 3.1"/><path d="M6.3 6.6A15.3 15.3 0 0 0 3 12a9.6 9.6 0 0 0 12.6 5.2"/></svg>`
            : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12S18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>`}
        </button>
      </div>
    </div>

    <button class="add-txn" id="open-edit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 6v12M6 12h12" />
      </svg>
      添加一条新记账
    </button>

    <div id="book-list"></div>
  `;

  renderBookList();

  const ob = $("#sum-bal");
  if (ob) {
    bindLongPress(ob, "#sum-bal", () => editOpening());
    const eye = $("#bal-eye");
    if (eye) eye.addEventListener("click", (e) => {
      e.stopPropagation();
      if (Date.now() < (ST.balShowUntil || 0)) {
        ST.balShowUntil = 0;
        renderBook();
        return;
      }
      ST.balShowUntil = Date.now() + 5000;
      renderBook();
      buzz(6);
      clearTimeout(window.__balTimer);
      window.__balTimer = setTimeout(() => {
        ST.balShowUntil = 0;
        renderBook();
      }, 5000);
    });
  }
  const oe = $("#open-edit");
  if (oe) oe.addEventListener("click", () => openEdit(null));
}

function renderBookList() {
  const box = $("#book-list");
  if (!box) return;
  const sorted = ST.txns.slice().sort((a, b) => b.at - a.at);
  const list = sorted.slice(0, ST.bookLimit);

  if (!list.length) {
    box.innerHTML = `<div class="empty"><b>还没有账</b></div>`;
    return;
  }

  const groups = [];
  let cur = null;
  for (const t of list) {
    const k = dayKey(t.at);
    if (!cur || cur.k !== k) { cur = { k, at: t.at, items: [] }; groups.push(cur); }
    cur.items.push(t);
  }

  let html = "";
  for (const g of groups) {
    const s = sumOf(g.items);
    const d = new Date(g.at);
    html += `<div class="bk-day">
      <div class="bk-day-h">
        <b>${dateLabel(d)}</b><span>周${WEEK_CN[d.getDay()]}</span>
        <em>收 <i class="in">${fmtMoney(s.inc)}</i> 支 <i class="out">${fmtMoney(s.out)}</i></em>
      </div>
      <div class="bk-items">${g.items.map(bookRow).join("")}</div>
    </div>`;
  }

  if (sorted.length > list.length) {
    html += `<button class="more-btn" id="book-more">看更早的（还有 ${sorted.length - list.length} 笔）</button>`;
  }
  box.innerHTML = html;

  const more = $("#book-more");
  if (more) more.addEventListener("click", () => { ST.bookLimit += 60; renderBookList(); });
}

function bookRow(t) {
  const c = catById(t.cat);
  const first = (c.name || "未").slice(0, 1);
  return `<div class="bk-item" data-id="${t.id}">
    <i class="bk-ico" style="--c:${c.c};--cs:${hexToRgba(c.c, 0.14)}">${esc(first)}</i>
    <span class="bk-main">
      <span class="bk-cat">${esc(catLabel(t))}</span>
      ${t.note ? `<span class="bk-note">${esc(t.note)}</span>` : ""}
    </span>
    ${t.inTrack ? `<span class="bk-trk">轨迹</span>` : ""}
    <span class="bk-amt ${t.dir}">${t.dir === "out" ? "-" : "+"}${fmtMoney(t.amount)}</span>
  </div>`;
}

/* =========================================================
   记一笔 / 改一笔
   ========================================================= */
function firstCatId(dir) {
  const l = catsOf(dir, "");
  return l.length ? l[0].id : "";
}
function firstSubName(catId) {
  const l = catsOf(ST.editDir, catId);
  return l.length ? l[0].name : "";
}

function openEdit(txn) {
  if (txn) {
    ST.editId = txn.id;
    ST.editDir = txn.dir;
    ST.editCat = txn.cat;
    ST.editSub = txn.sub || "";
    ST.editDate = dayKey(txn.at);
    ST.editInTrack = !!txn.inTrack;
    ST.draft = txn.amount ? String(txn.amount) : "";
    $("#ed-note").value = txn.note || "";
  } else {
    ST.editId = null;
    ST.editDir = ST.prefs.lastDir || "out";
    if (!catsOf(ST.editDir, "").length) ST.editDir = "out";
    ST.editCat = (ST.prefs.lastCat && catById(ST.prefs.lastCat).id) ? ST.prefs.lastCat : firstCatId(ST.editDir);
    if (catById(ST.editCat).dir !== ST.editDir) ST.editCat = firstCatId(ST.editDir);
    ST.editSub = ST.subOf[ST.editCat] || firstSubName(ST.editCat);
    ST.editDate = dayKey(Date.now());
    ST.editInTrack = false;
    ST.draft = "";
    $("#ed-note").value = "";
  }
  lastAmt = parseFloat(ST.draft || "0") || 0;
  renderEdit();
  $("#sheet-edit").classList.add("is-open");
}
function closeEdit() {
  closeDatePop();
  $("#sheet-edit").classList.remove("is-open");
  $("#ed-note").blur();
}

function renderEdit() {
  $$("#ed-dir button").forEach((b) => b.classList.toggle("is-on", b.dataset.dir === ST.editDir));
  renderEditCats();
  renderEditSubs();
  renderAmount(true);
  $("#ed-track").setAttribute("aria-pressed", String(ST.editInTrack));
  paintDateLabel();
}

function paintDateLabel() {
  const dt = ST.editDate === dayKey(Date.now()) ? "今天" : (() => {
    const [y, m, d] = ST.editDate.split("-").map(Number);
    const now = new Date();
    return (y === now.getFullYear()) ? `${m}月${d}日` : `${y}/${m}/${d}`;
  })();
  $("#ed-date-txt").textContent = dt;
}

/* ---------- 选日期：自研面板 ----------
   原生 input[type=date] 靠 opacity:0 铺满来接管点击，触发点在部分浏览器
   （尤其 iframe / 桌面 WebView）会被吞掉，点了没反应。改自绘。 */
const DP = { y: 0, m: 0 };

function setEditDate(key) {
  ST.editDate = key;
  paintDateLabel();
  buzz(6);
}
/* 不带参数时是记账页选日期；带 cb 时给补录等地方临时用 */
let dpSel = "";
let dpCb = null;
/* "" 收起；"y" 选年；"m" 选月。补录要挑 1990 年的某天，一月一月翻太慢 */
let dpQuick = "";
function openDatePop(curKey, onPick) {
  dpSel = curKey || ST.editDate;
  dpCb = onPick || null;
  const base = dpSel.split("-").map(Number);
  DP.y = base[0]; DP.m = base[1] - 1;
  dpQuick = "";
  renderDatePop();
  $("#date-mask").classList.add("is-open");
  $("#date-pop").classList.add("is-open");
  buzz(6);
}
function closeDatePop() {
  $("#date-mask").classList.remove("is-open");
  $("#date-pop").classList.remove("is-open");
  dpCb = null;
  dpQuick = "";
}
function pickDate(key) {
  if (dpCb) { const fn = dpCb; dpCb = null; fn(key); }
  else setEditDate(key);
  closeDatePop();
}
function renderDatePop() {
  const todayKey = dayKey(Date.now());
  const pad = new Date(DP.y, DP.m, 1).getDay();
  const days = new Date(DP.y, DP.m + 1, 0).getDate();
  $("#dp-title").textContent = `${DP.y}年${DP.m + 1}月`;
  let h = "";
  for (let i = 0; i < pad; i++) h += '<button class="dp-cell is-blank" disabled tabindex="-1"></button>';
  for (let d = 1; d <= days; d++) {
    const key = `${DP.y}-${pad2(DP.m + 1)}-${pad2(d)}`;
    const cls = ["dp-cell"];
    if (key === todayKey) cls.push("is-today");
    if (key === dpSel) cls.push("is-on");
    h += `<button type="button" class="${cls.join(" ")}" data-k="${key}"${key > todayKey ? " disabled" : ""}>${d}</button>`;
  }
  $("#dp-grid").innerHTML = h;
  /* 已经到当前月，就不许再往后翻 —— 记账没有未来 */
  $("#dp-next").disabled = `${DP.y}-${pad2(DP.m + 1)}` >= todayKey.slice(0, 7);
  renderDpQuick();
}

/* 年月快选：先点年、再点月，落回日网格 */
function renderDpQuick() {
  const box = $("#dp-quick");
  if (!box) return;
  if (!dpQuick) { box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  /* 选年的时候标题就跟着走，别让人以为还在原来那年 */
  $("#dp-title").textContent = `${DP.y}年${DP.m + 1}月`;
  if (dpQuick === "y") {
    const thisY = new Date().getFullYear();
    let h = `<div class="dq-head"><span>选年份</span><b>${DP.y}</b></div><div class="dq-grid">`;
    for (let y = thisY; y >= 1970; y--) {
      h += `<button type="button" class="dq-cell ${y === DP.y ? "is-on" : ""}" data-y="${y}">${y}</button>`;
    }
    box.innerHTML = h + "</div>";
  } else {
    const cur = `${DP.y}-${pad2(DP.m + 1)}`;
    const nowKey = dayKey(Date.now()).slice(0, 7);
    let h = `<div class="dq-head"><button type="button" data-back="1">‹ ${DP.y}年</button><span>选月份</span></div><div class="dq-grid m3">`;
    for (let m = 1; m <= 12; m++) {
      const k = `${DP.y}-${pad2(m)}`;
      h += `<button type="button" class="dq-cell ${k === cur ? "is-on" : ""}" data-m="${m}"${k > nowKey ? " disabled" : ""}>${m}月</button>`;
    }
    box.innerHTML = h + "</div>";
  }
  box.scrollTop = 0;
}

function renderEditCats() {
  const tops = catsOf(ST.editDir, "");
  let html = tops.map((c) => {
    const on = c.id === ST.editCat;
    return `<button class="cat-cell ${on ? "is-on" : ""}" data-cat="${c.id}"
              style="--c:${c.c};--cs:${hexToRgba(c.c, 0.14)}">
      <i class="cat-face">${esc(c.name.slice(0, 1))}</i>
      <span>${esc(c.name)}</span>
    </button>`;

      <i class="cat-face">＋</i><span>新增</span>
    </button>`;
  $("#ed-cats").innerHTML = html;
}

function renderEditSubs() {
  const box = $("#ed-subs");
  const subs = catsOf(ST.editDir, ST.editCat);
  if (!subs.length) { box.className = "subs is-empty"; box.innerHTML = ""; return; }

function pickEditCat(id) {

  ST.editCat = id;
  ST.editSub = ST.subOf[id] || firstSubName(id);

  renderEditSubs();

function pickEditSub(name) {

  ST.subOf[ST.editCat] = name;
  renderEditSubs();
  renderAmount(true);
  const on = $("#ed-subs .sub.is-on");

}

function shakeAmount() {
  const el = $("#ed-win");
  el.classList.remove("is-shake");
  void el.offsetWidth;
  el.classList.add("is-shake");
}

async function saveEdit(again) {
  const amount = Math.round((parseFloat(ST.draft || "0") || 0) * 100) / 100;
  if (!(amount > 0)) { shakeAmount(); toast("先输个金额"); return; }
  if (!ST.editCat || !CATS.some((c) => c.id === ST.editCat)) {
    toast("先在分类管理里加一个项目");
    return;
  }

  const [y, mo, d] = ST.editDate.split("-").map(Number);
  const now = new Date();
  const picked = new Date(y, mo - 1, d, now.getHours(), now.getMinutes(), now.getSeconds()).getTime();

  let at = picked;
  let old = null;
  if (ST.editId) {
    old = ST.txns.find((x) => x.id === ST.editId);
    /* 日期没动就保留原来的时分秒，避免改个备注把时间也改了 */
    if (old && dayKey(old.at) === ST.editDate) at = old.at;
  }

  const item = {
    id: ST.editId || uid("t"),
    at,
    amount,
    dir: ST.editDir,
    cat: ST.editCat,
    sub: ST.editSub || "",
    note: ($("#ed-note").value || "").trim(),
    inTrack: ST.editInTrack,
    origin: old ? (old.origin || "manual") : "manual",
    createdAt: old ? old.createdAt : Date.now(),
    updatedAt: Date.now()
  };

  if (old) {
    const i = ST.txns.indexOf(old);
    ST.txns[i] = item;
  } else {
    ST.txns.push(item);
  }
  ST.txns.sort((a, b) => b.at - a.at);
  await dbPut("txns", item);

  ST.prefs.lastCat = ST.editCat;
  ST.prefs.lastDir = ST.editDir;
  saveMeta();

  buzz(10);
  renderBook();
  renderTrack();
  renderStat();
  renderMeStats();

  if (again) {
    ST.draft = "";
    $("#ed-note").value = "";
    renderAmount();
    toast("记下了，接着记下一笔");
  } else {
    closeEdit();
    toast(old ? "已更新" : `记下 ${ST.editDir === "out" ? "-" : "+"}${fmtMoney(amount)}`);
  }
}

async function addCat() {
  const cat = {
    id: uid("c"),
    name: "新项目",
    dir: ST.mgrDir,
    c: PALETTE[Math.floor(Math.random() * PALETTE.length)],
    parent: "",
    order: Date.now()
  };
  CATS.push(cat);
  await dbPut("cats", cat);
  renderCatMgr();
  editCatDialog(cat);
}

async function delCat(cat) {
  const subs = catsOf(cat.dir, cat.id);
  const used = ST.txns.filter((t) => t.cat === cat.id).length;
  const msg = `删除「${cat.name}」` +
    (subs.length ? `和它下面的 ${subs.length} 个子项目` : "") + `？` +
    (used ? `\n\n有 ${used} 笔账用了它，删除后这些账显示为「未分类」，金额和笔数都不变。` : "");
  if (!confirm(msg)) return;
  CATS = CATS.filter((c) => c.id !== cat.id && c.parent !== cat.id);
  await dbDel("cats", cat.id);
  for (const s of subs) await dbDel("cats", s.id);
  if (ST.editCat === cat.id) {
    ST.editCat = firstCatId(ST.editDir);
    ST.editSub = firstSubName(ST.editCat);
  }
  renderCatMgr();
  renderEdit();
  renderBook();
  renderStat();
  toast("已删除");
}

let modalOk = null;
function openModal(opt) {
  $("#m-title").textContent = opt.title || "";
  /* 每次换一个干净的 #m-body：监听器绑在它身上，
     只清 innerHTML 会让上一轮弹层的 click 处理器留在原地，
     新弹层里同名的 .g-chip / .seg-mini 一点就报错（v0.13 修） */
  const stale = $("#m-body");
  const body = stale.cloneNode(false);
  stale.replaceWith(body);
  body.innerHTML = opt.body || "";
  $("#m-ok").textContent = opt.okText || "确定";
  $("#m-cancel").textContent = opt.cancelText || "取消";
  modalOk = opt.onOk || null;
  $("#modal").classList.add("is-open");
  if (opt.onOpen) opt.onOpen(body);
}
function closeModal() {
  $("#modal").classList.remove("is-open");
  modalOk = null;
}

function editCatDialog(cat) {
  const subs = catsOf(cat.dir, cat.id);
  let picked = cat.c;
  let subsHtml = subs.map((s) => `<span class="f-sub">${esc(s.name)}<button data-del="${s.id}" aria-label="删">×</button></span>`).join("");

  openModal({
    title: "修改项目",
    okText: "保存",
    body: `
      <div class="f-row"><label>名称</label>
        <input class="f-in" id="cf-name" maxlength="8" value="${esc(cat.name)}" />
      </div>
      <div class="f-row"><label>颜色</label>
        <div class="f-colors" id="cf-colors">
          ${PALETTE.map((c) => `<button class="f-c ${c === picked ? "is-on" : ""}" data-c="${c}" style="--c:${c}" aria-label="选色"></button>`).join("")}
        </div>
      </div>
      <div class="f-row"><label>子项目</label>
        <div class="f-subs" id="cf-subs">${subsHtml || `<span class="f-hint" style="margin:0">还没有子项目</span>`}</div>
        <div class="f-add">
          <input class="f-in" id="cf-sub" placeholder="加一个，如「午餐」" maxlength="8" />
          <button id="cf-sub-add">加</button>
        </div>
      </div>
    `,
    onOpen: (body) => {
      body.querySelector("#cf-colors").addEventListener("click", (e) => {
        const b = e.target.closest(".f-c");
        if (!b) return;
        picked = b.dataset.c;
        $$("#cf-colors .f-c").forEach((x) => x.classList.toggle("is-on", x === b));
      });

      const addSub = async () => {
        const input = body.querySelector("#cf-sub");
        const name = input.value.trim();
        if (!name) { input.focus(); return; }
        if (catsOf(cat.dir, cat.id).some((s) => s.name === name)) { toast("已经有这个子项目了"); return; }
        const s = {
          id: uid("s"), name, dir: cat.dir, c: cat.c,
          parent: cat.id, order: Date.now()
        };
        CATS.push(s);
        await dbPut("cats", s);
        input.value = "";
        upsertSubChip(body, s);
      };
      body.querySelector("#cf-sub-add").addEventListener("click", addSub);
      body.querySelector("#cf-sub").addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); addSub(); }
      });

      body.addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-del]");
        if (!btn) return;
        const id = btn.dataset.del;
        CATS = CATS.filter((c) => c.id !== id);
        await dbDel("cats", id);
        const chip = btn.closest(".f-sub");
        if (chip) chip.remove();
        if (!body.querySelectorAll(".f-sub").length) {
          body.querySelector("#cf-subs").innerHTML = `<span class="f-hint" style="margin:0">还没有子项目</span>`;
        }
      });
    },
    onOk: async () => {
      const name = ($("#cf-name").value || "").trim();
      if (!name) { toast("名称不能为空"); return false; }
      cat.name = name;
      cat.c = picked;
      await dbPut("cats", cat);
      CATS = CATS.map((c) => (c.id === cat.id ? cat : c));
      /* 子项目跟着换色 */
      for (const s of catsOf(cat.dir, cat.id)) {
        s.c = picked;
        await dbPut("cats", s);
      }
      renderCatMgr();
      renderEdit();
      renderBook();
      renderStat();
      closeModal();
      toast("已保存");
      return true;
    }
  });
}
function upsertSubChip(body, s) {
  const box = body.querySelector("#cf-subs");
  const empty = box.querySelector(".f-hint");
  if (empty) empty.remove();
  const span = document.createElement("span");
  span.className = "f-sub";
  span.innerHTML = `${esc(s.name)}<button data-del="${s.id}" aria-label="删">×</button>`;
  box.appendChild(span);
}

/* =========================================================
   统计
   ========================================================= */
function statPeriod() {
  const a = ST.statAnchor;
  if (ST.statRange === "month") {
    const d = new Date(a.getFullYear(), a.getMonth(), 1);
    return {
      start: d.getTime(),
      end: new Date(a.getFullYear(), a.getMonth() + 1, 1).getTime(),
      label: `${a.getFullYear()}年${a.getMonth() + 1}月`,
      anchorMonth: d
    };
  }
  const d = new Date(a.getFullYear(), 0, 1);
  return {
    start: d.getTime(),
    end: new Date(a.getFullYear() + 1, 0, 1).getTime(),
    label: `${a.getFullYear()}年`,
    anchorMonth: d
  };
}

/** 柱状图要覆盖的 12 个月：月视图 = 往前 11 个月，年视图 = 该年 1–12 月 */
function barMonths() {
  const p = statPeriod();
  const base = new Date(p.anchorMonth);
  const out = [];
  const startM = ST.statRange === "year"
    ? new Date(base.getFullYear(), 0, 1)
    : new Date(base.getFullYear(), base.getMonth() - 11, 1);
  for (let i = 0; i < 12; i++) {
    const s = new Date(startM.getFullYear(), startM.getMonth() + i, 1);
    out.push({
      s: s.getTime(),
      e: new Date(s.getFullYear(), s.getMonth() + 1, 1).getTime(),
      m: s.getMonth() + 1,
      y: s.getFullYear()
    });
  }
  return out;
}

function renderStat() {

  const s = sumOf(inRange);

  const nowM = new Date();
  const isNowMonth = ST.statRange === "month" && p.anchorMonth.getFullYear() === nowM.getFullYear() && p.anchorMonth.getMonth() === nowM.getMonth();
  const isNowYear = ST.statRange === "year" && p.anchorMonth.getFullYear() === nowM.getFullYear();

  const months = barMonths();
  const mdata = months.map((m) => sumOf(ST.txns.filter((t) => t.at >= m.s && t.at < m.e)));
  const maxV = Math.max(1, ...mdata.map((x) => Math.max(x.inc, x.out)));
  const hasBar = mdata.some((x) => x.inc > 0 || x.out > 0);

  /* 分类聚合 */
  const byCat = new Map();

    const k = t.cat || "";
    byCat.set(k, (byCat.get(k) || 0) + t.amount);
  });
  const ranks = Array.from(byCat.entries())
    .map(([id, v]) => ({ id, v, c: catById(id) }))
    .sort((a, b) => b.v - a.v);

      </button>
    </div>

      <div class="c"><em>支出</em><b class="out">${fmtMoney(s.out)}</b></div>
      <div class="c"><em>结余</em><b class="${s.bal < 0 ? "neg" : "bal"}">${fmtMoney(s.bal)}</b></div>
    </div>

    <div class="st-card">
      <h3>
        <span>收支统计</span>
        <span class="lg-wrap">
          <span class="lg" style="color:var(--brand)"><i style="background:var(--brand)"></i>收入</span>
          <span class="lg" style="color:var(--danger)"><i style="background:var(--danger)"></i>支出</span>
        </span>
      </h3>
      ${hasBar ? `
      <div class="bars">
        ${mdata.map((x) => `<div class="bar-col">
          <div class="bar in" style="height:${Math.max(2, (x.inc / maxV) * 100)}%"></div>

      </div>
      <div class="bar-x">
        ${months.map((m) => `<span class="${m.m === nowM.getMonth() + 1 && m.y === nowM.getFullYear() ? "is-now" : ""}">${m.m}</span>`).join("")}
      </div>` : `<div class="empty" style="padding:34px 0">这 12 个月还没有收支</div>`}
    </div>

    <div class="st-card">
      <h3>
        <span>${ST.statDir === "out" ? "支出" : "收入"}构成</span>
        <span class="st-mini" id="st-dir">
          <button data-d="out" class="${ST.statDir === "out" ? "is-on" : ""}">支出</button>
          <button data-d="in" class="${ST.statDir === "in" ? "is-on" : ""}">收入</button>
        </span>
      </h3>
      ${rankTotal ? `
      <div class="share-wrap">
        <div class="donut-box">
          <div class="donut" style="background:${donutOf(ranks, rankTotal)}"></div>
          <div class="donut-mid"><b>${fmtMoney(rankTotal)}</b><span>共 ${ranks.length} 项</span></div>        </div>
        <div class="share-legend">
          ${ranks.slice(0, 5).map((r) => `<div class="sl-row">
            <i style="background:${r.c.c}"></i>

          ${ranks.length > 5 ? `<div class="sl-row"><i style="background:var(--line-2)"></i><span>其他 ${ranks.length - 5} 项</span><b>${((ranks.slice(5).reduce((a, b) => a + b.v, 0) / rankTotal) * 100).toFixed(1)}%</b></div>` : ""}
        </div>

    </div>

    ${ranks.length ? `<div class="st-card">
      <h3><span>${ST.statDir === "out" ? "支出" : "收入"}明细</span></h3>

        <tbody>
          ${months.slice().reverse().map((m) => {
            const x = sumOf(ST.txns.filter((t) => t.at >= m.s && t.at < m.e));
            return `<tr><td>${m.y}/${m.m}</td>

              <td${x.out ? ` class="link" data-s="${m.s}" data-e="${m.e}" data-dir="out" role="button" tabindex="0"` : ""}>${x.out ? fmtMoney(x.out) + '<span class="rep-go">›</span>' : "—"}</td>
              <td class="${x.bal < 0 ? "neg" : ""}">${fmtMoney(x.bal)}</td></tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
    </div>
  `;

  /* 标题行：把「按月 / 按年」收进右上角，避免和页面顶部分段打架 */
  {
    const box = $("#stat"), tabs = $("#st-tabs");
    if (box && tabs) {
      const head = document.createElement("div");
      head.className = "stat-head";

    });

    const b = e.target.closest("button");

    buzz(6);
  });
}

/** 环图：conic-gradient 拼色，中间由 CSS mask 掏空 */
function donutOf(ranks, total) {
  let acc = 0;
  const stops = ranks.map((r) => {
    const from = (acc / total) * 100;
    acc += r.v;
    const to = (acc / total) * 100;
    return `${r.c.c} ${from.toFixed(2)}% ${to.toFixed(2)}%`;
  });
  return `conic-gradient(${stops.join(",")})`;
}

/* =========================================================
   分类下钻：点统计页的一级分类，看它内部的二级构成
   颜色在这里收敛成同一色相，靠明度阶梯区分 —— 一级已经统一，
   下钻层再上花色，层级感就没了。
   ========================================================= */
const CS = { catId: "" };

function rampColor(i, n) {
  const t = n <= 1 ? 0 : i / (n - 1);
  const dark = document.documentElement.dataset.theme === "dark";
  const L = dark ? 70 - t * 34 : 30 + t * 44;
  const S = dark ? 26 - t * 9 : 34 - t * 13;
  return `hsl(155 ${S.toFixed(0)}% ${L.toFixed(0)}%)`;
}

function prevPeriod() {
  const a = ST.statAnchor;
  if (ST.statRange === "month") {
    const d = new Date(a.getFullYear(), a.getMonth() - 1, 1);
    return {
      start: d.getTime(),
      end: new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime(),
      label: `${d.getMonth() + 1}月`
    };
  }
  const d = new Date(a.getFullYear() - 1, 0, 1);
  return {
    start: d.getTime(),
    end: new Date(d.getFullYear() + 1, 0, 1).getTime(),
    label: `${d.getFullYear()}年`
  };
}

function openTxns(title, list, dir) {

    ? `共 ${list.length} 笔 · 合计 <b>${dir === "out" ? "-" : "+"}${fmtMoney(total)}</b>`

    ? `<div class="bk-items">${list.map((t) => {
        const c = catById(t.cat);

        const label = t.sub && t.sub !== c.name ? `${c.name} · ${t.sub}` : c.name;
        return `<div class="bk-item">

        <span class="bk-main">
          <span class="bk-cat">${esc(label)}</span>
          <span class="bk-note">${dateLabel(new Date(t.at))}${t.note ? " · " + esc(t.note) : ""}</span>

      }).join("")}</div>`

  $("#sheet-txns").classList.remove("is-open");
}

/** 下钻页点二级：按当前分类 + 期间 + 方向重新筛，不依赖渲染时的缓存 */
function openSubTxns(subName) {
  const cat = catById(CS.catId);
  const p = statPeriod();
  const dir = ST.statDir;
  const isOrphan = !cat.id;
  const list = ST.txns.filter((t) => {
    if (t.dir !== dir || t.at < p.start || t.at >= p.end) return false;
    if ((t.sub || "未分类") !== subName) return false;
    return isOrphan ? !CATS.some((c) => c.id === t.cat) : t.cat === cat.id;
  }).sort((a, b) => b.at - a.at);
  openTxns(`${cat.name} · ${subName}`, list, dir);
}

/** 月度报表点收入/支出：列出该月该方向全部流水 */
function openMonthTxns(s, e, dir) {
  const d = new Date(Number(s));
  const list = ST.txns
    .filter((t) => t.at >= Number(s) && t.at < Number(e) && t.dir === dir)
    .sort((a, b) => b.at - a.at);
  openTxns(`${d.getFullYear()}年${d.getMonth() + 1}月 · ${dir === "out" ? "支出" : "收入"}`, list, dir);
}

  CS.catId = catId;

}

function renderCatStat() {
  const cat = catById(CS.catId);
  const p = statPeriod();
  const dir = ST.statDir;
  const unit = dir === "out" ? "支出" : "收入";
  $("#cs-title").textContent = cat.name;

  /* 未分类（分类被删或导入没映射上）也能进来，按「查无此分类」过滤 */
  const isOrphan = !cat.id;
  const pick = (s, e) => ST.txns.filter((t) => {
    if (t.dir !== dir || t.at < s || t.at >= e) return false;
    return isOrphan ? !CATS.some((c) => c.id === t.cat) : t.cat === cat.id;
  });
  const list = pick(p.start, p.end);
  const total = list.reduce((a, t) => a + t.amount, 0);
  const n = list.length;
  const avg = n ? total / n : 0;

  const pv = prevPeriod();
  const prevTotal = pick(pv.start, pv.end).reduce((a, t) => a + t.amount, 0);
  const chg = prevTotal > 0 ? ((total - prevTotal) / prevTotal) * 100 : null;

  const bySub = new Map();
  for (const t of list) {
    const k = t.sub || "未分类";
    bySub.set(k, (bySub.get(k) || 0) + t.amount);
  }
  const raw = [...bySub.entries()].map(([name, v]) => ({ name, v })).sort((a, b) => b.v - a.v);
  const subs = raw.map((s, i) => ({ ...s, c: { c: rampColor(i, raw.length) } }));
  const subCnt = (name) => list.filter((t) => (t.sub || "未分类") === name).length;

  const months = barMonths();
  const mdata = months.map((m) => pick(m.s, m.e).reduce((a, t) => a + t.amount, 0));
  const maxV = Math.max(1, ...mdata);
  const now = new Date();
  const denom = total || 1;

  $("#cs-body").innerHTML = `
    <div class="cs-hero">
      <div class="c"><em>${ST.statRange === "month" ? ST.statAnchor.getMonth() + 1 + "月共" + unit : "全年共" + unit}</em><b>${fmtMoney(total)}</b></div>
      <div class="c"><em>笔数</em><b>${n}</b></div>
      <div class="c"><em>笔均</em><b>${fmtMoney(avg)}</b></div>
    </div>
    ${chg === null ? "" : `<p class="cs-compare">较${pv.label}<span class="${chg >= 0 ? "up" : "down"}">${chg >= 0 ? "↑" : "↓"} ${Math.abs(chg).toFixed(1)}%</span></p>`}

    <div class="st-card">
      <h3><span>月度走势</span></h3>
      ${total ? `<div class="bars">
        ${mdata.map((v, i) => `<div class="bar-col">
          <div class="bar" style="height:${Math.max(2, (v / maxV) * 100)}%;background:${rampColor(i, 12)}"></div>
        </div>`).join("")}
      </div>
      <div class="bar-x">
        ${months.map((m) => `<span class="${m.m === now.getMonth() + 1 && m.y === now.getFullYear() ? "is-now" : ""}">${m.m}</span>`).join("")}
      </div>` : `<div class="empty" style="padding:16px 0">还没有记录</div>`}
    </div>

    ${raw.length ? `<div class="st-card">
      <h3><span>${unit}占比</span></h3>
      <div class="share-wrap">
        <div class="donut-box">
          <div class="donut" style="background:${donutOf(subs, denom)}"></div>
          <div class="donut-mid"><b>${fmtMoney(total)}</b><span>共 ${n} 笔</span></div>
        </div>
        <div class="share-legend">
          ${subs.slice(0, 5).map((s) => `<div class="sl-row">
            <i style="background:${s.c.c}"></i>
            <span>${esc(s.name)}</span>
            <b>${((s.v / denom) * 100).toFixed(1)}%</b>
          </div>`).join("")}
          ${subs.length > 5 ? `<div class="sl-row"><i style="background:var(--line-2)"></i><span>其他 ${subs.length - 5} 项</span><b>${((subs.slice(5).reduce((a, b) => a + b.v, 0) / denom) * 100).toFixed(1)}%</b></div>` : ""}
        </div>
      </div>
    </div>

    <div class="st-card">
      <h3><span>${unit}数据</span></h3>
      <div class="cs-list">
        ${subs.map((s) => `<div class="cs-row is-click" data-sub="${esc(s.name)}" role="button" tabindex="0">
          <div class="cs-top">
            <span class="cs-name">${esc(s.name)}<span class="cs-go">›</span></span>
            <span class="cs-amt">${dir === "out" ? "-" : "+"}${fmtMoney(s.v)}</span>
          </div>
          <div class="cs-meta">
            <span>${subCnt(s.name)} 笔</span>
            <span>${((s.v / denom) * 100).toFixed(1)}%</span>
          </div>
          <span class="cs-bar"><i style="width:${(s.v / denom) * 100}%;background:${s.c.c}"></i></span>
        </div>`).join("")}
      </div>
    </div>` : `<div class="st-card"><div class="cs-empty">这段时间这个分类没有记录</div></div>`}
  `;
}

/* 补录时的日期文案：近三天说人话，再远就说几月几日 */
function fmtDateLabel(key) {
  const t = Date.now();
  if (key === dayKey(t)) return "今天";
  if (key === dayKey(t - 86400000)) return "昨天";
  if (key === dayKey(t - 172800000)) return "前天";
  const d = key.split("-").map(Number);
  const dt = new Date(d[0], d[1] - 1, d[2]);
  /* 补录可能落到别的年份，年月日都给全，别让人误以为今年 */
  if (d[0] !== new Date().getFullYear()) return `${d[0]}年${d[1]}月${d[2]}日`;
  return `${d[1]}月${d[2]}日 周${WEEK_CN[dt.getDay()]}`;
}

/* 区间行：到哪天 + 至今。返回 {end, open}，提交时自己取 */
function spanFieldHtml(id) {
  return `
      <div class="f-row">
        <label>到哪天</label>
        <div class="f-span">
          <button class="f-in f-date is-ph" id="${id}" type="button">—</button>
          <button class="f-now" id="${id}-now" type="button">至今</button>
          <button class="f-x" id="${id}-x" type="button" aria-label="清除" hidden>×</button>
        </div>
      </div>`;
}
function mountSpan(bd, id, init) {
  const st = { end: (init && init.end) || 0, open: !!(init && init.endOpen) };
  const btn = bd.querySelector("#" + id);
  const nowBtn = bd.querySelector("#" + id + "-now");
  const xBtn = bd.querySelector("#" + id + "-x");
  const paint = () => {
    /* 开着「至今」时日期让位，别两处都写「至今」 */
    const lbl = !st.open && st.end ? fmtDateLabel(dayKey(st.end)) : "—";
    btn.textContent = lbl;
    btn.classList.toggle("is-ph", lbl === "—");
    nowBtn.classList.toggle("is-on", st.open);
    xBtn.hidden = !st.open && !st.end;
  };
  btn.addEventListener("click", () => {
    openDatePop(dayKey(st.end || Date.now()), (k) => {
      st.end = endOfDay(k);
      st.open = false;
      paint();
    });
  });
  nowBtn.addEventListener("click", () => {
    st.open = !st.open;
    paint();
  });
  xBtn.addEventListener("click", () => {
    st.end = 0;
    st.open = false;
    paint();
  });
  paint();
  return st;
}
/* 把弹窗里选的区间落到记录上；不足一天就当点事件 */
function applySpan(n, st) {
  if (st.open) { n.endOpen = true; delete n.end; return; }
  let end = st.end || 0;
  if (end && end < n.at) {
    /* 起止选反了就掉个头，别默默吞掉 */
    const a = new Date(n.at), e = new Date(end);
    n.at = new Date(e.getFullYear(), e.getMonth(), e.getDate(), a.getHours(), a.getMinutes()).getTime();
    end = new Date(a.getFullYear(), a.getMonth(), a.getDate(), 23, 59, 59).getTime();
  }
  if (end > n.at) { n.end = end; delete n.endOpen; return; }
  delete n.end;
  delete n.endOpen;
}

/* 新建一条大事记：日期可回头选，时刻用这一刻 */
function backfillTrack() {
  let date = dayKey(Date.now());
  let span = { end: 0, open: false };
  openModal({
    title: "新建大事记",
    okText: "记下",
    body: `
      <div class="f-row">
        <label>哪天</label>
        <button class="f-in f-date" id="bf-date" type="button">${fmtDateLabel(date)}</button>
      </div>
      ${spanFieldHtml("bf-end")}
      <div class="f-row">
        <label>做了什么</label>
        <textarea class="f-in f-area" id="bf-text" maxlength="120" rows="3" placeholder="读完《活着》"></textarea>
      </div>
      <div class="f-row">
        <label>在哪儿</label>
        <input class="f-in" id="bf-place" maxlength="30" placeholder="杭州 · 西湖（可不填）" autocomplete="off" />
      </div>`,
    onOpen: (bd) => {
      bd.querySelector("#bf-date").addEventListener("click", () => {
        openDatePop(date, (k) => {
          date = k;
          bd.querySelector("#bf-date").textContent = fmtDateLabel(k);
        });
      });
      span = mountSpan(bd, "bf-end", null);
      bd.querySelector("#bf-text").focus();
    },
    onOk: async () => {
      const text = ($("#bf-text").value || "").trim();
      if (!text) { toast("写一句补什么"); return false; }
      const d = date.split("-").map(Number);
      const now = new Date();
      const n = {
        id: uid("n"), text, kind: "mile", createdAt: Date.now(),
        place: ($("#bf-place").value || "").trim(),
        at: new Date(d[0], d[1] - 1, d[2], now.getHours(), now.getMinutes()).getTime()
      };
      applySpan(n, span);
      ST.notes.unshift(n);
      await dbPut("notes", n);
      ST.notes.sort((a, b) => b.at - a.at);
      renderTrack(); renderSpace(); renderNoteFeed(); renderMeStats();
      buzz(10);
      toast("补上了");
      return true;
    }
  });
}

function renderTrack() {
  const box = $("#track");
  const days = new Map();
  const touch = (ts) => {
    const k = dayKey(ts);
    if (!days.has(k)) days.set(k, { key: k, at: startOfDay(ts).getTime(), notes: [], trackTxns: [] });
    return days.get(k);
  };
  ST.notes.forEach((n) => { if (isMile(n)) touch(mileDay(n)).notes.push(n); });
  /* 记账只有自己点了「轨迹」才进这里，不按天自动灌进来 */
  ST.txns.forEach((t) => { if (t.inTrack) touch(t.at).trackTxns.push(t); });

  const arr = Array.from(days.values()).sort((a, b) => b.key.localeCompare(a.key));
  if (!arr.length) {
    box.innerHTML = `<div class="empty"><b>还没有大事记</b></div>`;
    return;
  }

  box.innerHTML = arr.map((d) => {
    const dt = new Date(d.at);
    let inner = "";
    d.notes.forEach((n) => {
      const sp = mileSpan(n);
      const live = sp && mileEnd(n) >= Date.now();
      inner += `<div class="mile mile-hit${live ? " is-live" : ""}" data-nid="${n.id}">${
        sp ? `<span class="mile-span">${esc(sp)}</span>` : ""}${esc(n.text)}</div>`;
    });
    d.trackTxns.forEach((t) => {
      const c = catById(t.cat);
      inner += `<div class="mile mile-tx">
        <span style="width:6px;height:6px;border-radius:50%;background:${c.c};flex:0 0 auto"></span>
        <span>${esc(catLabel(t))}${t.note ? " · " + esc(t.note) : ""}</span>
        <span class="mt-amt">${t.dir === "out" ? "-" : "+"}${fmtMoney(t.amount)}</span>
      </div>`;
    });
    return `<div class="day ${d.notes.length ? "has-mile" : ""}">
      <span class="day-dot"></span>
      <div class="day-label"><b>${dt.getFullYear() === new Date().getFullYear()
        ? `${dt.getMonth() + 1}/${dt.getDate()}`
        : `${dt.getFullYear()}/${dt.getMonth() + 1}/${dt.getDate()}`}</b> 周${WEEK_CN[dt.getDay()]}</div>
      ${inner}
    </div>`;
  }).join("");
}

function pathBox(d) {

  CNTY_BY.forEach((l, code) => l.forEach((o) => out.push({ n: o.n, code, d: o.d })));
  out.sort((a, b) => b.n.length - a.n.length);

/* 地点文本 → 坐标。手调的景区城市名先比一遍，

function placeAt(text) {
  const s = String(text || "");
  if (!s) return null;
  if (placeCache.has(s)) return placeCache.get(s);
  let best = null;
  for (const c of CITY_LIST) {
    if (s.indexOf(c.n) < 0) continue;
    if (!best || c.n.length > best.n.length) best = { n: c.n, lon: c.lon, lat: c.lat, prov: c.prov };
  }
  let provCode = "";
  for (const p of PROV) if (s.indexOf(p.short) >= 0) { provCode = p.code; break; }
  let out = best;
  for (const o of PLACE_NAMES) {
    if (o.n.length < 2 || s.indexOf(o.n) < 0) continue;
    if (provCode && o.code !== provCode) continue;
    if (best && best.n.length >= o.n.length) break;
    const b = pathBox(o.d);
    const pv = PROV.find((x) => x.code === o.code);
    out = { n: o.n, lon: lonOf(b.cx), lat: latOf(b.cy), prov: pv ? pv.short : "" };
    break;
  }
  placeCache.set(s, out);
  return out;
}

function endOfDay(key) {

function mileEnd(n) {
  if (n.endOpen) return Date.now();
  return n.end && n.end > n.at ? n.end : 0;
}
/* 时间轴归到哪天：还在持续的算今天，已结束的算开始那天 */
function mileDay(n) {
  const e = mileEnd(n);
  return e && e >= Date.now() ? Date.now() : n.at;
}
/* 跨度文案，点事件返回空串 */
function mileSpan(n) {
  const e = mileEnd(n);
  if (!e || e <= n.at) return "";
  const a = new Date(n.at), b = new Date(e);
  if (n.endOpen) return `${a.getFullYear()}/${a.getMonth() + 1} — 至今`;
  if (a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth())
    return `${a.getFullYear()}/${a.getMonth() + 1}/${a.getDate()} — ${b.getDate()}日`;
  if (a.getFullYear() === b.getFullYear())
    return `${a.getFullYear()}/${a.getMonth() + 1} — ${b.getMonth() + 1}月`;
  return `${a.getFullYear()}/${a.getMonth() + 1} — ${b.getFullYear()}/${b.getMonth() + 1}`;
}
/* 空间页一行窄，跨度再压一档 */
function mileSpanShort(n) {
  const e = mileEnd(n);
  if (!e || e <= n.at) return fmtMileDate(n.at);
  const a = new Date(n.at), b = new Date(e);
  if (n.endOpen) return `${a.getFullYear()}—至今`;
  return a.getFullYear() === b.getFullYear()
    ? `${a.getFullYear()}/${a.getMonth() + 1}—${b.getMonth() + 1}`
    : `${a.getFullYear()}—${b.getFullYear()}`;
}

function fmtMileDate(ts) {

    : `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;

    const fs = 10.5 / k, lh = 18 / k, cw = 56 / k;
    const cand = [];
    /* 去过的地方落在哪个市，那个市的名字优先占位 */
    const fav = new Set();
    mapSpots.forEach((s) => {
      let best = null, bd = 1e9;
      const sx = mapX(s.anchor.lon), sy = mapY(s.anchor.lat);
      for (const p of vis) {
        for (const o of MUNI_BY.get(p.code) || []) {
          const b = o.b || (o.b = pathBox(o.d));
          const d = Math.abs(b.cx - sx) + Math.abs(b.cy - sy);
          if (d < bd && sx > b.x0 && sx < b.x1 && sy > b.y0 && sy < b.y1) { bd = d; best = o; }
        }
      }
      if (best) fav.add(best);
    });
    let m = "";
    for (const p of vis) {
      for (const o of MUNI_BY.get(p.code) || []) {
        m += `<path d="${o.d}"/>`;
        if (lv !== 1) continue;
        const b = o.b || (o.b = pathBox(o.d));
        const tw = o.n.length * fs;
        if (b.cx - tw / 2 < MV.x + 2 || b.cx + tw / 2 > MV.x + MV.w - 2) continue;
        cand.push({ b, n: shortCity(o.n), w: (fav.has(o) ? 1e7 : 0) + (b.x1 - b.x0) * (b.y1 - b.y0) });
      }
    }
    /* 直辖市与特别行政区没有「市」这一层，用省名顶上 */
    for (const p of vis) {
      if (MUNI_BY.has(p.code)) continue;
      const b = p.box, tw = p.short.length * fs;
      if (b.cx - tw / 2 < MV.x + 2 || b.cx + tw / 2 > MV.x + MV.w - 2) continue;
      const hot = mapSpots.some((s) => s.anchor.prov === p.short);
      cand.push({ b, n: p.short, w: (hot ? 1e7 : 0) + (b.x1 - b.x0) * (b.y1 - b.y0) });
    }
    let ml = "";
    if (lv === 1) {
      const used = [];
      cand.sort((a, b) => b.w - a.w);
      let cnt = 0;
      for (const c of cand) {
        if (cnt >= 28) break;
        if (used.some((u) => Math.abs(u.y - c.b.cy) < lh && Math.abs(u.x - c.b.cx) < cw)) continue;
        /* 市名落在自己的点上就往上让一让 */
        const onDot = mapSpots.some((s) => Math.abs(mapX(s.anchor.lon) - c.b.cx) < 26 / k && Math.abs(mapY(s.anchor.lat) - c.b.cy) < 30 / k);
        const ty = onDot ? c.b.cy - 26 / k : c.b.cy;
        used.push({ x: c.b.cx, y: ty });
        cnt++;
        ml += `<text class="mp-ml" text-anchor="middle" x="${c.b.cx.toFixed(0)}" y="${ty.toFixed(0)}" font-size="${fs.toFixed(1)}">${esc(c.n)}</text>`;
      }
    }
    if (m) h += `<g class="mp-muni">${m}</g>`;
    if (ml) h += `<g class="mp-mls">${ml}</g>`;
  }
  if (lv >= 2) {
    const fs = 10.5 / k, lh = 19 / k, cw = 68 / k;
    const ins = insBox;
    const spotKeys = new Set(mapSpots.map((s) => s.anchor.prov + "|" + s.anchor.n));
    let c = "", labels = "";
    const used = [];
    for (const p of vis) {
      for (const o of CNTY_BY.get(p.code) || []) {
        const b = o.b || (o.b = pathBox(o.d));
        if (b.x1 < MV.x || b.x0 > MV.x + MV.w || b.y1 < MV.y || b.y0 > MV.y + MV.h) continue;
        const hasDot = spotKeys.has(p.short + "|" + o.n);
        c += hasDot ? `<path d="${o.d}" class="on"/>` : `<path d="${o.d}"/>`;
        if (hasDot) continue;
        if (used.some((u) => Math.abs(u.y - b.cy) < lh && Math.abs(u.x - b.cx) < cw)) continue;
        if (ins && b.cx > ins.x - cw * 1.4 && b.cy > ins.y) continue;
        const tw = o.n.length * fs * 1.02;
        if (b.cx - tw / 2 < MV.x + 2 || b.cx + tw / 2 > MV.x + MV.w - 2) continue;
        used.push({ x: b.cx, y: b.cy });
        labels += `<text class="mp-cl" text-anchor="middle" x="${b.cx.toFixed(0)}" y="${b.cy.toFixed(0)}" font-size="${fs.toFixed(1)}">${esc(o.n)}</text>`;
      }
    }
    h += `<g class="mp-cnty">${c}</g><g class="mp-cls">${labels}</g>`;
  }

  const placed = [];
  let marks = "";
  mapSpots.forEach((s) => {
    const x = mapX(s.anchor.lon), y = mapY(s.anchor.lat);
    const r = Math.min(15 / k, (6 + Math.sqrt(s.total) * 3) / k);
    marks += `<g class="mp-spot" data-city="${esc(s.anchor.n)}">
      <circle class="mp-halo" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r * 2.1).toFixed(1)}"></circle>
      <circle class="mp-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}"></circle>
    </g>`;
    const tw = s.anchor.n.length * 12 / k;
    const ly = y + 5 / k;
    let lx = x + r + 8 / k;
    const full = lx + tw > MV.x + MV.w - 3 || (insBox && lx + tw > insBox.x && ly > insBox.y);
    if (full) lx = Math.max(MV.x + 3, x - r - 8 / k - tw);
    const busy = placed.some((p) => Math.abs(p.y - ly) < 18 / k && Math.abs(p.x - lx) < 52 / k);
    if (!busy && placed.length < 12) {
      placed.push({ x: lx, y: ly });
      marks += `<text class="mp-lab" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="${(12 / k).toFixed(1)}">${esc(s.anchor.n)}</text>`;
    }
  });

  svg.innerHTML = h + `<g class="mp-marks">${marks}</g>` + `<g id="map-inset" class="mp-inset">${MAP_INSET}</g>`;
  mapInset();
}
function renderMap(spots) {
  mapSpots = spots || [];
  mapPaint(true);
}

/* ---------- 地图交互：拖、捏、滚轮、双击 ---------- */
function bindMap() {
  const svg = $("#map");
  if (!svg) return;
  const ptrs = new Map();
  let drag = null, pinch = null;

  const world = (cx, cy) => {
    const r = svg.getBoundingClientRect();
    const k = r.width / MV.w;
    return { x: MV.x + (cx - r.left) / k, y: MV.y + (cy - r.top) / k };
  };

  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    const w = world(e.clientX, e.clientY);
    mapZoomAt(MV.z * (e.deltaY < 0 ? 1.16 : 1 / 1.16), w.x, w.y);
  }, { passive: false });

  svg.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
    if (ptrs.size === 1) {
      drag = { x: e.clientX, y: e.clientY };
    } else if (ptrs.size === 2) {
      const a = Array.from(ptrs.values());
      pinch = {
        d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1,
        z: MV.z,
        cx: (a[0].x + a[1].x) / 2,
        cy: (a[0].y + a[1].y) / 2
      };
      drag = null;
    }
  });

  svg.addEventListener("pointermove", (e) => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && ptrs.size >= 2) {
      const a = Array.from(ptrs.values());
      const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1;
      const w = world(pinch.cx, pinch.cy);
      mapZoomAt(pinch.z * (d / pinch.d), w.x, w.y);
      mapMovedAt = Date.now();
      return;
    }
    if (!drag || MV.z <= 1.02) return;
    const r = svg.getBoundingClientRect();
    const k = r.width / MV.w;
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) mapMovedAt = Date.now();
    MV.x -= (e.clientX - drag.x) / k;
    MV.y -= (e.clientY - drag.y) / k;
    drag.x = e.clientX; drag.y = e.clientY;
    mapClamp(); mapApply();
  });

  const end = (e) => {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (ptrs.size === 0) drag = null;
  };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", end);

  svg.addEventListener("dblclick", (e) => {
    const w = world(e.clientX, e.clientY);
    mapZoomAt(MV.z > 4.5 ? 1 : MV.z * 2, w.x, w.y);
    mapMovedAt = Date.now() + 300;
  });

  svg.addEventListener("click", (e) => {
    if (Date.now() - mapMovedAt < 320) return;
    const spot = e.target.closest(".mp-spot");
    if (!spot) return;
    const el = Array.from(document.querySelectorAll("#space .sp")).find((n) => n.dataset.city === spot.dataset.city);
    if (!el) return;
    el.scrollIntoView({ block: "start", behavior: "smooth" });
    el.classList.add("is-hit");
    setTimeout(() => el.classList.remove("is-hit"), 1500);
    buzz(6);
  });

  $("#map-in").addEventListener("click", () => mapZoomAt(MV.z * 1.7, MV.x + MV.w / 2, MV.y + MV.h / 2));
  $("#map-out").addEventListener("click", () => mapZoomAt(MV.z / 1.7, MV.x + MV.w / 2, MV.y + MV.h / 2));
  $("#map-back").addEventListener("click", () => mapReset());
}

function renderSpace() {
  const box = $("#space");
  if (!box) return;
  const big = ST.notes.filter(isMile);
  const map = new Map();
  big.forEach((n) => {
    const place = String(n.place || "").trim();
    if (!place) return;
    if (!map.has(place)) map.set(place, []);
    map.get(place).push(n);
  });
  const groups = Array.from(map.entries()).map(([place, list]) => {
    list.sort((a, b) => mileDay(b) - mileDay(a));
    return { place, list, last: mileDay(list[0]), anchor: placeAt(place) };
  }).sort((a, b) => b.last - a.last);

  /* 地图按城市聚：一个城市下可能有好几个地点 */
  const cityMap = new Map();
  groups.forEach((g) => {
    if (!g.anchor) return;
    const k = g.anchor.prov + "/" + g.anchor.n;
    if (!cityMap.has(k)) cityMap.set(k, { anchor: g.anchor, total: 0 });
    cityMap.get(k).total += g.list.length;
  });
  const spots = Array.from(cityMap.values()).sort((a, b) => b.total - a.total);
  renderMap(spots);

  if (!groups.length) {
    box.innerHTML = `<div class="empty"><b>还没有地点</b></div>`;
    return;
  }
  box.innerHTML = groups.map((g) => `
    <div class="sp" data-city="${g.anchor ? esc(g.anchor.n) : ""}">
      <div class="sp-h"><b>${esc(g.place)}</b><span>${g.list.length} 条${g.anchor ? "" : " · 未定位"}</span></div>
      ${g.list.map((n) => `<div class="sp-row mile-hit" data-nid="${n.id}"><time>${esc(mileSpanShort(n))}</time><span>${esc(n.text)}</span></div>`).join("")}
    </div>`).join("");
}

/* =========================================================
   目标
   只有一种判定：数字。current ÷ target 就是进度。
   只有年度目标。进度要么自动取记账余额，要么由挂着的计划累加。
   ========================================================= */
/* 标题里写 @ 标记就自动取数，不写就自己填 */
const SRC_MAP = [
  ["记账余额", "balance"], ["余额", "balance"], ["记账", "balance"]
];
const SRC_NAME = { balance: "余额" };
const SRC_TAG = { balance: "记账余额" };
/* 从标题里抠出 @来源，返回干净标题与来源类型 */
function parseSrc(raw) {
  const s = String(raw || "");
  for (const pair of SRC_MAP) {
    const m = s.match(new RegExp("[@＠]\\s*" + pair[0]));
    if (m) return { title: s.replace(m[0], "").replace(/\s{2,}/g, " ").trim(), t: pair[1] };
  }
  return { title: s.trim(), t: "" };
}
/* 自动取数只剩余额一项：存量，取当前 */
function probeCount(t) {
  return t === "balance" ? nowBalance() : 0;
}
/* 旧数据：随笔与大事记分开存，kind 一拍定死 */
function isMile(n) { return n.kind === "mile"; }
async function migrateNoteKind() {
  for (const n of ST.notes) {
    if (n.kind) continue;
    n.kind = n.big ? "mile" : "note";
    delete n.big;
    await dbPut("notes", n);
  }
}
/* 目标只剩年度：月/长期并进当年；大事记/随笔的自动数断开，进度冻在那一刻 */
async function migrateGoalYear() {
  for (const g of ST.goals) {
    let dirty = false;
    if (g.period !== "year") {
      const y = new Date(g.from || g.createdAt || Date.now()).getFullYear();
      Object.assign(g, {
        period: "year", key: String(y),
        from: new Date(y, 0, 1).getTime(), to: new Date(y + 1, 0, 1).getTime()
      });
      dirty = true;
    }
    if (g.probe && g.probe.t && g.probe.t !== "balance") {
      const from = g.from, to = g.to;
      g.manual = g.probe.t === "mile"
        ? ST.notes.filter((n) => isMile(n) && (!from || (n.at >= from && n.at < to))).length
        : ST.notes.filter((n) => !isMile(n) && (!from || (n.at >= from && n.at < to))).length;
      g.probe = null;
      dirty = true;
    }
    if (dirty) await dbPut("goals", g);
  }
}
/* 旧了结型统一转成数字目标，target=1、完成即 1 条 */
async function migrateOnceGoals() {
  const old = ST.goals.filter((g) => g.kind === "once");
  for (const g of old) {
    Object.assign(g, { kind: "metric", target: 1, unit: "", probe: null,
      manual: g.done ? 1 : 0, finish: "" });
    await dbPut("goals", g);
  }
}

/* 旧 plans 是「本周待办」，按语义搬进计划；幂等，plans 表保留不删 */
function normMemo(p) {
  return {
    id: p.id,
    text: p.title || p.text || "",
    done: !!p.done, doneAt: p.doneAt || 0,
    priority: (p.kind === "stretch" || p.priority === "stretch") ? "stretch" : "must",
    createdAt: p.createdAt || Date.now()
  };
}
async function migratePlans(meta) {
  if ((meta || []).some((x) => x.k === "plansMovedToMemo" && x.v)) return;
  const have = new Set(ST.memos.map((m) => m.id));
  const conv = (ST.plans || []).map(normMemo).filter((m) => m.text && !have.has(m.id));
  if (conv.length) {
    await dbBulkPut("memos", conv);
    ST.memos.push(...conv);
  }
  await dbPut("meta", { k: "plansMovedToMemo", v: 1 });
}

/* 老计划没有周字段：按创建时间归周，其余默认值补上（幂等） */
async function migrateMemoWeek() {
  for (const m of ST.memos) {
    if (m.week && m.doneWeeks) continue;
    m.week = m.week || weekKey(m.createdAt || Date.now());
    m.repeat = m.repeat === "weekly" ? "weekly" : "";
    m.goalId = m.goalId || "";
    m.amount = Number(m.amount) || 0;
    m.doneWeeks = m.doneWeeks || {};
    await dbPut("memos", m);
  }
}
/* 备份兼容：v0.12 之前的目标不存在，只可能有 goals 或 plans */
function normGoal(g) { return g; }

/* ---------- 周期 ---------- */
function periodRange(p, anchor) {
  const d = new Date(anchor || Date.now());
  const y = d.getFullYear();
  return { key: String(y), start: new Date(y, 0, 1).getTime(), end: new Date(y + 1, 0, 1).getTime(), label: `${y}年` };
}
function periodShift(p, anchor, n) {
  const d = new Date(anchor || Date.now());
  d.setFullYear(d.getFullYear() + n);
  return d.getTime();
}

/* ---------- 进度 ---------- */
/* 目标自带 from/to，翻到过去也能算出「此刻应在的位置」 */
function paceOf(g) {
  if (!g.from || !g.to || g.to <= g.from) return null;
  return Math.max(0, Math.min(1, (Date.now() - g.from) / (g.to - g.from)));
}
/* 周 key（YYYY-MM-DD）→ 当天零点 */
function keyTime(k) {
  const a = String(k || "").split("-").map(Number);
  return (a.length === 3 && a[0]) ? new Date(a[0], a[1] - 1, a[2]).getTime() : 0;
}
/* 计划贡献：挂在这条目标上、已经勾掉的计划，加起来的量 */
function memoSum(g) {
  const lo = g.from || 0, hi = g.to || 0;
  const inR = (t) => !lo || (t >= lo && t < hi);
  let sum = 0;
  for (const m of ST.memos) {
    if (m.goalId !== g.id) continue;
    const amt = Number(m.amount) || 0;
    if (!amt) continue;
    if (m.repeat === "weekly") {
      const dw = m.doneWeeks || {};
      for (const k of Object.keys(dw)) {
        if (dw[k] && inR(keyTime(k))) sum += amt;
      }
    } else if (m.done && inR(m.doneAt || keyTime(m.week) || m.createdAt || 0)) {
      sum += amt;
    }
  }
  return sum;
}
function goalNow(g) {
  if (g.probe && g.probe.t) return probeCount(g.probe.t);
  return (Number(g.manual) || 0) + memoSum(g);
}
function goalTarget(g) { return Number(g.target) || 0; }
function goalPct(g) {
  const t = goalTarget(g);
  if (!t) return 0;
  return Math.round((goalNow(g) / t) * 1000) / 10;
}
function goalDone(g) { return goalPct(g) >= 100; }
function fmtVal(v, unit) {
  const n = Number(v) || 0;
  if (unit === "元") return "¥" + fmtMoney(n).replace(/\.00$/, "");
  return Number.isInteger(n) ? String(n) : String(Math.round(n * 10) / 10);
}

/* ---------- 渲染 ---------- */
function cardHtml(g) {
  const pct = goalPct(g);
  const w = Math.max(0, Math.min(100, pct));
  const pace = paceOf(g);
  const full = pct >= 100;
  let tag = "", cls = "ok";
  if (!full && pace !== null) {
    const gap = pct / 100 - pace;
    if (gap < -0.15) {
      const n = Math.max(1, Math.round(-gap * 12));
      tag = `落后约 ${n} 个月`; cls = "lag";
    } else if (gap > 0.05) { tag = "超前"; cls = "ahead"; }
    else { tag = "跟上"; cls = "ok"; }
  }
  return `<div class="goal-card" data-id="${g.id}" data-act="edit">
    <div class="gc-h"><b>${esc(g.title)}</b><em class="${full ? "full" : ""}">${full ? "已达成" : pct + "%"}</em></div>
    <div class="gc-bar"><i class="${full ? "full" : ""}" style="width:${w}%"></i>${pace !== null && !full ? `<u style="left:${Math.round(pace * 100)}%"></u>` : ""}</div>
    <div class="gc-f"><span>${fmtVal(goalNow(g), g.unit)} / ${fmtVal(goalTarget(g), g.unit)}${
      g.probe && g.probe.t ? `<i class="gc-src">${SRC_NAME[g.probe.t] || ""}</i>`
        : (memoSum(g) ? `<i class="gc-src">计划 +${fmtVal(memoSum(g), g.unit)}</i>` : "")}</span>${tag ? `<em class="gc-tag ${cls}">${tag}</em>` : ""}</div>
  </div>`;
}
function renderGoals() {
  const box = $("#goal");
  if (!box) return;
  const r = periodRange("year", ST.goalAnchor);
  const list = ST.goals.filter((g) => !g.archivedAt && g.key === r.key)
    .sort((a, b) => a.createdAt - b.createdAt);

  const top = $("#goal-top");
  if (top) {

/* 计划以周为周期：一条条挂在本周，标了「每周重复」的自己回来 */
function memoWeekOf(m) { return m.week || weekKey(m.createdAt || Date.now()); }
function memoDone(m, wk) {
  if (m.repeat === "weekly") return !!(m.doneWeeks && m.doneWeeks[wk]);
  return !!m.done;
}
function memoShow(m, wk) {
  const w = memoWeekOf(m);
  return m.repeat === "weekly" ? w <= wk : w === wk;
}
function memoGoal(m) { return m.goalId ? ST.goals.find((g) => g.id === m.goalId) : null; }
const memoPri = (m) => (m.priority === "stretch" ? "stretch" : "must");

function renderMemo() {
  const box = $("#memo");
  if (!box) return;
  const wk = weekKey(ST.memoAnchor || Date.now());
  const isThis = wk === weekKey(Date.now());
  const all = ST.memos.filter((m) => memoShow(m, wk));
  const doneL = all.filter((m) => memoDone(m, wk)).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const openL = all.filter((m) => !memoDone(m, wk));
  const must = openL.filter((m) => memoPri(m) === "must").sort((a, b) => a.createdAt - b.createdAt);
  const stretch = openL.filter((m) => memoPri(m) === "stretch").sort((a, b) => a.createdAt - b.createdAt);

  const top = $("#memo-top");
  if (top) {
    top.innerHTML = `
      <div class="goal-nav">
        <button id="m-prev" aria-label="上一周">‹</button>
        <button id="m-label" aria-label="回到本周">${isThis ? "本周" : weekRangeLabel(new Date(keyTime(wk)))}</button>
        <button id="m-next" aria-label="下一周">›</button>
      </div>`;
  }
  if (!all.length) {
    box.innerHTML = `<div class="empty"><b>${weekRangeLabel(new Date(keyTime(wk)))} 还没有计划</b></div>`;
    return;
  }
  const row = (m) => {
    const g = memoGoal(m);
    const tag = [
      m.repeat === "weekly" ? "每周" : "",
      g ? `→ ${g.title}${Number(m.amount) ? " +" + fmtVal(m.amount, g.unit) : ""}` : ""
    ].filter(Boolean).join(" · ");
    return `<div class="pl-item ${memoDone(m, wk) ? "done" : ""} ${memoPri(m) === "stretch" ? "stretch" : ""}" data-id="${m.id}">
    <span class="pl-box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
    <span class="pl-text"><span class="pl-t">${esc(m.text)}</span>${tag ? `<i class="pl-tag">${esc(tag)}</i>` : ""}</span>
    <button class="pl-more" data-more="${m.id}" aria-label="设置">⋯</button>
  </div>`;
  };
  box.innerHTML = `
    ${must.length ? `<div class="pl-sec">${must.map(row).join("")}</div>` : ""}
    ${stretch.length ? `<div class="pl-sec">${stretch.map(row).join("")}</div>` : ""}
    ${doneL.length ? `<div class="pl-sec">${doneL.slice(0, 40).map(row).join("")}</div>` : ""}
  `;
}
async function toggleMemo(id) {
  const m = ST.memos.find((x) => x.id === id);
  if (!m) return;
  const wk = weekKey(ST.memoAnchor || Date.now());
  if (m.repeat === "weekly") {
    m.doneWeeks = m.doneWeeks || {};
    m.doneWeeks[wk] = !m.doneWeeks[wk];
  } else {
    m.done = !m.done;
    m.doneAt = m.done ? Date.now() : 0;
  }
  await dbPut("memos", m);
  renderMemo(); renderGoals();
  buzz(8);
}
