<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#f4f1ea" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="生活" />
<meta name="format-detection" content="telephone=no" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<link rel="icon" href="./icon-192.png" />
<title>生活 · 记账</title>
<style>
/* =========================================================
   生活 · 设计令牌（与 Tempo 同源，换主题只换这一组）
   ========================================================= */
:root {
  --bg: #f4f1ea;
  --bg-tint: #eae4d6;
  --surface: #fffefb;
  --surface-2: #faf7f1;
  --hover: rgba(32, 32, 29, 0.04);
  --hover-2: rgba(32, 32, 29, 0.07);

  --ink: #211f1b;
  --ink-2: #5b564d;
  --ink-3: #948d80;

  --line: rgba(33, 31, 27, 0.075);
  --line-2: rgba(33, 31, 27, 0.14);

  --brand: #3d7a61;
  --brand-soft: rgba(61, 122, 97, 0.09);
  --brand-line: rgba(61, 122, 97, 0.26);

  --accent: #c4853f;
  --accent-soft: rgba(196, 133, 63, 0.12);
  --danger: #b5563f;
  --danger-soft: rgba(181, 86, 63, 0.12);

  --btn-bg: #221f1b;
  --btn-fg: #fbf9f4;
  --ghost-bg: rgba(32, 32, 29, 0.045);

  --shadow-1: 0 1px 2px rgba(32, 29, 24, 0.05), 0 1px 0 rgba(255, 255, 255, 0.6) inset;
  --shadow-2: 0 2px 5px -2px rgba(32, 29, 24, 0.07), 0 18px 38px -22px rgba(32, 29, 24, 0.28);
  --shadow-3: 0 26px 60px -30px rgba(28, 26, 21, 0.4);

  /* 液态玻璃：半透明面 + 背景模糊 + 一道高光边 */
  --glass: rgba(255, 254, 251, 0.55);
  --glass-2: rgba(255, 254, 251, 0.34);
  --glass-brd: rgba(255, 255, 255, 0.66);
  --glass-hi: rgba(255, 255, 255, 0.85);
  --glass-blur: saturate(1.85) blur(22px);
  --glass-blur-lite: saturate(1.5) blur(12px);

  /* 内凹窗口（滚轮计数器的表壳） */
  --well-top: #ece6d9;
  --well-bot: #f6f2e9;
  --well-in: rgba(48, 42, 32, 0.16);
  --well-ring: rgba(255, 255, 255, 0.7);

  /* 背景光雾 */
  --mist-1: rgba(202, 134, 54, 0.34);
  --mist-2: rgba(58, 116, 94, 0.15);
  --mist-3: rgba(206, 170, 118, 0.40);

  --r-xl: 26px;
  --r-lg: 20px;
  --r-md: 14px;
  --r-sm: 10px;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  /* 滚轮停下来的那一下：带一点过冲，再被窗口边缘吃掉 */
  --ease-wheel: cubic-bezier(0.2, 1.44, 0.44, 1);
  --dur: 0.16s;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
    "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
}

[data-theme="dark"] {
  --bg: #0f1110;
  --bg-tint: #171b19;
  --surface: #191c1a;
  --surface-2: #141614;
  --hover: rgba(255, 255, 255, 0.05);
  --hover-2: rgba(255, 255, 255, 0.085);

  --ink: #eceae3;
  --ink-2: #a8a49a;
  --ink-3: #8b8880;

  --line: rgba(255, 255, 255, 0.075);
  --line-2: rgba(255, 255, 255, 0.16);

  --brand: #7db69a;
  --brand-soft: rgba(125, 182, 154, 0.13);
  --brand-line: rgba(125, 182, 154, 0.32);

  --accent: #d9a166;
  --accent-soft: rgba(217, 161, 102, 0.14);
  --danger: #d47f68;
  --danger-soft: rgba(212, 127, 104, 0.14);

  --btn-bg: #e9e6dd;
  --btn-fg: #12140f;
  --ghost-bg: rgba(255, 255, 255, 0.06);

  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
  --shadow-2: 0 2px 8px rgba(0, 0, 0, 0.35), 0 22px 48px -26px rgba(0, 0, 0, 0.75);
  --shadow-3: 0 26px 60px -30px rgba(0, 0, 0, 0.85);

  --glass: rgba(30, 34, 32, 0.52);
  --glass-2: rgba(30, 34, 32, 0.34);
  --glass-brd: rgba(255, 255, 255, 0.13);
  --glass-hi: rgba(255, 255, 255, 0.22);

  --well-top: #0a0c0b;
  --well-bot: #141715;
  --well-in: rgba(0, 0, 0, 0.62);
  --well-ring: rgba(255, 255, 255, 0.07);

  --mist-1: rgba(198, 132, 58, 0.17);
  --mist-2: rgba(84, 152, 122, 0.19);
  --mist-3: rgba(146, 122, 88, 0.20);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  user-select: none;
  touch-action: manipulation;
  position: relative;
}
button, input, textarea { font-family: inherit; }
button { cursor: pointer; }
input, textarea { user-select: text; }

/* 底下的光雾：玻璃要有东西可以折射，才不像一块灰板 */
body::before {
  content: "";
  position: fixed;
  inset: -15%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(36% 30% at 14% 4%, var(--mist-1), transparent 66%),
    radial-gradient(42% 34% at 88% 14%, var(--mist-2), transparent 68%),
    radial-gradient(56% 40% at 54% 100%, var(--mist-3), transparent 72%),
    radial-gradient(30% 26% at 2% 70%, var(--mist-2), transparent 70%);
  animation: mist 34s var(--ease) infinite alternate;
}
@keyframes mist {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to   { transform: translate3d(-2.4%, 1.8%, 0) scale(1.06); }
}
@media (prefers-reduced-motion: reduce) {
  body::before { animation: none; }
}

/* ---------------- 骨架 ---------------- */
/* 浏览器内：底部工具栏是浮层，不改变视口尺寸，只能给 tabbar 让出一条
   装成应用（standalone）后 --browser-pad 归零，不影响 */
:root { --browser-pad: 0px; }
html[data-mode="browser"][data-bpad="on"] { --browser-pad: 60px; }
@media (min-width: 561px) { html[data-bpad="on"] { --browser-pad: 0px; } }

.app {
  height: var(--vh, 100dvh);
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: transparent;
  position: relative;
  z-index: 1;
  overflow: hidden;
}

.hdr {
  flex: 0 0 auto;
  height: calc(50px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top);
  padding-inline: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--glass-2);
  -webkit-backdrop-filter: var(--glass-blur-lite);
  backdrop-filter: var(--glass-blur-lite);
  border-bottom: 1px solid var(--glass-brd);
  box-shadow: 0 10px 24px -22px rgba(48, 42, 32, 0.55);
  position: relative;
  z-index: 12;
}
.hdr::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--glass-hi), transparent);
  opacity: 0.8;
}
.hdr-title {
  font-size: 15.5px;
  font-weight: 620;
  letter-spacing: -0.005em;
  margin: 0;
}
.icon-btn {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: transparent; color: var(--ink-2);
  transition: background var(--dur) var(--ease), transform var(--dur) var(--ease);
  position: relative;
}
.icon-btn:active { transform: scale(0.92); background: var(--hover-2); }
.icon-dot {
  position: absolute; top: 6px; right: 6px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 2px var(--bg);
}

.main { flex: 1; min-height: 0; position: relative; }

/* 存储降级提示条：只在不持久时出现 */
.store-bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px 8px 18px;
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--ink-2);
  background: var(--warn-bg, rgba(196, 138, 44, 0.1));
  border-bottom: 1px solid var(--glass-brd);
  position: relative;
  z-index: 11;
}
.store-bar[hidden] { display: none; }
.store-bar span { flex: 1; min-width: 0; }
.store-bar button {
  flex: 0 0 auto;
  width: 24px; height: 24px;
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: transparent;
  color: var(--ink-3);
  font-size: 11px;
}
.store-bar button[hidden] { display: none; }
.view {
  position: absolute; inset: 0;
  display: none;
  flex-direction: column;
}
.view.is-active { display: flex; }

/* ---------------- 分段控件 ---------------- */
.seg {
  flex: 0 0 auto;
  height: 38px;
  margin: 8px 18px 4px;
  display: flex; gap: 3px;
  padding: 3px;
  background: var(--ghost-bg);
  border-radius: 12px;
}
.seg-btn {
  flex: 1; height: 32px;
  border: 0; border-radius: 9px;
  background: transparent;
  color: var(--ink-3);
  font-size: 13px; font-weight: 600;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.seg-btn.is-on {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-1);
}
.pane { flex: 1; min-height: 0; display: none; flex-direction: column; }
.pane.is-active { display: flex; }

/* =========================================================
   记账首页
   ========================================================= */
.book-scroll {
  flex: 1; min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding-bottom: 20px;
  scroll-behavior: smooth;
}
.book {
  padding: 12px 18px 0;
}
/* 记账页顶部分段：不是切页，是滚动定位 */
.book-seg {
  display: flex; gap: 4px;
  margin: 8px 18px 2px; padding: 3px;
  border-radius: 12px;
  background: var(--ghost-bg);
  border: 1px solid var(--line);
  flex: 0 0 auto;
}
.book-seg button {
  flex: 1 1 0; height: 31px;
  border: 0; border-radius: 9px;
  background: transparent; color: var(--ink-3);
  font-size: 12.5px; font-weight: 600;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.book-seg button.is-on {
  background: var(--surface); color: var(--ink);
  box-shadow: var(--shadow-1);
}

/* ---- 月度卡片 ---- */
.sum-card {
  position: relative;
  overflow: hidden;
  border-radius: 22px;
  padding: 15px 16px 12px;
  border: 1px solid var(--glass-brd);
  background:
    radial-gradient(118% 84% at 104% 116%, rgba(61, 122, 97, 0.20), transparent 62%),
    radial-gradient(84% 62% at 4% -12%, rgba(196, 133, 63, 0.13), transparent 62%),
    var(--glass);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: 0 1px 0 var(--glass-hi) inset, var(--shadow-2);
}
[data-theme="dark"] .sum-card {
  background:
    radial-gradient(118% 84% at 104% 116%, rgba(125, 182, 154, 0.15), transparent 62%),
    radial-gradient(84% 62% at 4% -12%, rgba(217, 161, 102, 0.10), transparent 62%),
    var(--glass);
}
/* 卡片右下角一层极淡的山影，替代插画 */
.sum-card::after {
  content: "";
  position: absolute; right: -18%; bottom: -46%;
  width: 74%; height: 108%;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(61, 122, 97, 0.13), transparent 72%);
  pointer-events: none;
}
.sum-row { display: flex; gap: 4px; position: relative; z-index: 1; }
.sum-cell { flex: 1 1 0; min-width: 0; text-align: center; }
.sum-cell em {
  font-style: normal;
  font-size: 10.5px;
  color: var(--ink-3);
  display: block;
  letter-spacing: 0.02em;
}
.sum-cell b {
  display: block;
  margin-top: 3px;
  font-size: clamp(12.5px, 3.7vw, 17px);
  font-weight: 680;
  letter-spacing: -0.025em;
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sum-cell b.in { color: var(--brand); }
.sum-cell b.out { color: var(--danger); }
.sum-cell b.bal { color: var(--accent); }
.sum-cell b.neg { color: var(--danger); }

.sum-bal {
  margin-top: 11px;
  padding-top: 9px;
  border-top: 1px dashed var(--line-2);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  position: relative;
  z-index: 1;
  border-radius: 8px;
  transition: background var(--dur) var(--ease);
}
.sum-bal:active { background: var(--hover); }
.sum-bal span { font-size: 11px; color: var(--ink-3); }
.sum-bal b {
  font-size: 16.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.sum-bal b.neg { color: var(--danger); }
.sum-bal b.masked {
  color: var(--ink-2);
  letter-spacing: 0.02em;
  font-weight: 620;
  font-size: 15px;
}
.bal-eye {
  flex: 0 0 auto;
  width: 28px; height: 28px;
  margin-left: 5px;
  border: 0; border-radius: 9px;
  background: transparent;
  color: var(--ink-3);
  display: grid; place-items: center;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.bal-eye:active { background: var(--hover); color: var(--ink-2); }
.bal-eye svg { width: 15px; height: 15px; }

/* ---- 添加一笔 ---- */
.add-txn {
  width: 100%;
  height: 48px;
  margin: 12px 0 2px;
  border: 0;
  border-radius: 15px;
  background: var(--brand);
  color: var(--btn-fg);
  font-size: 15px;
  font-weight: 650;
  letter-spacing: 0.01em;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  box-shadow: 0 9px 22px -13px rgba(61, 122, 97, 0.95), 0 1px 0 rgba(255, 255, 255, 0.22) inset;
  transition: transform 0.1s var(--ease), opacity 0.1s var(--ease);
}
.add-txn:active { transform: scale(0.982); opacity: 0.94; }
.add-txn svg { width: 18px; height: 18px; }

/* ---- 按日分组的流水 ---- */
.bk-day { margin-top: 14px; }
.bk-day-h {
  display: flex; align-items: baseline; gap: 7px;
  padding: 0 2px 6px;
}
.bk-day-h b { font-size: 13.5px; font-weight: 650; letter-spacing: -0.01em; }
.bk-day-h span { font-size: 11.5px; color: var(--ink-3); }
.bk-day-h em {
  margin-left: auto;
  font-style: normal;
  font-size: 11px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.bk-day-h em i { font-style: normal; margin-left: 3px; }
.bk-day-h em i.in { color: var(--brand); }
.bk-day-h em i.out { color: var(--danger); }

.bk-items {
  border-radius: 16px;
  background: color-mix(in srgb, var(--surface) 84%, transparent);
  border: 1px solid var(--glass-brd);
  box-shadow: var(--shadow-1);
  overflow: hidden;
}
.bk-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 13px;
  min-height: 54px;
  border-bottom: 1px solid var(--line);
  transition: background var(--dur) var(--ease);
}
.bk-item:last-child { border-bottom: 0; }
.bk-item:active { background: var(--hover); }
.bk-ico {
  width: 32px; height: 32px; border-radius: 10px;
  flex: 0 0 auto;
  display: grid; place-items: center;
  font-size: 13px; font-weight: 650;
  font-style: normal;
  background: var(--brand-soft);
  color: var(--brand);
}
.bk-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.bk-cat {
  font-size: 13.5px;
  color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.bk-note {
  font-size: 11.5px;
  color: var(--ink-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.bk-amt {
  font-size: 14.5px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  flex: 0 0 auto;
}
.bk-amt.out { color: var(--danger); }
.bk-amt.in { color: var(--brand); }
.bk-trk {
  font-size: 9px; color: var(--accent);
  border: 1px solid var(--accent); border-radius: 4px;
  padding: 0 3px; line-height: 12px;
  flex: 0 0 auto; margin-left: 2px;
}
.more-btn {
  width: 100%; height: 40px; margin-top: 12px;
  border: 1px dashed var(--line-2); border-radius: 13px;
  background: transparent; color: var(--ink-3);
  font-size: 12.5px;
}
.more-btn:active { background: var(--hover); }

.empty {
  padding: 26px 4px;
  text-align: center;
  color: var(--ink-3);
  font-size: 12.5px;
  line-height: 1.8;
}
.empty b { display: block; color: var(--ink-2); font-size: 13.5px; font-weight: 600; margin-bottom: 2px; }

/* =========================================================
   记账编辑面板
   ========================================================= */
.sheet {
  position: fixed; inset: 0; z-index: 40;
  background:
    radial-gradient(64% 42% at 82% -4%, var(--mist-1), transparent 70%),
    radial-gradient(52% 40% at -2% 82%, var(--mist-2), transparent 72%),
    radial-gradient(60% 36% at 50% 104%, var(--mist-3), transparent 74%),
    var(--bg);
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.3s var(--ease);
  visibility: hidden;
}
.sheet.is-open { transform: none; visibility: visible; }
.sheet-hdr {
  flex: 0 0 auto;
  height: calc(52px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top);
  padding-inline: 14px;
  display: flex; align-items: center; gap: 6px;
  border-bottom: 1px solid var(--line);
}
.sheet-hdr h2 { font-size: 16px; margin: 0; font-weight: 650; }
.sheet-body {
  flex: 1; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 4px 20px calc(28px + env(safe-area-inset-bottom));
  max-width: 560px; width: 100%; margin: 0 auto;
}

/* ---- 账单弹层：半屏，压在 sheet 之上 ---- */
.pop-mask {
  position: fixed; inset: 0; z-index: 56;
  background: rgba(24, 22, 17, 0.44);
  opacity: 0; pointer-events: none;
  transition: opacity 0.24s var(--ease);
}
.pop-mask.is-open { opacity: 1; pointer-events: auto; }
.pop {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 57;
  max-height: 74vh;
  display: flex; flex-direction: column;
  border-radius: 22px 22px 0 0;
  border-top: 1px solid var(--glass-brd);
  background: var(--surface);
  box-shadow: 0 -12px 44px -20px rgba(0, 0, 0, 0.34);
  transform: translateY(100%);
  visibility: hidden;
  transition: transform 0.3s var(--ease), visibility 0.3s;
  padding-bottom: env(safe-area-inset-bottom);
}
.pop.is-open { transform: none; visibility: visible; }
/* 深色下弹层要比页面底再亮一档，否则只有遮罩在撑层次 */
[data-theme="dark"] .pop {
  background: color-mix(in srgb, var(--surface) 88%, #fff 12%);
  box-shadow: 0 -14px 48px -16px rgba(0, 0, 0, 0.82);
}
.pop-grip {
  width: 34px; height: 4px; border-radius: 2px;
  background: var(--line-2);
  margin: 8px auto 0; flex: 0 0 auto;
}
.pop-hdr {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px 0 18px;
}
.pop-hdr h2 {
  margin: 0; flex: 1; min-width: 0;
  font-size: 15px; font-weight: 650;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pop-hdr .icon-btn { flex: 0 0 auto; }
.pop-sub {
  flex: 0 0 auto;
  padding: 3px 18px 9px;
  font-size: 11.5px; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  border-bottom: 1px solid var(--line);
}
.pop-sub:empty { display: none; }
.pop-sub b { font-weight: 620; color: var(--ink-2); }
.pop-body {
  flex: 1; min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 16px 18px;
  overscroll-behavior: contain;
}
.pop-body .bk-items { background: var(--surface-2, var(--surface)); }
[data-theme="dark"] .pop-body .bk-items { background: rgba(255, 255, 255, 0.035); }
/* 弹层里只读：去掉按下的涟漪，避免误以为还能点开 */
.pop-body .bk-item { min-height: 50px; }
.pop-body .bk-item:active { background: transparent; }

/* 编辑页顶栏：收支切换在中间，左右各一个动作 */
.ed-hdr { padding-inline: 8px; }
.ed-dir { flex: 1; display: flex; justify-content: center; gap: 2px; }
.ed-dir button {
  height: 34px; padding: 0 15px;
  border: 0; border-radius: 10px;
  background: transparent; color: var(--ink-3);
  font-size: 15px; font-weight: 600;
  position: relative;
  transition: color var(--dur) var(--ease);
}
.ed-dir button.is-on { color: var(--ink); font-weight: 700; }
.ed-dir button.is-on::after {
  content: "";
  position: absolute; left: 50%; bottom: -3px;
  width: 20px; height: 2.5px; border-radius: 2px;
  background: var(--brand);
  transform: translateX(-50%);
}
.ed-act {
  height: 34px; padding: 0 10px;
  border: 0; border-radius: 10px;
  background: transparent; color: var(--ink-2);
  font-size: 13px; font-weight: 600;
}
.ed-act:active { background: var(--hover-2); }

.ed-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

/* ---- 分类网格 ---- */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px 6px;
  padding: 14px 16px 2px;
}
.cat-cell {
  border: 0; background: transparent;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 3px 0;
}
.cat-face {
  width: 46px; height: 46px;
  border-radius: 15px;
  display: grid; place-items: center;
  font-size: 15px; font-weight: 650;
  font-style: normal;
  /* 图标统一品牌色：分类色只在统计图里用来区分数据 */
  color: var(--brand);
  background: var(--brand-soft);
  border: 1px solid transparent;
  transition: border-color 0.16s var(--ease), box-shadow 0.16s var(--ease),
              transform 0.16s var(--ease);
}
.cat-cell.is-on .cat-face {
  border-color: var(--brand-line);
  box-shadow: 0 0 0 3px var(--brand-soft), 0 7px 15px -9px var(--brand);
  transform: translateY(-1px);
}
.cat-cell > span {
  font-size: 11.5px;
  color: var(--ink-2);
  max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cat-cell.is-on > span { color: var(--ink); font-weight: 650; }
.cat-cell:active .cat-face { transform: scale(0.94); }
.cat-cell.ghost .cat-face {
  background: transparent;
  border: 1.5px dashed var(--line-2);
  color: var(--ink-3);
  font-size: 20px;
  font-weight: 400;
}
.cat-cell.ghost > span { color: var(--ink-3); }

/* ---- 二级分类：横滑一行 ---- */
.subs {
  flex: 0 0 auto;
  display: flex; gap: 6px;
  padding: 10px 16px 2px;
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 16px), transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 16px), transparent 100%);
}
.subs::-webkit-scrollbar { display: none; }
.subs.is-empty { padding-top: 0; height: 0; overflow: hidden; }
.sub {
  flex: 0 0 auto;
  height: 30px; padding: 0 13px;
  border: 1px solid var(--line-2);
  border-radius: 15px;
  background: color-mix(in srgb, var(--surface) 62%, transparent);
  color: var(--ink-2);
  font-size: 12px; font-weight: 550;
  white-space: nowrap;
  transition: transform 0.16s var(--ease), background 0.18s var(--ease),
              color 0.18s var(--ease), border-color 0.18s var(--ease);
}
.sub.is-on {
  background: var(--accent-soft);
  color: #9d6320;
  border-color: color-mix(in srgb, var(--accent) 55%, transparent);
  font-weight: 640;
  box-shadow: 0 3px 10px -6px rgba(196, 133, 63, 0.65), 0 1px 0 rgba(255, 255, 255, 0.5) inset;
}
[data-theme="dark"] .sub.is-on { color: var(--accent); }
.sub:active { transform: scale(0.95); }

/* ---- 金额表壳（机械滚轮） ---- */
.amt-wrap { padding: 12px 16px 0; }
.amt-win {
  width: 100%;
  height: 62px;
  border: 0;
  border-radius: 20px;
  padding: 0 15px 0 13px;
  display: flex; align-items: center;
  gap: 0;
  overflow: hidden;
  position: relative;
  background:
    linear-gradient(180deg, var(--well-top) 0%, var(--well-bot) 46%, var(--well-top) 100%);
  box-shadow:
    inset 0 1.5px 0 rgba(48, 42, 32, 0.18),
    inset 0 3px 7px var(--well-in),
    inset 0 18px 22px -14px rgba(48, 42, 32, 0.5),
    inset 0 -1.5px 0 var(--well-ring),
    inset 0 -8px 12px -10px rgba(255, 255, 255, 0.9),
    0 1px 0 rgba(255, 255, 255, 0.6),
    0 8px 18px -14px rgba(48, 42, 32, 0.5);
  -webkit-appearance: none;
}
[data-theme="dark"] .amt-win {
  background: linear-gradient(180deg, #050706 0%, #131615 46%, #050706 100%);
  box-shadow:
    inset 0 1.5px 0 rgba(0, 0, 0, 0.9),
    inset 0 3px 9px rgba(0, 0, 0, 0.85),
    inset 0 18px 24px -14px rgba(0, 0, 0, 0.9),
    inset 0 -1.5px 0 rgba(255, 255, 255, 0.13),
    inset 0 -8px 12px -10px rgba(255, 255, 255, 0.16),
    0 1px 0 rgba(255, 255, 255, 0.05),
    0 8px 18px -14px rgba(0, 0, 0, 0.9);
}
.amt-win.is-shake { animation: shake 0.34s var(--ease); }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  22% { transform: translateX(-6px); }
  62% { transform: translateX(5px); }
}
.amt-cur {
  font-size: 18px; font-weight: 500;
  color: var(--ink-3);
  margin-right: 6px;
  flex: 0 0 auto;
  line-height: 1;
}
.amt-cta {
  position: absolute; right: 15px; top: 50%;
  transform: translateY(-50%);
  font-size: 11.5px; font-weight: 550;
  color: var(--ink-3);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.24s var(--ease);
}
.amt-win.is-empty .amt-cta { opacity: 1; }

/* ---- 滚轮 ---- */
.wheels { display: flex; align-items: center; min-width: 0; flex: 0 0 auto; }
.wheel {
  width: calc(var(--wh, 50px) * 0.52);
  height: var(--wh, 50px);
  overflow: hidden;
  flex: 0 0 auto;
  position: relative;
  transition: width 0.18s var(--ease), opacity 0.18s var(--ease);
}
/* 增位：从 0 宽展开；减位：直接收窄消失，不再先滚到 0 */
.wheel.is-new { width: 0; opacity: 0; }
.wheel.is-gone { width: 0; opacity: 0; }
.wstrip {
  display: block;
  will-change: transform;
  transform: translate3d(0, calc(var(--y, 10) * -1 * var(--wh, 50px)), 0);
  transition: transform var(--t, 0.3s) var(--d, 0s) var(--ease-wheel);
}
.wstrip i {
  height: var(--wh, 50px);
  display: grid; place-items: center;
  font-size: 42px; font-weight: 650;
  line-height: 1;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  font-style: normal;
  color: var(--ink);
  transition: color 0.3s var(--ease);
}
.wheels.dec .wheel { width: calc(var(--wh, 50px) * 0.42); }
.wheels.dec .wstrip i { font-size: 26px; font-weight: 600; color: var(--ink-2); }
.wheels.dec { margin-left: 2px; }
.w-dot {
  flex: 0 0 auto;
  width: 8px;
  text-align: center;
  font-size: 26px; font-weight: 700;
  color: var(--ink-2);
  line-height: 1;
  transform: translateY(1px);
}
.amt-win.is-empty .wstrip i { color: var(--ink-3); font-weight: 520; }
.amt-win.is-empty .w-dot { color: var(--ink-3); opacity: 0.65; }

/* ---- 备注 + 日期 ---- */
.ed-note { display: flex; align-items: center; gap: 10px; padding: 10px 16px 0; }
.ed-note input {
  flex: 1; min-width: 0; height: 40px;
  border: 0;
  border-bottom: 1px solid var(--line-2);
  background: transparent;
  padding: 0;
  font-size: 13.5px; color: var(--ink);
  transition: border-color var(--dur) var(--ease);
}
.ed-note input::placeholder { color: var(--ink-3); }
.ed-note input:focus { outline: none; border-bottom-color: var(--brand); }
.ed-total {
  flex: 0 0 auto;
  font-size: 19px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.ed-total.in { color: var(--brand); }

.ed-tools {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px 12px;
  flex-wrap: wrap;
}
.ed-date {
  position: relative;
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 12px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  font-size: 12.5px; font-weight: 550;
  cursor: pointer;
  transition: border-color 0.16s var(--ease), background 0.16s var(--ease);
}
.ed-date:active { background: var(--hover-2); }
.ed-date svg { width: 13px; height: 13px; opacity: 0.65; }

/* ---- 选日期：自研面板，不依赖系统 picker ---- */
.date-mask {
  position: fixed; inset: 0; z-index: 54;
  background: rgba(24, 22, 17, 0.42);
  opacity: 0; pointer-events: none;
  transition: opacity 0.22s var(--ease);
}
.date-mask.is-open { opacity: 1; pointer-events: auto; }
.date-pop {
  position: fixed;
  left: 50%; bottom: 0;
  transform: translate(-50%, 100%);
  width: min(100vw, 560px);
  z-index: 55;
  padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
  border-radius: 22px 22px 0 0;
  background: var(--surface);
  box-shadow: 0 -12px 40px -16px rgba(30, 26, 18, 0.42);
  visibility: hidden;
  transition: transform 0.26s var(--ease), visibility 0.26s;
}
.date-pop.is-open { transform: translate(-50%, 0); visibility: visible; }
.dp-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.dp-head #dp-title {
  border: 0; background: transparent; color: var(--ink);
  font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums;
  padding: 4px 6px; border-radius: 7px;
  display: inline-flex; align-items: center; gap: 3px;
}
.dp-head #dp-title::after {
  content: ""; width: 0; height: 0;
  border-left: 3.5px solid transparent; border-right: 3.5px solid transparent;
  border-top: 4px solid var(--ink-3);
  margin-top: 1px;
}
.dp-head #dp-title:active { background: var(--hover); }
.dp-nav {
  width: 32px; height: 32px;
  border: 0; border-radius: 50%;
  background: var(--hover-2);
  color: var(--ink-2);
  font-size: 16px; line-height: 1;
  display: grid; place-items: center;
}
.dp-nav:active { transform: scale(0.92); }
.dp-nav:disabled { opacity: 0.3; }
/* 年月快选：翻到 1990 年不用点 400 下 */
.dp-quick {
  margin: 2px 0 6px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
  max-height: 206px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.dp-quick[hidden] { display: none; }
.dq-head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; color: var(--ink-3); padding: 0 2px 6px;
}
.dq-head button { border: 0; background: transparent; color: var(--ink-2); font-size: 11px; font-weight: 650; padding: 2px 4px; }
.dq-head button:active { color: var(--ink); }
.dq-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.dq-grid.m3 { grid-template-columns: repeat(3, 1fr); }
.dq-cell {
  height: 33px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--ink-2);
  font-size: 12.5px; font-weight: 620; font-variant-numeric: tabular-nums;
  transition: background var(--dur) var(--ease);
}
.dq-cell.is-on { background: var(--brand); border-color: var(--brand); color: #fff; }
.dq-cell:active { background: var(--hover-2); }
.dq-cell:disabled { color: var(--line-2); }
/* 小屏上少占点高度，日历别被挤没了 */
@media (max-height: 620px) { .dp-quick { max-height: 152px; } }

.dp-week {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 2px; margin-bottom: 3px;
}
.dp-week span {
  text-align: center; font-size: 10.5px; font-weight: 600;
  color: var(--ink-3); padding-bottom: 3px;
}
.dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.dp-cell {
  height: 36px;
  border: 0; border-radius: 10px;
  background: transparent;
  color: var(--ink);
  font-size: 13.5px; font-weight: 550;
  font-variant-numeric: tabular-nums;
  display: grid; place-items: center;
}
.dp-cell.is-blank { visibility: hidden; }
.dp-cell:disabled { color: var(--line-2); font-weight: 400; }
.dp-cell.is-today { box-shadow: inset 0 0 0 1px var(--brand-line); color: var(--brand); font-weight: 650; }
.dp-cell.is-on { background: var(--brand); color: #fff; font-weight: 650; box-shadow: none; }
.dp-foot { display: flex; gap: 8px; margin-top: 12px; }
.dp-foot button {
  flex: 1; height: 36px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  font-size: 12.5px; font-weight: 600;
}
.dp-foot button:active { background: var(--hover-2); }
.chip-toggle {
  flex: 0 0 auto;
  height: 32px; padding: 0 11px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  color: var(--ink-3);
  font-size: 11.5px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all var(--dur) var(--ease);
}
.chip-toggle .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ink-3); opacity: 0.4;
  transition: all var(--dur) var(--ease);
}
.chip-toggle[aria-pressed="true"] {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}
.chip-toggle[aria-pressed="true"] .dot { background: var(--accent); opacity: 1; }
.chip-toggle:active { transform: scale(0.96); }

/* ---- 数字键盘（4 列，右侧功能列） ---- */
.ed-pad {
  --ph: 52px;
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, var(--ph));
  grid-template-areas:
    "n1 n2 n3 del"
    "n4 n5 n6 del"
    "n7 n8 n9 ok"
    "dt n0 ag ok";
  gap: 7px;
  padding: 8px 12px calc(12px + env(safe-area-inset-bottom));
  background: var(--glass-2);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  border-top: 1px solid var(--glass-brd);
}
.pk {
  border: 1px solid var(--glass-brd);
  border-radius: 13px;
  background: color-mix(in srgb, var(--surface) 80%, transparent);
  color: var(--ink);
  font-size: 21px; font-weight: 500;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 1px 0 var(--glass-hi) inset, 0 2px 5px -3px rgba(32, 29, 24, 0.24);
  display: grid; place-items: center;
  -webkit-appearance: none;
  transition: transform 0.09s var(--ease), background 0.09s var(--ease);
}
.pk:active { transform: scale(0.955); background: var(--hover-2); }
.pk.del { grid-area: del; font-size: 14px; color: var(--ink-2); }
.pk.ok {
  grid-area: ok;
  border: 0;
  background: var(--brand);
  color: var(--btn-fg);
  font-size: 15px; font-weight: 650;
}
.pk.a-g {
  grid-area: ag;
  font-size: 13px; font-weight: 600;
  color: var(--ink-2);
}
@media (max-height: 720px) {
  .ed-pad { --ph: 40px; }
  .cat-grid { gap: 6px 6px; padding: 8px 16px 0; }
  .cat-face { width: 38px; height: 38px; border-radius: 12px; font-size: 13.5px; }
  .cat-cell { gap: 4px; padding: 2px 0; }
  .cat-cell > span { font-size: 10.5px; }
  .subs { padding: 6px 16px 0; }
  .sub { height: 28px; font-size: 11.5px; }
  .amt-wrap { padding: 8px 16px 0; }
  .amt-win { height: 54px; }
  .amt-win .wheels { --wh: 38px; }
  .amt-win .wstrip i { font-size: 30px; }
  .amt-win .wheels.dec .wstrip i { font-size: 20px; }
  .ed-note { padding: 6px 16px 0; }
  .ed-note input { height: 36px; }
  .ed-tools { padding: 6px 16px 8px; }
}

/* =========================================================
   统计
   ========================================================= */
.stat {
  padding: 2px 18px 22px;
}
/* 统计区标题行 */
.stat-head {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 10px 13px;
  margin: 0 -8px;
}

.stat-head b { font-size: 15px; font-weight: 680; letter-spacing: -0.01em; }
.stat-head em { font-style: normal; font-size: 11px; color: var(--ink-3); }
.stat-head .st-tabs {
  margin: 0 0 0 auto;
  padding: 2px;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 9px;
  gap: 2px;
  flex: 0 0 auto;
}
.stat-head .st-tabs button {
  height: 24px; padding: 0 9px;
  font-size: 11px; border-radius: 7px;
}
.stat-head .st-tabs button.is-on {
  background: var(--surface);
  box-shadow: var(--shadow-1);
}

.st-tabs {
  display: flex; gap: 3px; padding: 3px;
  background: var(--ghost-bg);
  border-radius: 12px;
}
.st-tabs button {
  flex: 1; height: 32px;
  border: 0; border-radius: 9px;
  background: transparent; color: var(--ink-3);
  font-size: 13px; font-weight: 600;
  transition: all var(--dur) var(--ease);
}
.st-tabs button.is-on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.st-period {
  display: flex; align-items: center; justify-content: center; gap: 16px;
  margin: 12px 0 12px;
}
.st-period b {
  font-size: 14.5px; font-weight: 680;
  font-variant-numeric: tabular-nums;
  min-width: 96px; text-align: center;
}
.st-period button {
  width: 30px; height: 30px;
  border: 0; border-radius: 50%;
  background: var(--ghost-bg); color: var(--ink-2);
  display: grid; place-items: center;
}
.st-period button:active { background: var(--hover-2); }
.st-period button[disabled] { opacity: 0.3; }

.st-hero {
  display: flex; gap: 4px;
  border-radius: 18px;
  padding: 14px 15px;
  margin-bottom: 12px;
  border: 1px solid var(--glass-brd);
  background: color-mix(in srgb, var(--surface) 76%, transparent);
  box-shadow: var(--shadow-1);
}
.st-hero .c { flex: 1 1 0; min-width: 0; text-align: center; }
.st-hero em {
  font-style: normal; display: block;
  font-size: 10.5px; color: var(--ink-3);
}
.st-hero b {
  display: block; margin-top: 3px;
  font-size: clamp(12.5px, 3.7vw, 16.5px);
  font-weight: 680;
  letter-spacing: -0.025em;
  font-variant-numeric: tabular-nums;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.st-hero b.in { color: var(--brand); }
.st-hero b.out { color: var(--danger); }
.st-hero b.bal { color: var(--accent); }
.st-hero b.neg { color: var(--danger); }

.st-card {
  background: color-mix(in srgb, var(--surface) 78%, transparent);
  border: 1px solid var(--glass-brd);
  border-radius: var(--r-lg);
  padding: 13px 14px 12px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-1);
}
.st-card h3 {
  margin: 0 0 11px;
  font-size: 12.5px; font-weight: 650; color: var(--ink-2);
  display: flex; justify-content: space-between; align-items: baseline;
}
.st-card h3 em { font-style: normal; font-size: 10.5px; color: var(--ink-3); font-weight: 500; }
.st-card h3 .lg-wrap { display: inline-flex; align-items: center; gap: 9px; }
.st-card h3 .lg { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 500; }
.st-card h3 .lg i {
  width: 7px; height: 7px; border-radius: 2px; display: inline-block;
}
.st-mini {
  display: inline-flex; gap: 2px; padding: 2px;
  background: var(--ghost-bg); border-radius: 8px;
}
.st-mini button {
  border: 0; background: transparent;
  color: var(--ink-3);
  font-size: 10.5px; font-weight: 600;
  padding: 3px 9px;
  border-radius: 6px;
}
.st-mini button.is-on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

/* 柱状图 */
.bars {
  display: flex; align-items: flex-end;
  height: 116px;
  gap: 0;
}
.bar-col {
  flex: 1 1 0; min-width: 0;
  height: 100%;
  display: flex; align-items: flex-end; justify-content: center;
  gap: 2px;
  position: relative;
}
.bar-col.is-now .bar { opacity: 1; }
.bar {
  width: 44%;
  max-width: 10px;
  min-width: 3px;
  border-radius: 3px 3px 0 0;
  min-height: 2px;
  opacity: 0.82;
  transition: height 0.34s var(--ease);
}
.bar.in { background: var(--brand); }
.bar.out { background: var(--danger); }
.bar-x { display: flex; margin-top: 6px; }
.bar-x span {
  flex: 1 1 0; min-width: 0;
  text-align: center;
  font-size: 9px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  overflow: hidden;
}
.bar-x span.is-now { color: var(--ink); font-weight: 700; }

/* 占比环 */
.donut-box { position: relative; width: 106px; height: 106px; flex: 0 0 auto; }
.donut {
  width: 100%; height: 100%;
  border-radius: 50%;
  -webkit-mask: radial-gradient(circle at center, transparent 55.5%, #000 56.5%);
  mask: radial-gradient(circle at center, transparent 55.5%, #000 56.5%);
}
.donut-mid {
  position: absolute; inset: 0;
  display: grid; place-content: center;
  text-align: center;
  pointer-events: none;
}
.donut-mid b {
  font-size: 11.5px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
}
.donut-mid span { font-size: 9px; color: var(--ink-3); margin-top: 1px; }

.share-wrap { display: flex; align-items: center; gap: 14px; }
.share-legend { flex: 1; min-width: 0; }
.sl-row {
  display: flex; align-items: center; gap: 6px;
  font-size: 11.5px;
  padding: 3px 0;
}
.sl-row i { width: 7px; height: 7px; border-radius: 2px; flex: 0 0 auto; }
.sl-row span { flex: 1; min-width: 0; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sl-row b { font-weight: 600; font-variant-numeric: tabular-nums; }

.rank-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  font-size: 12.5px;
}
.rank-row:last-child { border-bottom: 0; }
.rank-row.is-click { cursor: pointer; border-radius: 8px; transition: background 0.14s var(--ease); }
.rank-row.is-click:active { background: var(--hover-2); }
.rank-go { flex: 0 0 auto; color: var(--ink-3); font-size: 11px; opacity: 0.7; }

/* ---- 分类下钻 ---- */
.cs-hero {
  display: flex; gap: 4px;
  border-radius: 18px;
  padding: 14px 15px;
  margin-bottom: 12px;
  border: 1px solid var(--glass-brd);
  background: color-mix(in srgb, var(--surface) 76%, transparent);
  box-shadow: var(--shadow-1);
}
.cs-hero .c { flex: 1 1 0; min-width: 0; text-align: center; }
.cs-hero em { font-style: normal; display: block; font-size: 10.5px; color: var(--ink-3); }
.cs-hero b {
  display: block; margin-top: 3px;
  font-size: 16px; font-weight: 660;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.cs-list { padding: 2px 0; }
.cs-row { padding: 9px 0; border-bottom: 1px solid var(--line); }
.cs-row:last-child { border-bottom: 0; }
.cs-row.is-click {
  cursor: pointer;
  margin: 0 -9px; padding: 9px 9px;
  border-radius: 11px;
  transition: background var(--dur) var(--ease);
}
.cs-row.is-click:active { background: var(--hover); }
.cs-go {
  font-style: normal;
  margin-left: 5px;
  font-size: 13px;
  color: var(--ink-3);
}
.cs-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.cs-name {
  font-size: 12.5px; color: var(--ink); font-weight: 560;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cs-amt { flex: 0 0 auto; font-size: 13px; font-weight: 640; font-variant-numeric: tabular-nums; }
.cs-meta {
  display: flex; align-items: center; gap: 7px;
  margin-top: 2px; font-size: 10.5px; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.cs-chg.up { color: var(--danger); }
.cs-chg.down { color: var(--brand); }
.cs-bar {
  display: block; height: 3px; border-radius: 2px;
  background: var(--line); margin-top: 6px; overflow: hidden;
}
.cs-bar i { display: block; height: 100%; border-radius: 2px; }
.cs-empty { padding: 22px 0; text-align: center; font-size: 12px; color: var(--ink-3); }
.cs-compare {
  margin: -6px 2px 12px;
  font-size: 11px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.cs-compare .up { color: var(--danger); font-weight: 620; }
.cs-compare .down { color: var(--brand); font-weight: 620; }
.rank-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.rank-name { flex: 1; min-width: 0; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-bar {
  width: 54px; height: 4px; border-radius: 2px;
  background: var(--line-2);
  flex: 0 0 auto;
  overflow: hidden;
}
.rank-bar i { display: block; height: 100%; border-radius: 2px; }
.rank-pct {
  width: 40px; text-align: right;
  font-size: 11px; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  flex: 0 0 auto;
}
.rank-amt {
  width: 78px; text-align: right;
  font-weight: 620;
  font-variant-numeric: tabular-nums;
  flex: 0 0 auto;
}

/* 月报表 */
.rep { width: 100%; border-collapse: collapse; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.rep th {
  font-weight: 600; color: var(--ink-3);
  text-align: right; padding: 6px 4px;
  font-size: 10.5px;
  border-bottom: 1px solid var(--line-2);
}
.rep th:first-child, .rep td:first-child { text-align: left; }
.rep td {
  padding: 7px 4px; text-align: right;
  border-bottom: 1px solid var(--line);
  color: var(--ink-2);
  white-space: nowrap;
}
.rep tr:last-child td { border-bottom: 0; }
.rep td.neg { color: var(--danger); }
.rep td.link { cursor: pointer; transition: color var(--dur) var(--ease); }
.rep td.link:active { color: var(--brand); }
.rep-go {
  font-style: normal;
  margin-left: 3px;
  font-size: 10px;
  color: var(--ink-3);
}
.rep tr.is-now td { color: var(--ink); font-weight: 600; }

/* =========================================================
   轨迹
   ========================================================= */
.track-bar {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: flex-end;
  gap: 8px;
  padding: 6px 20px 2px;
}
.tr-add {
  border: 1px solid var(--line-2); border-radius: 8px;
  background: transparent; color: var(--ink-2);
  font-size: 12px; font-weight: 620;
  padding: 4px 10px; line-height: 16px;
}
.tr-add:active { background: var(--hover); }

.track {
  flex: 1; min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 8px 20px 20px;
}
.day { position: relative; padding-left: 20px; padding-bottom: 14px; }
.day::before {
  content: "";
  position: absolute; left: 4px; top: 9px; bottom: -4px;
  width: 1px; background: var(--line-2);
}
.day:last-child::before { display: none; }
.day-dot {
  position: absolute; left: 0; top: 4px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--line-2);
}
.day.has-mile .day-dot { border-color: var(--accent); background: var(--accent); }
.day-label {
  display: flex; align-items: baseline; gap: 7px;
  font-size: 11.5px; color: var(--ink-3);
  margin-bottom: 6px;
  font-variant-numeric: tabular-nums;
}
.day-label b { color: var(--ink-2); font-weight: 600; font-size: 12.5px; }
.mile {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 10px 12px;
  margin-bottom: 6px;
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--ink);
  box-shadow: var(--shadow-1);
  white-space: pre-wrap;
  word-break: break-word;
}
.mile.is-live { border-left: 2px solid var(--accent); padding-left: 11px; }
.mile-span {
  display: block;
  margin-bottom: 3px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.01em;
  font-variant-numeric: tabular-nums;
}
.mile-tx {
  display: flex; align-items: center; gap: 8px;
  font-size: 12.5px;
  color: var(--ink-2);
  padding: 8px 12px 8px 11px;
  border-left: 2px solid var(--accent);
  border-radius: 4px var(--r-md) var(--r-md) 4px;
  box-shadow: none;
}
.mile-tx .mt-amt {
  margin-left: auto;
  font-weight: 620;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.spend {
  padding: 5px 0 1px;
  font-size: 12px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.01em;
}
/* 空间：按地点把大事收拢 */
.sp { padding: 10px 0 8px; border-bottom: 1px solid var(--line); }
.sp:last-child { border-bottom: 0; }
.sp-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.sp-h b { font-size: 14.5px; font-weight: 650; }
.sp-h span { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sp-row { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; }
.sp-row time { flex: 0 0 auto; font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sp-row span { font-size: 13px; line-height: 1.5; color: var(--ink-2); word-break: break-word; }
.sp-miss { font-size: 11.5px; color: var(--ink-3); padding: 14px 0 4px; }
.sp.is-hit { background: var(--brand-soft); border-radius: 8px; }
/* 手绘地图 */
.map-box {
  flex: 0 0 auto;
  position: relative;
  margin: 2px 16px 6px;
  aspect-ratio: 1268 / 883;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  overflow: hidden;
}
.map-box svg { width: 100%; height: 100%; display: block; touch-action: pan-y; }
.map-box.is-zoom svg { touch-action: none; }
.map-zoom {
  position: absolute; right: 7px; top: 7px;
  display: flex; flex-direction: column; gap: 4px;
}
.map-zoom button {
  width: 24px; height: 24px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  color: var(--ink-2);
  font-size: 14px; line-height: 1;
  display: grid; place-items: center;
  backdrop-filter: blur(4px);
  transition: opacity var(--dur) var(--ease);
}
.map-zoom button:active { background: var(--hover-2); }
.map-zoom button:disabled { opacity: 0.32; }
.mp-p {
  fill: color-mix(in srgb, var(--ink-3) 7%, transparent);
  stroke: color-mix(in srgb, var(--ink-3) 62%, transparent);
  stroke-width: 1.1; stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}
.mp-muni path {
  fill: none; stroke: var(--line-2); stroke-width: 0.85;
  vector-effect: non-scaling-stroke; opacity: 0.62;
}
.mp-cnty path {
  fill: none; stroke: var(--line-2); stroke-width: 0.75;
  vector-effect: non-scaling-stroke; opacity: 0.75;
}
.mp-cnty path.on {
  fill: color-mix(in srgb, var(--brand) 13%, transparent);
  stroke: var(--brand-line); stroke-width: 1.1;
}
.mp-ml {
  fill: color-mix(in srgb, var(--ink-3) 92%, transparent);
  paint-order: stroke; stroke: var(--surface); stroke-width: 2px; stroke-linejoin: round;
}
.mp-cl {
  fill: color-mix(in srgb, var(--ink-2) 78%, transparent);
  paint-order: stroke; stroke: var(--surface); stroke-width: 2px; stroke-linejoin: round;
}
.mp-inset rect { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.6; }
.mp-inset { transition: opacity 200ms var(--ease); }
.mp-inset .mp-dots circle { fill: var(--ink-3); opacity: 0.85; }
.mp-inset .mp-line {
  fill: none; stroke: var(--ink-3); stroke-width: 1.2;
  stroke-dasharray: 7 5; opacity: 0.75; stroke-linecap: round;
}
.mp-p.on {
  fill: color-mix(in srgb, var(--brand) 19%, transparent);
  stroke: var(--brand); stroke-width: 1.5;
}
.mp-halo { fill: var(--accent); opacity: 0.16; }
.mp-dot { fill: var(--accent); opacity: 0.9; }
.mp-lab {
  fill: var(--ink-2);
  paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round;
}
.mp-spot:active .mp-dot { opacity: 1; }
.mile-hit:active { opacity: 0.6; }

/* =========================================================
   目标 / 计划（清单行共用）
   ========================================================= */
.pl-sec { margin-top: 14px; margin-bottom: 18px; }
.memo .pl-sec:first-child { margin-top: 0; }
.pl-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
  transition: opacity var(--dur) var(--ease);
}
.pl-item:last-child { border-bottom: 0; }
.pl-box {
  width: 19px; height: 19px; flex: 0 0 auto;
  border: 1.5px solid var(--line-2);
  border-radius: 6px;
  display: grid; place-items: center;
  transition: all var(--dur) var(--ease);
}
.pl-box svg { width: 11px; height: 11px; opacity: 0; transform: scale(0.6); transition: all var(--dur) var(--ease); }
.pl-item.done .pl-box { background: var(--brand); border-color: var(--brand); }
.pl-item.done .pl-box svg { opacity: 1; transform: none; }
.pl-text { flex: 1; min-width: 0; font-size: 14px; line-height: 1.45; word-break: break-word; }
.pl-item.done .pl-text { color: var(--ink-3); }
.pl-item.done .pl-t { text-decoration: line-through; text-decoration-thickness: 1px; }
.pl-item.stretch .pl-box { border-radius: 50%; }
.pl-item.stretch.done .pl-box { background: var(--accent); border-color: var(--accent); }
.pl-empty { font-size: 12px; color: var(--ink-3); padding: 8px 0 2px; }
.pl-tag {
  display: block;
  font-style: normal;
  font-size: 10.5px; line-height: 1.5;
  color: var(--ink-3);
  margin-top: 1px;
  font-variant-numeric: tabular-nums;
}
.pl-item.done .pl-tag { text-decoration: none; opacity: 0.75; }
.pl-more {
  flex: 0 0 auto;
  width: 26px; height: 26px;
  border: 0; border-radius: 7px;
  background: transparent; color: var(--ink-3);
  font-size: 15px; line-height: 1;
  display: grid; place-items: center;
}
.pl-more:active { background: var(--hover-2); color: var(--ink-2); }
/* 计划弹层里的目标选择 */
.me-goal-btn {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; text-align: left; cursor: pointer;
  height: 40px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: var(--r-md);
  background: var(--surface); color: var(--ink);
  font-size: 13.5px;
}
.me-goal-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-goal-btn i { font-style: normal; color: var(--ink-3); font-size: 15px; line-height: 1; }
.me-goal-btn:active { background: var(--hover-2); }
.me-goal-list {
  margin-top: 8px; padding: 4px;
  max-height: 168px; overflow-y: auto;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  border: 1px solid var(--line); border-radius: var(--r-md);
  background: var(--ghost-bg);
}
.me-goal-list button {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 8px; width: 100%;
  padding: 9px 10px;
  border: 0; border-radius: 8px; background: transparent;
  text-align: left; font-size: 13px; color: var(--ink-2);
}
.me-goal-list button b {
  font-weight: 600; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.me-goal-list button i {
  flex: 0 0 auto; font-style: normal;
  font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums;
}
.me-goal-list button.is-on { background: var(--brand-soft); }
.me-goal-list button.is-on b { color: var(--brand); }
.me-goal-list button:active { background: var(--hover-2); }

.seg-mini {
  display: flex; gap: 2px; padding: 2px; background: var(--ghost-bg); border-radius: 9px;
  margin-right: 2px; flex: 0 0 auto;
}
.seg-mini button {
  width: auto; height: 34px; padding: 0 9px;
  border: 0; border-radius: 7px; background: transparent;
  font-size: 11.5px; font-weight: 600; color: var(--ink-3);
}
.seg-mini button.is-on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

/* ---------- 目标 ---------- */
.goal {
  flex: 1; min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 2px 20px 20px;
}
.goal-top {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
  padding: 6px 20px 8px;
}
.goal-nav { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; margin-left: auto; }
.goal-nav button {
  border: 0; background: transparent; color: var(--ink-3);
  height: 28px; padding: 0 4px;
  font-size: 15px; line-height: 1;
  display: grid; place-items: center;
}
.goal-nav #g-label {
  font-size: 12px; font-weight: 620; color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  padding: 0 2px; min-width: 62px;
}
.goal-nav button:active { color: var(--ink); }
.goal-cards { margin-bottom: 4px; }
.goal-cards + .pl-item { margin-top: 2px; }
.goal-card {
  padding: 13px 14px 12px;
  margin-bottom: 9px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-1);
}
.goal-card:active { background: var(--surface-2); }
.gc-h { display: flex; align-items: baseline; gap: 10px; }
.gc-h b {
  flex: 1; min-width: 0;
  font-size: 14px; font-weight: 620; line-height: 1.4;
  word-break: break-word;
}
.gc-h em {
  flex: 0 0 auto;
  font-size: 15px; font-weight: 660; font-style: normal;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.gc-h em.full { color: var(--brand); font-size: 12.5px; }
/* 进度槽沿用表壳的内阴影，填充用品牌绿 */
.gc-bar {
  position: relative;
  height: 9px; margin: 9px 0 7px;
  border-radius: 5px;
  background: linear-gradient(180deg, var(--well-top), var(--well-bot));
  box-shadow:
    inset 0 1px 0 rgba(48, 42, 32, 0.14),
    inset 0 2px 4px var(--well-in),
    inset 0 -1px 0 var(--well-ring);
  overflow: hidden;
}
.gc-bar i {
  display: block; height: 100%;
  border-radius: 5px;
  background: var(--brand);
  opacity: 0.86;
  transition: width 0.35s var(--ease);
}
.gc-bar i.full { opacity: 1; }
/* 节奏刻度：此刻应在的位置 */
.gc-bar u {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: var(--ink-2);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35);
  transform: translateX(-1px);
}
.gc-f {
  display: flex; align-items: center; gap: 8px;
  font-size: 11.5px; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.gc-f > span { flex: 1; min-width: 0; }
/* 自动取数的来源，挂在当前值后面 */
.gc-src {
  font-style: normal; font-size: 9.5px; font-weight: 620;
  margin-left: 5px; padding: 0 4px;
  border-radius: 3px;
  border: 1px solid var(--line-2);
  color: var(--ink-2);
  vertical-align: 1px;
}
.gc-tag { flex: 0 0 auto; font-style: normal; font-weight: 620; }
.gc-tag.lag { color: var(--danger); }
.gc-tag.ahead { color: var(--brand); }
.gc-tag.ok { color: var(--ink-3); }
.goal-acts {
  flex: 0 0 auto;
  padding: 9px 20px calc(9px + env(safe-area-inset-bottom));
  background: var(--glass-2);
  -webkit-backdrop-filter: var(--glass-blur-lite);
  backdrop-filter: var(--glass-blur-lite);
  border-top: 1px solid var(--glass-brd);
}
.goal-add {
  width: 100%; height: 38px;
  border: 1px dashed var(--line-2); border-radius: var(--r-md);
  background: transparent; color: var(--ink-2);
  font-size: 13px; font-weight: 620;
}
.goal-add:active { background: var(--hover); }
/* 标题里的 @来源 标记，点一下就写进输入框 */
.g-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.g-chip {
  border: 1px solid var(--line-2); border-radius: 6px;
  background: transparent; color: var(--ink-3);
  font-size: 11.5px; font-weight: 620;
  padding: 2px 7px; line-height: 17px;
}
.g-chip.is-on {
  border-color: var(--brand-line);
  background: var(--brand-soft);
  color: var(--brand);
}
.g-chip:active { opacity: 0.6; }
#ge-src-hint { margin-top: 7px; }
.seg-mini.g-pick { margin: 0; }
.g-hide { display: none !important; }
.g-del {
  display: block; width: 100%; margin-top: 14px;
  border: 0; background: transparent;
  color: var(--danger); font-size: 12.5px; font-weight: 620;
  padding: 8px;
}
.g-del:active { opacity: 0.6; }
.g-move {
  display: block; width: 100%; margin-top: 6px;
  border: 0; background: transparent;
  color: var(--ink-2); font-size: 12.5px; font-weight: 620;
  padding: 8px;
}
.g-move:active { opacity: 0.6; }

/* =========================================================
   计划（原备忘录）
   ========================================================= */
.memo {
  flex: 1; min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 2px 20px 16px;
}
/* =========================================================
   随笔
   ========================================================= */
.note-editor { flex: 0 0 auto; padding: 10px 20px 8px; }
#note-text {
  width: 100%;
  min-height: 78px;
  max-height: 150px;
  resize: none;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--surface);
  padding: 12px 14px;
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--ink);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
#note-text::placeholder { color: var(--ink-3); }
#note-text:focus {
  outline: none;
  border-color: var(--brand-line);
  box-shadow: 0 0 0 3px var(--brand-soft);
}
.note-acts {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 8px;
}
.btn-primary {
  height: 34px; padding: 0 18px;
  border: 0; border-radius: 17px;
  background: var(--btn-bg); color: var(--btn-fg);
  font-size: 13px; font-weight: 600;
  transition: transform 0.1s var(--ease), opacity 0.1s var(--ease);
}
.btn-primary:active { transform: scale(0.96); opacity: 0.88; }

.note-feed {
  flex: 1; min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 2px 20px 16px;
}
/* 一天一叠：组头写日期，下面一张张卡片压着 */
.nc-day {
  font-size: 11px; color: var(--ink-3);
  padding: 14px 0 7px;
  font-variant-numeric: tabular-nums;
}
.nc-first, .nc-day:first-child { padding-top: 6px; }
.nc-list { display: flex; flex-direction: column; gap: 9px; }
.nc {
  position: relative; z-index: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 9px 13px 11px;
  box-shadow: var(--shadow-2);
}
/* 卡片下面露出一条边，看起来是一叠压着，而不是一张张散着 */
.nc::after {
  content: "";
  position: absolute; z-index: -1;
  left: 13px; right: 13px; bottom: -4px; height: 12px;
  border-radius: 0 0 14px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 0;
  box-shadow: 0 2px 4px -3px rgba(32, 29, 24, 0.22);
}
.nc-h { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.nc-time {
  font-size: 10.5px; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}
.nc-text {
  margin: 0;
  font-size: 13.8px; line-height: 1.72;
  color: var(--ink);
  white-space: pre-wrap;
  word-break: break-word;
}

/* =========================================================
   底部 tab（玻璃条）
   ========================================================= */
.tabbar {
  flex: 0 0 auto;
  height: calc(54px + env(safe-area-inset-bottom) + var(--browser-pad, 0px));
  padding-bottom: calc(env(safe-area-inset-bottom) + var(--browser-pad, 0px));
  display: flex;
  background: var(--glass);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  border-top: 1px solid var(--glass-brd);
  box-shadow: 0 -1px 0 var(--glass-hi) inset, 0 -12px 26px -20px rgba(48, 42, 32, 0.5);
  position: relative;
  z-index: 12;
}
.tab {
  border: 0; background: transparent;
  flex: 1 1 0; min-width: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-3);
  font-size: 10px; font-weight: 550;
  position: relative;
  transition: color 0.2s var(--ease);
}
.tab svg { width: 20px; height: 20px; stroke-width: 1.7; transition: transform 0.24s var(--ease); }
.tab.is-on { color: var(--ink); }
.tab.is-on svg { stroke-width: 2.1; transform: translateY(-1px); }
.tab:active { opacity: 0.6; }
.tab.is-on::before {
  content: "";
  position: absolute; top: 0; left: 50%;
  width: 26px; height: 2.5px;
  border-radius: 0 0 3px 3px;
  background: var(--accent);
  transform: translateX(-50%);
  opacity: 0.85;
}

/* =========================================================
   我的 / 分类管理
   ========================================================= */
.stat-row {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; margin: 6px 0 20px;
}
.stat-cell {
  background: linear-gradient(180deg, var(--well-top), var(--well-bot));
  border: 1px solid var(--glass-brd);
  border-radius: var(--r-md);
  padding: 10px 4px 9px;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  box-shadow:
    inset 0 1.5px 0 rgba(48, 42, 32, 0.14),
    inset 0 3px 6px var(--well-in),
    inset 0 -1.5px 0 var(--well-ring),
    0 1px 0 rgba(255, 255, 255, 0.5);
}
[data-theme="dark"] .rate-well,
[data-theme="dark"] .stat-cell {
  background: linear-gradient(180deg, #050706, #131615);
  box-shadow:
    inset 0 1.5px 0 rgba(0, 0, 0, 0.9),
    inset 0 3px 7px rgba(0, 0, 0, 0.8),
    inset 0 -1.5px 0 rgba(255, 255, 255, 0.12),
    0 1px 0 rgba(255, 255, 255, 0.04);
}
.stat-cell .wheels { --wh: 28px; }
.stat-cell .wheel { width: calc(var(--wh, 28px) * 0.54); }
.stat-cell .wstrip i { font-size: 22px; font-weight: 640; }
.stat-cell span { font-size: 10.5px; color: var(--ink-3); }
.me-sec { margin-bottom: 20px; }
.me-sec h3 {
  font-size: 11px; color: var(--ink-3);
  letter-spacing: 0.05em; font-weight: 650;
  margin: 0 0 6px;
}
.row-btn {
  width: 100%;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0;
  border: 0; border-bottom: 1px solid var(--line);
  background: transparent;
  font-size: 14px; color: var(--ink);
  text-align: left;
}
.row-btn:last-child { border-bottom: 0; }
.row-btn .hint { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.row-btn .hint.warn { color: var(--accent); font-weight: 600; }
.row-btn.danger { color: var(--danger); }
.row-btn:active { opacity: 0.55; }
.row-btn.row-static { cursor: default; }
.row-btn.row-static:active { opacity: 1; }

.theme-row { display: flex; gap: 6px; padding: 6px 0 10px; }
.theme-opt {
  flex: 1; height: 38px;
  border: 1px solid var(--line); border-radius: var(--r-md);
  background: transparent; color: var(--ink-3);
  font-size: 12.5px; font-weight: 600;
  transition: all var(--dur) var(--ease);
}
.theme-opt.is-on { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }

.me-note {
  font-size: 11.5px; color: var(--ink-3);
  line-height: 1.75;
  padding: 10px 0 0;
}
.me-ver { font-size: 11px; color: var(--ink-3); text-align: center; padding: 18px 0 0; }

/* ---- 分类管理 ---- */
.mgr-seg { display: flex; gap: 3px; padding: 3px; background: var(--ghost-bg); border-radius: 12px; margin: 10px 0 4px; }
.mgr-seg button {
  flex: 1; height: 32px; border: 0; border-radius: 9px;
  background: transparent; color: var(--ink-3);
  font-size: 13px; font-weight: 600;
}
.mgr-seg button.is-on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.mgr-row {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.mgr-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
.mgr-main { flex: 1; min-width: 0; }
.mgr-main b { font-size: 14px; font-weight: 550; }
.mgr-subs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.mgr-subs span {
  font-size: 10.5px; color: var(--ink-3);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 1px 5px;
}
.mgr-act {
  width: 32px; height: 32px;
  border: 0; border-radius: 50%;
  background: transparent; color: var(--ink-3);
  display: grid; place-items: center;
  font-size: 14px;
  flex: 0 0 auto;
}
.mgr-act:active { background: var(--hover-2); }
.mgr-act.del { color: var(--danger); font-size: 15px; }
.mgr-add {
  width: 100%; height: 44px; margin-top: 14px;
  border: 1px dashed var(--line-2); border-radius: 13px;
  background: transparent;
  color: var(--ink-2);
  font-size: 13px; font-weight: 600;
}
.mgr-add:active { background: var(--hover); }

/* =========================================================
   Modal
   ========================================================= */
.modal {
  position: fixed; inset: 0; z-index: 50;
  display: grid;
  overflow-y: auto;
  padding: 18px;
  background: rgba(20, 18, 14, 0.34);
  opacity: 0; visibility: hidden;
  transition: opacity 0.2s var(--ease), visibility 0.2s var(--ease);
}
.modal.is-open { opacity: 1; visibility: visible; }
.modal-card {
  width: 100%; max-width: 340px;
  margin: auto;
  max-height: calc(var(--vh, 100dvh) - 36px);
  display: flex; flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--glass-brd);
  border-radius: 20px;
  padding: 18px 18px 14px;
  box-shadow: var(--shadow-3);
  transform: translateY(8px) scale(0.98);
  transition: transform 0.22s var(--ease);
  max-height: 82vh;
  overflow-y: auto;
}
.modal.is-open .modal-card { transform: none; }
.modal-card h3 { margin: 0 0 12px; font-size: 15px; font-weight: 660; flex: 0 0 auto; }
/* 字段多时只滚中间那段，按钮永远在卡片底部 */
#m-body { overflow-y: auto; min-height: 0; overscroll-behavior: contain; padding-bottom: 10px; }
.modal-acts { display: flex; gap: 8px; margin-top: 16px; }
.modal-acts button {
  flex: 1; height: 40px;
  border: 0; border-radius: 12px;
  font-size: 13.5px; font-weight: 620;
}
.modal-acts .m-cancel { background: var(--ghost-bg); color: var(--ink-2); }
.modal-acts .m-ok { background: var(--btn-bg); color: var(--btn-fg); }

.f-row { margin-bottom: 14px; }
.f-row > label {
  display: block;
  font-size: 11px; color: var(--ink-3);
  margin-bottom: 6px;
  letter-spacing: 0.03em;
}
.f-in {
  width: 100%; height: 40px;
  border: 1px solid var(--line-2);
  border-radius: 11px;
  background: var(--surface-2);
  padding: 0 12px;
  font-size: 14px; color: var(--ink);
}
.f-in:focus { outline: none; border-color: var(--brand-line); box-shadow: 0 0 0 3px var(--brand-soft); }
.f-in[type="number"] { -moz-appearance: textfield; }
.f-in[type="number"]::-webkit-inner-spin-button,
.f-in[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.f-colors { display: flex; flex-wrap: wrap; gap: 7px; }
.f-c {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 0;
  background: var(--c);
  position: relative;
  transition: transform 0.14s var(--ease);
}
.f-c.is-on { transform: scale(1.1); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--c); }
.f-subs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.f-sub {
  display: inline-flex; align-items: center; gap: 4px;
  height: 26px; padding: 0 8px;
  border: 1px solid var(--line-2);
  border-radius: 13px;
  background: var(--surface-2);
  font-size: 11.5px; color: var(--ink-2);
}
.f-sub button {
  border: 0; background: transparent;
  color: var(--ink-3);
  font-size: 12px;
  padding: 0 1px;
  line-height: 1;
}
.f-add { display: flex; gap: 6px; }
.f-add .f-in { height: 34px; font-size: 12.5px; }
.f-add button {
  flex: 0 0 auto; height: 34px; padding: 0 14px;
  border: 0; border-radius: 10px;
  background: var(--ghost-bg); color: var(--ink-2);
  font-size: 12.5px; font-weight: 600;
}
.f-hint { font-size: 11px; color: var(--ink-3); line-height: 1.7; margin-top: 8px; }
/* 用 .f-in 做的日期按钮与多行输入 */
.f-date { text-align: left; font-size: 14px; }
.f-date.is-ph { color: var(--ink-3); }
.f-span { display: flex; align-items: center; gap: 8px; }
.f-span .f-date { flex: 1 1 auto; min-width: 0; }
.f-now {
  flex: 0 0 auto; height: 40px; padding: 0 12px;
  border: 1px solid var(--line-2); border-radius: 11px;
  background: var(--surface-2); color: var(--ink-3);
  font-size: 12.5px; font-weight: 600;
}
.f-now.is-on { background: var(--brand-soft); border-color: var(--brand-line); color: var(--brand); }
.f-x {
  flex: 0 0 auto; width: 26px; height: 40px;
  border: 0; background: transparent;
  color: var(--ink-3); font-size: 16px; line-height: 1;
}
.f-area {
  height: auto; min-height: 76px;
  padding: 10px 12px;
  line-height: 1.62;
  resize: none;
  font-family: inherit;
  white-space: pre-wrap;
  word-break: break-word;
}

/* ---------------- toast ---------------- */
.toast {
  position: fixed;
  left: 50%;
  top: calc(env(safe-area-inset-top) + 54px + var(--bar-h, 0px));
  width: calc(min(100vw, 560px) - 32px);
  transform: translate(-50%, -10px);
  background: #22201c;
  color: #faf8f2;
  font-size: 12.5px;
  line-height: 1.45;
  min-height: 38px;
  padding: 8px 14px;
  border-radius: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s var(--ease), transform 0.18s var(--ease);
  z-index: 60;
  display: flex; align-items: center; gap: 12px;
  box-shadow: 0 6px 20px -8px rgba(20, 18, 14, 0.5);
}
.toast span { flex: 1; min-width: 0; }
.toast.is-on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button {
  border: 0; background: transparent;
  color: #e8b981; font-size: 12.5px; font-weight: 650;
  padding: 2px 0;
  flex: 0 0 auto;
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hdr">
    <h1 class="hdr-title" id="hdr-title">记账</h1>
    <button class="icon-btn" id="open-me" aria-label="我的">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="8.5" r="3.6" />
        <path d="M4.8 20c.6-3.9 3.6-6.2 7.2-6.2s6.6 2.3 7.2 6.2" />
      </svg>
      <span class="icon-dot" id="me-dot" hidden></span>
    </button>
  </header>

  <div class="store-bar" id="store-bar" hidden>
    <span id="store-bar-txt"></span>
    <button id="store-bar-x" aria-label="关闭">✕</button>
  </div>

  <main class="main">
    <!-- ============ 记账 ============ -->
    <section class="view is-active" id="v-book">
      <div class="book-seg" id="seg-book">
        <button class="is-on" data-bpane="flow">流水</button>
        <button data-bpane="stat">统计分析</button>
      </div>
      <div class="book-scroll" id="book-scroll">
        <div class="book" id="book"></div>
        <div class="stat" id="stat"></div>
      </div>
    </section>

    <!-- ============ 轨迹 ============ -->
    <section class="view" id="v-track">
      <div class="seg" id="seg-track">
        <button class="seg-btn is-on" data-tpane="mile">大事记</button>
        <button class="seg-btn" data-tpane="space">空间</button>
      </div>
      <div class="track-bar">
        <button class="tr-add" id="tr-add">＋ 新建</button>
      </div>
      <div class="pane is-active" id="pane-mile">
        <div class="track" id="track"></div>
      </div>
      <div class="pane" id="pane-space">
        <div class="map-box" id="map-box">
          <svg id="map" viewBox="-18 -16 1268 883" preserveAspectRatio="xMidYMid meet" aria-label="去过的城市"></svg>
          <div class="map-zoom">
            <button id="map-in" aria-label="放大">＋</button>
            <button id="map-out" aria-label="缩小" disabled>−</button>
            <button id="map-back" aria-label="回到全国" style="visibility:hidden">◎</button>
          </div>
        </div>
        <div class="track" id="space"></div>
      </div>

    <!-- ============ 目标 / 备忘 ============ -->

      <div class="seg" id="seg-plan">

        <button class="seg-btn" data-pane="memo">计划</button>
      </div>

      <div class="pane is-active" id="pane-plan">
        <div class="goal-top" id="goal-top"></div>
        <div class="goal" id="goal"></div>
        <div class="goal-acts">
          <button class="goal-add" id="goal-more">＋ 新建目标</button>
        </div>
      </div>

      <div class="pane" id="pane-memo">
        <div class="goal-top" id="memo-top"></div>
        <div class="memo" id="memo"></div>
        <div class="goal-acts">
          <button class="goal-add" id="memo-more">＋ 新建计划</button>
        </div>
      </div>
    </section>

    <!-- ============ 随笔 ============ -->
    <section class="view" id="v-note">
      <div class="note-editor">
        <textarea id="note-text" placeholder="今天…" rows="3"></textarea>
        <div class="note-acts">
          <button class="chip-toggle" id="n-big" aria-pressed="false"><span class="dot"></span>写成大事记</button>
          <button class="btn-primary" id="note-save">存下来</button>
        </div>
      </div>
      <div class="note-feed" id="note-feed"></div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab is-on" data-view="book">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4.5" y="3.5" width="15" height="17" rx="3" />
        <path d="M8.5 3.5v17M11.5 8.5h4M11.5 12.5h4M11.5 16.5h2.5" />
      </svg>
      <span>记账</span>
    </button>
    <button class="tab" data-view="plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="5" width="16" height="15" rx="3" />
        <path d="M8 3.5v3M16 3.5v3M8.5 12.5l2 2 4-4.2" />
      </svg>
      <span>目标</span>
    </button>
    <button class="tab" data-view="note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">

      <span>随笔</span>

    <button class="tab" data-view="track">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 4v16" /><circle cx="6" cy="8" r="2" /><circle cx="6" cy="16" r="2" />
        <path d="M11 8h8M11 16h6" />
      </svg>
      <span>轨迹</span>

</div>

<!-- ============ 记一笔 / 改一笔 ============ -->
<div class="sheet" id="sheet-edit">
  <div class="sheet-hdr ed-hdr">
    <button class="icon-btn" id="ed-close" aria-label="返回">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 5l-7 7 7 7" />
      </svg>
    </button>
    <div class="ed-dir" id="ed-dir">
      <button class="is-on" data-dir="out">支出</button>
      <button data-dir="in">收入</button>
    </div>
    <button class="ed-act" id="ed-manage">编辑</button>
  </div>

  <div class="ed-body">
    <div class="cat-grid" id="ed-cats"></div>
    <div class="subs is-empty" id="ed-subs"></div>

    <div class="amt-wrap">
      <div class="amt-win is-empty" id="ed-win">
        <span class="amt-cur">¥</span>
        <span class="wheels" id="ed-int"></span>
        <span class="w-dot">.</span>
        <span class="wheels dec" id="ed-dec"></span>
        <span class="amt-cta">输入金额</span>
      </div>

/* =========================================================
   生活 · v0.12
   记账（自定义分类 / 余额 / 统计）· 轨迹 · 目标 · 备忘 · 随笔
