<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#f4f1ea" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="生活" />
<meta name="format-detection" content="telephone=no" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<link rel="icon" href="./icon-192.png" />
<title>生活 · 记录</title>
<style>
/* =========================================================
   生活 · 设计令牌（与 Tempo 同源，换主题只换这一组）
   ========================================================= */
:root {
  --bg: #f4f1ea;
  --bg-tint: #eae4d6;
  --surface: #fffefb;
  --surface-2: #faf7f1;
  --hover: rgba(32, 32, 29, 0.04);
  --hover-2: rgba(32, 32, 29, 0.07);

  --ink: #211f1b;
  --ink-2: #5b564d;
  --ink-3: #948d80;

  --line: rgba(33, 31, 27, 0.075);
  --line-2: rgba(33, 31, 27, 0.14);

  --brand: #3d7a61;
  --brand-soft: rgba(61, 122, 97, 0.09);
  --brand-line: rgba(61, 122, 97, 0.26);

  --accent: #c4853f;
  --accent-soft: rgba(196, 133, 63, 0.12);
  --danger: #b5563f;
  --danger-soft: rgba(181, 86, 63, 0.12);

  --btn-bg: #221f1b;
  --btn-fg: #fbf9f4;
  --ghost-bg: rgba(32, 32, 29, 0.045);

  --shadow-1: 0 1px 2px rgba(32, 29, 24, 0.05), 0 1px 0 rgba(255, 255, 255, 0.6) inset;
  --shadow-2: 0 2px 5px -2px rgba(32, 29, 24, 0.07), 0 18px 38px -22px rgba(32, 29, 24, 0.28);
  --shadow-3: 0 26px 60px -30px rgba(28, 26, 21, 0.4);

  /* 液态玻璃：半透明面 + 背景模糊 + 一道高光边 */
  --glass: rgba(255, 254, 251, 0.55);
  --glass-2: rgba(255, 254, 251, 0.34);
  --glass-brd: rgba(255, 255, 255, 0.66);
  --glass-hi: rgba(255, 255, 255, 0.85);
  --glass-blur: saturate(1.85) blur(22px);
  --glass-blur-lite: saturate(1.5) blur(12px);

  /* 内凹窗口（滚轮计数器的表壳） */
  --well-top: #ece6d9;
  --well-bot: #f6f2e9;
  --well-in: rgba(48, 42, 32, 0.16);
  --well-ring: rgba(255, 255, 255, 0.7);

  /* 背景光雾 */
  --mist-1: rgba(202, 134, 54, 0.34);
  --mist-2: rgba(58, 116, 94, 0.15);
  --mist-3: rgba(206, 170, 118, 0.40);

  --r-xl: 26px;
  --r-lg: 20px;
  --r-md: 14px;
  --r-sm: 10px;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  /* 滚轮停下来的那一下：带一点过冲，再被窗口边缘吃掉 */
  --ease-wheel: cubic-bezier(0.2, 1.44, 0.44, 1);
  --dur: 0.16s;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
    "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
}

[data-theme="dark"] {
  --bg: #0f1110;
  --bg-tint: #171b19;
  --surface: #191c1a;
  --surface-2: #141614;
  --hover: rgba(255, 255, 255, 0.05);
  --hover-2: rgba(255, 255, 255, 0.085);

  --ink: #eceae3;
  --ink-2: #a8a49a;
  --ink-3: #8b8880;

  --line: rgba(255, 255, 255, 0.075);
  --line-2: rgba(255, 255, 255, 0.16);

  --brand: #7db69a;
  --brand-soft: rgba(125, 182, 154, 0.13);
  --brand-line: rgba(125, 182, 154, 0.32);

  --accent: #d9a166;
  --accent-soft: rgba(217, 161, 102, 0.14);
  --danger: #d47f68;
  --danger-soft: rgba(212, 127, 104, 0.14);

  --btn-bg: #e9e6dd;
  --btn-fg: #12140f;
  --ghost-bg: rgba(255, 255, 255, 0.06);

  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
  --shadow-2: 0 2px 8px rgba(0, 0, 0, 0.35), 0 22px 48px -26px rgba(0, 0, 0, 0.75);
  --shadow-3: 0 26px 60px -30px rgba(0, 0, 0, 0.85);

  --glass: rgba(30, 34, 32, 0.52);
  --glass-2: rgba(30, 34, 32, 0.34);
  --glass-brd: rgba(255, 255, 255, 0.13);
  --glass-hi: rgba(255, 255, 255, 0.22);

  --well-top: #0a0c0b;
  --well-bot: #141715;
  --well-in: rgba(0, 0, 0, 0.62);
  --well-ring: rgba(255, 255, 255, 0.07);

  --mist-1: rgba(198, 132, 58, 0.17);
  --mist-2: rgba(84, 152, 122, 0.19);
  --mist-3: rgba(146, 122, 88, 0.20);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  user-select: none;
  touch-action: manipulation;
  position: relative;
}
button, input, textarea { font-family: inherit; }
button { cursor: pointer; }
input, textarea { user-select: text; }

/* 底下的光雾：玻璃要有东西可以折射，才不像一块灰板 */
body::before {
  content: "";
  position: fixed;
  inset: -15%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(36% 30% at 14% 4%, var(--mist-1), transparent 66%),
    radial-gradient(42% 34% at 88% 14%, var(--mist-2), transparent 68%),
    radial-gradient(56% 40% at 54% 100%, var(--mist-3), transparent 72%),
    radial-gradient(30% 26% at 2% 70%, var(--mist-2), transparent 70%);
  animation: mist 34s var(--ease) infinite alternate;
}
@keyframes mist {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to   { transform: translate3d(-2.4%, 1.8%, 0) scale(1.06); }
}
@media (prefers-reduced-motion: reduce) {
  body::before { animation: none; }
}

/* ---------------- 骨架 ---------------- */
.app {
  height: var(--vh, 100dvh);
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: transparent;
  position: relative;
  z-index: 1;
  overflow: hidden;
}

/* 玻璃面的通用配方 */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-brd);
  box-shadow: 0 1px 0 var(--glass-hi) inset, var(--shadow-2);
}

.hdr {
  flex: 0 0 auto;
  height: calc(50px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top);
  padding-inline: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--glass-2);
  -webkit-backdrop-filter: var(--glass-blur-lite);
  backdrop-filter: var(--glass-blur-lite);
  border-bottom: 1px solid var(--glass-brd);
  box-shadow: 0 10px 24px -22px rgba(48, 42, 32, 0.55);
  position: relative;
  z-index: 12;
}
.hdr::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--glass-hi), transparent);
  opacity: 0.8;
}
.hdr-title {
  font-size: 15.5px;
  font-weight: 620;
  letter-spacing: -0.005em;
  margin: 0;
}
.icon-btn {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: transparent; color: var(--ink-2);
  transition: background var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.icon-btn { position: relative; }
.icon-btn:active { transform: scale(0.92); background: var(--hover-2); }
.icon-dot {
  position: absolute; top: 6px; right: 6px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 2px var(--bg);
}

.main { flex: 1; min-height: 0; position: relative; }
.view {
  position: absolute; inset: 0;
  display: none;
  flex-direction: column;
}
.view.is-active { display: flex; }

/* ---------------- 分段控件 ---------------- */
.seg {
  flex: 0 0 auto;
  height: 38px;
  margin: 0 20px 8px;
  display: flex; gap: 3px;
  padding: 3px;
  background: var(--ghost-bg);
  border-radius: 12px;
  overflow: hidden;
  transition: height 0.32s var(--ease), margin 0.32s var(--ease),
              padding 0.32s var(--ease), opacity 0.2s var(--ease);
}
/* 矮屏上正在输金额时，把"记账/随笔"收起来，高度让给流水 */
@media (max-height: 720px) {
  .app.pad-open .seg {
    height: 0;
    padding-top: 0; padding-bottom: 0;
    margin-bottom: 0;
    opacity: 0;
    pointer-events: none;
  }
}
.seg-btn {
  flex: 1; height: 32px;
  border: 0; border-radius: 9px;
  background: transparent;
  color: var(--ink-3);
  font-size: 13px; font-weight: 600;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.seg-btn.is-on {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-1);
}

/* ---------------- 记账 ---------------- */
.pane { flex: 1; min-height: 0; display: none; flex-direction: column; }
.pane.is-active { display: flex; }

.amt-top {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
  padding: 2px 20px 11px;
}
.amt-wrap { flex: 0 0 auto; padding: 0 20px 11px; }

/* ---- 内凹表壳：机械滚轮计数器的窗口 ---- */
.amt-win {
  width: 100%;
  height: 62px;
  border: 0;
  border-radius: 20px;
  padding: 0 15px 0 13px;
  display: flex; align-items: center;
  gap: 0;
  overflow: hidden;
  position: relative;
  background:
    linear-gradient(180deg, var(--well-top) 0%, var(--well-bot) 46%, var(--well-top) 100%);
  box-shadow:
    /* 上沿的暗边 + 往下压的阴影：凹进去的关键 */
    inset 0 1.5px 0 rgba(48, 42, 32, 0.18),
    inset 0 3px 7px var(--well-in),
    inset 0 18px 22px -14px rgba(48, 42, 32, 0.5),
    /* 下沿一道亮线：玻璃内壁反光 */
    inset 0 -1.5px 0 var(--well-ring),
    inset 0 -8px 12px -10px rgba(255, 255, 255, 0.9),
    /* 外壳本身浮在背景上 */
    0 1px 0 rgba(255, 255, 255, 0.6),
    0 8px 18px -14px rgba(48, 42, 32, 0.5);
  transition: box-shadow 0.26s var(--ease), transform 0.2s var(--ease);
  -webkit-appearance: none;
}
/* 表壳玻璃上的一道斜高光 */
.amt-win::after {
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  border-radius: inherit;
  background: linear-gradient(118deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 30%);
  opacity: 0.5;
}
.amt-win.is-live {
  box-shadow:
    inset 0 1.5px 0 rgba(48, 42, 32, 0.18),
    inset 0 3px 7px var(--well-in),
    inset 0 18px 22px -14px rgba(48, 42, 32, 0.5),
    inset 0 0 0 1.5px var(--brand-line),
    inset 0 -1.5px 0 var(--well-ring),
    0 0 0 4px var(--brand-soft),
    0 8px 18px -14px rgba(48, 42, 32, 0.5);
}
.amt-win.is-shake { animation: shake 0.34s var(--ease); }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  22% { transform: translateX(-6px); }
  62% { transform: translateX(5px); }
}

.amt-cur {
  font-size: 18px; font-weight: 500;
  color: var(--ink-3);
  margin-right: 6px;
  flex: 0 0 auto;
  line-height: 1;
}

/* 窗口右侧：空态提示"点这里"，有金额时显示要记到哪个分类 */
.amt-cta,
.amt-tag {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  max-width: 46%;
  font-size: 11.5px;
  font-weight: 550;
  letter-spacing: 0.01em;
  color: var(--ink-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.24s var(--ease);
}
.amt-win.is-empty .amt-cta { opacity: 1; }
.amt-win.is-empty.is-live .amt-cta { opacity: 0; }
.amt-win:not(.is-empty) .amt-tag { opacity: 1; }

/* ---- 滚轮 ---- */
.wheels { display: flex; align-items: center; min-width: 0; flex: 0 0 auto; }

[data-theme="dark"] .amt-win {
  background: linear-gradient(180deg, #050706 0%, #131615 46%, #050706 100%);
  box-shadow:
    inset 0 1.5px 0 rgba(0, 0, 0, 0.9),
    inset 0 3px 9px rgba(0, 0, 0, 0.85),
    inset 0 18px 24px -14px rgba(0, 0, 0, 0.9),
    inset 0 -1.5px 0 rgba(255, 255, 255, 0.13),
    inset 0 -8px 12px -10px rgba(255, 255, 255, 0.16),
    0 1px 0 rgba(255, 255, 255, 0.05),
    0 8px 18px -14px rgba(0, 0, 0, 0.9);
}
[data-theme="dark"] .amt-win.is-live {
  box-shadow:
    inset 0 1.5px 0 rgba(0, 0, 0, 0.9),
    inset 0 3px 9px rgba(0, 0, 0, 0.85),
    inset 0 18px 24px -14px rgba(0, 0, 0, 0.9),
    inset 0 0 0 1.5px var(--brand-line),
    inset 0 -1.5px 0 rgba(255, 255, 255, 0.13),
    0 0 0 4px var(--brand-soft);
}
.wheel {
  width: calc(var(--wh, 50px) * 0.52);
  height: var(--wh, 50px);
  overflow: hidden;
  flex: 0 0 auto;
  position: relative;
}
.wstrip {
  display: block;
  will-change: transform;
  transform: translate3d(0, calc(var(--y, 10) * -1 * var(--wh, 50px)), 0);
  transition: transform var(--t, 0.3s) var(--d, 0s) var(--ease-wheel);
}
.wstrip i {
  height: var(--wh, 50px);
  display: grid; place-items: center;
  font-size: 42px; font-weight: 650;
  line-height: 1;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  font-style: normal;
  color: var(--ink);
  transition: color 0.3s var(--ease);
}
.wheels.dec .wheel { width: calc(var(--wh, 50px) * 0.42); }
.wheels.dec .wstrip i { font-size: 26px; font-weight: 600; color: var(--ink-2); }
.wheels.dec { margin-left: 2px; }
.w-dot {
  flex: 0 0 auto;
  width: 8px;
  text-align: center;
  font-size: 26px; font-weight: 700;
  color: var(--ink-2);
  line-height: 1;
  transform: translateY(1px);
}
.amt-win.is-empty .wstrip i { color: var(--ink-3); font-weight: 520; }
.amt-win.is-empty .w-dot { color: var(--ink-3); opacity: 0.65; }

.dir { display: flex; gap: 2px; padding: 2px; background: var(--ghost-bg); border-radius: 10px; flex: 0 0 auto; }.dir-btn {
  height: 26px; padding: 0 11px;
  border: 0; border-radius: 8px;
  background: transparent; color: var(--ink-3);
  font-size: 12px; font-weight: 600;
  transition: all var(--dur) var(--ease);
}
.dir-btn.is-on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.dir-btn.is-on[data-dir="in"] { color: var(--brand); }

.save-btn {
  flex: 0 0 auto;
  height: 40px;
  padding: 0 20px;
  border: 0;
  border-radius: 20px;
  background: var(--btn-bg);
  color: var(--btn-fg);
  font-size: 14px; font-weight: 620;
  letter-spacing: 0.01em;
  transition: transform 0.1s var(--ease), opacity 0.1s var(--ease);
}
.save-btn:active { transform: scale(0.955); opacity: 0.9; }

.cats {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  padding: 0 20px;
}
.cat {
  height: 46px;
  border: 1px solid var(--glass-brd);
  border-radius: var(--r-md);
  background: color-mix(in srgb, var(--surface) 74%, transparent);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  font-size: 11px; font-weight: 550; color: var(--ink-2);
  box-shadow: 0 1px 0 var(--glass-hi) inset, 0 2px 6px -4px rgba(32, 29, 24, 0.18);
  transition: transform 0.18s var(--ease), background 0.18s var(--ease),
              border-color 0.18s var(--ease), box-shadow 0.18s var(--ease);
  position: relative;
}
.cat .sw {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--c); opacity: 0.62;
  transition: all 0.18s var(--ease);
}
.cat.is-on {
  border-color: color-mix(in srgb, var(--c) 52%, transparent);
  background: var(--cs);
  color: var(--ink);
  font-weight: 650;
  transform: translateY(-1.5px);
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.72) inset,
    0 7px 16px -9px var(--c);
}
.cat.is-on .sw { opacity: 1; box-shadow: 0 0 0 3.5px var(--cs); }
.cat:active { transform: scale(0.955); }

/* ---- 二级分类：横滑一行 ---- */
.subs {
  flex: 0 0 auto;
  display: flex; gap: 6px;
  padding: 10px 20px 1px;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 18px), transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 18px), transparent 100%);
}
.subs::-webkit-scrollbar { display: none; }
.subs.is-empty { padding-top: 0; height: 0; overflow: hidden; }
.sub {
  flex: 0 0 auto;
  height: 30px; padding: 0 13px;
  border: 1px solid var(--line-2);
  border-radius: 15px;
  background: color-mix(in srgb, var(--surface) 62%, transparent);
  color: var(--ink-2);
  font-size: 12px; font-weight: 550;
  white-space: nowrap;
  transition: transform 0.16s var(--ease), background 0.18s var(--ease),
              color 0.18s var(--ease), border-color 0.18s var(--ease);
}
.sub.is-on {
  background: var(--accent-soft);
  color: #9d6320;
  border-color: color-mix(in srgb, var(--accent) 55%, transparent);
  font-weight: 640;
  box-shadow: 0 3px 10px -6px rgba(196, 133, 63, 0.65), 0 1px 0 rgba(255, 255, 255, 0.5) inset;
}
[data-theme="dark"] .sub.is-on { color: var(--accent); }
[data-theme="dark"] .rate-well,
[data-theme="dark"] .stat-cell {
  background: linear-gradient(180deg, #050706, #131615);
  box-shadow:
    inset 0 1.5px 0 rgba(0, 0, 0, 0.9),
    inset 0 3px 7px rgba(0, 0, 0, 0.8),
    inset 0 -1.5px 0 rgba(255, 255, 255, 0.12),
    0 1px 0 rgba(255, 255, 255, 0.04);
}
.sub:active { transform: scale(0.95); }

.row-note {
  flex: 0 0 auto;
  display: flex; gap: 8px; align-items: center;
  padding: 10px 20px 6px;
}
.row-note input {
  flex: 1; min-width: 0; height: 38px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  padding: 0 12px;
  font-size: 13.5px; color: var(--ink);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.row-note input::placeholder { color: var(--ink-3); }
.row-note input:focus {
  outline: none;
  border-color: var(--brand-line);
  box-shadow: 0 0 0 3px var(--brand-soft);
}

.chip-toggle {
  flex: 0 0 auto;
  height: 32px; padding: 0 11px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  color: var(--ink-3);
  font-size: 11.5px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all var(--dur) var(--ease);
}
.chip-toggle .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ink-3); opacity: 0.4;
  transition: all var(--dur) var(--ease);
}
.chip-toggle[aria-pressed="true"] {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}
.chip-toggle[aria-pressed="true"] .dot { background: var(--accent); opacity: 1; }
.chip-toggle:active { transform: scale(0.96); }

.today {
  flex: 1; min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 2px 20px 14px;
}
.today-head {
  display: flex; align-items: baseline; gap: 8px;
  padding: 6px 0 2px;
  font-size: 11.5px; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.today-head b { color: var(--ink-2); font-weight: 600; }
.today-sep {
  display: flex; align-items: center; gap: 8px;
  margin: 10px 0 4px;
  font-size: 10.5px; color: var(--ink-3);
}
.today-sep::after {
  content: ""; flex: 1; height: 1px;
  background: var(--line);
}
.today-day {
  font-size: 10.5px;
  color: var(--ink-3);
  padding: 8px 0 2px;
  font-variant-numeric: tabular-nums;
}

.tx {
  display: flex; align-items: center; gap: 9px;
  height: 33px;
  font-size: 13px;
  border-radius: 8px;
  transition: background var(--dur) var(--ease);
}
.tx:active { background: var(--hover); }
.tx-time { width: 36px; flex: 0 0 auto; font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tx-dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }
.tx-cat { color: var(--ink-2); flex: 0 0 auto; max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-note { flex: 1; min-width: 0; color: var(--ink-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-amt { flex: 0 0 auto; font-weight: 620; font-variant-numeric: tabular-nums; }
.tx-amt.out { color: var(--ink); }
.tx-amt.in { color: var(--brand); }
.tx-trk { font-size: 9px; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 3px; line-height: 13px; flex: 0 0 auto; }

.app.pad-open #today .empty { display: none; }
.empty {
  padding: 26px 4px;
  text-align: center;
  color: var(--ink-3);
  font-size: 12.5px;
  line-height: 1.8;
}
.empty b { display: block; color: var(--ink-2); font-size: 13.5px; font-weight: 600; margin-bottom: 2px; }

/* ---------------- 数字键盘（按需从底部升起，不常驻） ---------------- */
.keypad {
  --kh: 50px;
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  height: 0;
  padding: 0 16px;
  overflow: hidden;
  opacity: 0;
  background: var(--glass-2);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  border-top: 1px solid transparent;
  transition: height 0.36s var(--ease), padding 0.36s var(--ease),
              opacity 0.22s var(--ease), border-color 0.22s var(--ease);
}
.keypad.is-open {
  height: calc(var(--kh) * 4 + 21px + 16px + env(safe-area-inset-bottom));
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
  opacity: 1;
  border-top-color: var(--glass-brd);
}
.keypad[hidden] { display: none; }
.key {
  height: var(--kh);
  border: 1px solid var(--glass-brd);
  border-radius: var(--r-md);
  background: color-mix(in srgb, var(--surface) 78%, transparent);
  color: var(--ink);
  font-size: 21px; font-weight: 500;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 1px 0 var(--glass-hi) inset, 0 2px 5px -3px rgba(32, 29, 24, 0.24);
  transition: transform 0.09s var(--ease), background 0.09s var(--ease);
  display: grid; place-items: center;
  -webkit-appearance: none;
}
.key:active { transform: scale(0.955); background: var(--hover-2); }
.key.del { font-size: 14px; color: var(--ink-2); }
@media (max-height: 720px) {
  .keypad { --kh: 44px; }
}

/* ---------------- 随笔 ---------------- */
.note-editor { flex: 0 0 auto; padding: 0 20px 8px; }
#note-text {
  width: 100%;
  min-height: 74px;
  max-height: 150px;
  resize: none;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--surface);
  padding: 12px 14px;
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--ink);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
#note-text::placeholder { color: var(--ink-3); }
#note-text:focus {
  outline: none;
  border-color: var(--brand-line);
  box-shadow: 0 0 0 3px var(--brand-soft);
}
.note-acts {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 8px;
}
.btn-primary {
  height: 34px; padding: 0 18px;
  border: 0; border-radius: 17px;
  background: var(--btn-bg); color: var(--btn-fg);
  font-size: 13px; font-weight: 600;
  transition: transform 0.1s var(--ease), opacity 0.1s var(--ease);
}
.btn-primary:active { transform: scale(0.96); opacity: 0.88; }

.note-feed {
  flex: 1; min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 12px 20px 12px;
}
.nf-day {
  font-size: 11px; color: var(--ink-3);
  padding: 10px 0 4px;
  font-variant-numeric: tabular-nums;
}
.nf-item {
  display: flex; gap: 8px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--ink-2);
}
.nf-item:last-child { border-bottom: 0; }
.nf-time { flex: 0 0 auto; width: 36px; font-size: 11px; color: var(--ink-3); padding-top: 2px; font-variant-numeric: tabular-nums; }
.nf-text { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
.nf-item.is-big .nf-text { color: var(--ink); font-weight: 550; }
.nf-flag { color: var(--accent); font-size: 10px; border: 1px solid var(--accent); border-radius: 5px; padding: 0 4px; height: 15px; line-height: 13px; flex: 0 0 auto; margin-top: 3px; }

/* ---------------- 轨迹 ---------------- */
.track {
  flex: 1; min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 2px 20px 20px;
}
.day { position: relative; padding-left: 20px; padding-bottom: 14px; }
.day::before {
  content: "";
  position: absolute; left: 4px; top: 9px; bottom: -4px;
  width: 1px; background: var(--line-2);
}
.day:last-child::before { display: none; }
.day-dot {
  position: absolute; left: 0; top: 4px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--line-2);
}
.day.has-mile .day-dot { border-color: var(--accent); background: var(--accent); }
.day-label {
  display: flex; align-items: baseline; gap: 7px;
  font-size: 11.5px; color: var(--ink-3);
  margin-bottom: 6px;
  font-variant-numeric: tabular-nums;
}
.day-label b { color: var(--ink-2); font-weight: 600; font-size: 12.5px; }
.mile {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 10px 12px;
  margin-bottom: 6px;
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--ink);
  box-shadow: var(--shadow-1);
  white-space: pre-wrap;
  word-break: break-word;
}
.mile-tx {
  display: flex; align-items: center; gap: 8px;
  font-size: 12.5px;
  color: var(--ink-2);
  padding: 8px 12px 8px 11px;
  border-left: 2px solid var(--accent);
  border-radius: 4px var(--r-md) var(--r-md) 4px;
  box-shadow: none;
}
.mile-tx .mt-amt {
  margin-left: auto;
  font-weight: 620;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.spend {
  padding: 5px 0 1px;
  font-size: 12px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.01em;
}
.spend b { color: var(--ink-2); font-weight: 600; }
.spend .sep { margin: 0 3px; opacity: 0.55; }

/* ---------------- 计划 ---------------- */
.plan {
  flex: 1; min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 2px 20px 16px;
}
.plan-h {
  display: flex; align-items: baseline; justify-content: space-between;
  margin: 6px 0 4px;
}
.plan-h h2 { margin: 0; font-size: 13.5px; font-weight: 650; }
.plan-h .sub { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.rate-box {
  display: flex; align-items: center; gap: 9px;
  margin: 2px 0 16px;
  font-size: 11.5px; color: var(--ink-3);
}
/* 达标率也是一块小表壳 */
.rate-well {
  display: inline-flex; align-items: center; justify-content: center;
  height: 52px; min-width: 94px; padding: 0 12px;
  border-radius: var(--r-md);
  background: linear-gradient(180deg, var(--well-top), var(--well-bot));
  --wh: 36px;
  box-shadow:
    inset 0 1.5px 0 rgba(48, 42, 32, 0.16),
    inset 0 3px 6px var(--well-in),
    inset 0 14px 16px -14px rgba(48, 42, 32, 0.34),
    inset 0 -1.5px 0 var(--well-ring),
    0 1px 0 rgba(255, 255, 255, 0.55);
}
.rate-well .wheel { width: calc(var(--wh, 36px) * 0.52); }
.rate-well .wstrip i { font-size: 29px; font-weight: 640; color: var(--brand); }
.rate-well .pct { font-size: 17px; font-weight: 660; color: var(--ink-3); margin-left: -3px; }
.rate-cap { font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }
.rate-cap b { color: var(--ink-2); font-weight: 620; font-variant-numeric: tabular-nums; }
.pl-sec { margin-bottom: 18px; }
.pl-sec-h {
  font-size: 11.5px; font-weight: 650; color: var(--ink-3);
  letter-spacing: 0.04em;
  margin: 0 0 2px;
}
.pl-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
  transition: opacity var(--dur) var(--ease);
}
.pl-item:last-child { border-bottom: 0; }
.pl-box {
  width: 19px; height: 19px; flex: 0 0 auto;
  border: 1.5px solid var(--line-2);
  border-radius: 6px;
  display: grid; place-items: center;
  transition: all var(--dur) var(--ease);
}
.pl-box svg { width: 11px; height: 11px; opacity: 0; transform: scale(0.6); transition: all var(--dur) var(--ease); }
.pl-item.done .pl-box { background: var(--brand); border-color: var(--brand); }
.pl-item.done .pl-box svg { opacity: 1; transform: none; }
.pl-text { flex: 1; min-width: 0; font-size: 14px; line-height: 1.45; word-break: break-word; }
.pl-item.done .pl-text { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1px; }
.pl-item.stretch .pl-box { border-radius: 50%; }
.pl-item.stretch.done .pl-box { background: var(--accent); border-color: var(--accent); }
.pl-empty { font-size: 12px; color: var(--ink-3); padding: 8px 0 2px; }

.add-bar {
  flex: 0 0 auto;
  display: flex; gap: 8px;
  padding: 9px 20px calc(9px + env(safe-area-inset-bottom));
  background: var(--glass-2);
  -webkit-backdrop-filter: var(--glass-blur-lite);
  backdrop-filter: var(--glass-blur-lite);
  border-top: 1px solid var(--glass-brd);
}
.add-bar input {
  flex: 1; min-width: 0; height: 38px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  padding: 0 12px;
  font-size: 13.5px; color: var(--ink);
}
.add-bar input:focus { outline: none; border-color: var(--brand-line); box-shadow: 0 0 0 3px var(--brand-soft); }
.add-bar button {
  flex: 0 0 auto; width: 38px; height: 38px;
  border: 0; border-radius: var(--r-md);
  background: var(--btn-bg); color: var(--btn-fg);
  font-size: 19px; font-weight: 400;
  display: grid; place-items: center;
  transition: transform 0.1s var(--ease);
}
.add-bar button:active { transform: scale(0.94); }
.seg-mini {
  display: flex; gap: 2px; padding: 2px; background: var(--ghost-bg); border-radius: 9px;
  margin-right: 2px; flex: 0 0 auto;
}
.seg-mini button {
  width: auto; height: 34px; padding: 0 9px;
  border: 0; border-radius: 7px; background: transparent;
  font-size: 11.5px; font-weight: 600; color: var(--ink-3);
}
.seg-mini button.is-on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

/* ---------------- 备忘录 ---------------- */
.memo {
  flex: 1; min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 2px 20px 16px;
}
.mm-item {
  display: flex; gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  transition: opacity var(--dur) var(--ease);
}
.mm-box {
  width: 18px; height: 18px; flex: 0 0 auto; margin-top: 2px;
  border: 1.5px solid var(--line-2); border-radius: 5px;
  display: grid; place-items: center;
  transition: all var(--dur) var(--ease);
}
.mm-box svg { width: 10px; height: 10px; opacity: 0; transition: all var(--dur) var(--ease); }
.mm-item.done .mm-box { background: var(--ink-3); border-color: var(--ink-3); }
.mm-item.done .mm-box svg { opacity: 1; }
.mm-text { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.6; word-break: break-word; }
.mm-item.done .mm-text { color: var(--ink-3); text-decoration: line-through; }

/* ---------------- 底部 tab（玻璃条） ---------------- */
.tabbar {
  flex: 0 0 auto;
  height: calc(54px + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: var(--glass);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  border-top: 1px solid var(--glass-brd);
  box-shadow: 0 -1px 0 var(--glass-hi) inset, 0 -12px 26px -20px rgba(48, 42, 32, 0.5);
  position: relative;
  z-index: 12;
}
.tab {
  border: 0; background: transparent;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-3);
  font-size: 10px; font-weight: 550;
  position: relative;
  transition: color 0.2s var(--ease);
}
.tab svg { width: 20px; height: 20px; stroke-width: 1.7; transition: transform 0.24s var(--ease); }
.tab.is-on { color: var(--ink); }
.tab.is-on svg { stroke-width: 2.1; transform: translateY(-1px); }
.tab:active { opacity: 0.6; }
.tab.is-on::before {
  content: "";
  position: absolute; top: 0; left: 50%;
  width: 26px; height: 2.5px;
  border-radius: 0 0 3px 3px;
  background: var(--accent);
  transform: translateX(-50%);
  opacity: 0.85;
}

/* ---------------- 我的 ---------------- */
.sheet {
  position: fixed; inset: 0; z-index: 40;
  background:
    radial-gradient(64% 42% at 82% -4%, var(--mist-1), transparent 70%),
    radial-gradient(52% 40% at -2% 82%, var(--mist-2), transparent 72%),
    radial-gradient(60% 36% at 50% 104%, var(--mist-3), transparent 74%),
    var(--bg);
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.3s var(--ease);
  visibility: hidden;
}
.sheet.is-open { transform: none; visibility: visible; }
.sheet-hdr {
  flex: 0 0 auto;
  height: calc(52px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top);
  padding-inline: 14px;
  display: flex; align-items: center; gap: 6px;
  border-bottom: 1px solid var(--line);
}
.sheet-hdr h2 { font-size: 16px; margin: 0; font-weight: 650; }
.sheet-body {
  flex: 1; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 4px 20px calc(28px + env(safe-area-inset-bottom));
  max-width: 560px; width: 100%; margin: 0 auto;
}
.stat-row {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; margin: 6px 0 20px;
}
.stat-cell {
  background: linear-gradient(180deg, var(--well-top), var(--well-bot));
  border: 1px solid var(--glass-brd);
  border-radius: var(--r-md);
  padding: 10px 4px 9px;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  box-shadow:
    inset 0 1.5px 0 rgba(48, 42, 32, 0.14),
    inset 0 3px 6px var(--well-in),
    inset 0 -1.5px 0 var(--well-ring),
    0 1px 0 rgba(255, 255, 255, 0.5);
}
.stat-cell .wheels { --wh: 28px; }
.stat-cell .wheel { width: calc(var(--wh, 28px) * 0.54); }
.stat-cell .wstrip i { font-size: 22px; font-weight: 640; }
.stat-cell span { font-size: 10.5px; color: var(--ink-3); }
.me-sec { margin-bottom: 20px; }
.me-sec h3 {
  font-size: 11px; color: var(--ink-3);
  letter-spacing: 0.05em; font-weight: 650;
  margin: 0 0 6px;
}
.row-btn {
  width: 100%;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0;
  border: 0; border-bottom: 1px solid var(--line);
  background: transparent;
  font-size: 14px; color: var(--ink);
  text-align: left;
}
.row-btn:last-child { border-bottom: 0; }
.row-btn .hint { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.row-btn .hint.warn { color: var(--accent); font-weight: 600; }
.row-btn.danger { color: var(--danger); }
.row-btn:active { opacity: 0.55; }

.theme-row { display: flex; gap: 6px; padding: 6px 0 10px; }
.theme-opt {
  flex: 1; height: 38px;
  border: 1px solid var(--line); border-radius: var(--r-md);
  background: transparent; color: var(--ink-3);
  font-size: 12.5px; font-weight: 600;
  transition: all var(--dur) var(--ease);
}
.theme-opt.is-on { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }

.me-note {
  font-size: 11.5px; color: var(--ink-3);
  line-height: 1.75;
  padding: 10px 0 0;
}
.me-ver { font-size: 11px; color: var(--ink-3); text-align: center; padding: 18px 0 0; }

/* ---------------- toast ---------------- */
/* 顶部横幅式提示：临时顶替标题行，不做半遮半掩的胶囊 */
.toast {
  position: fixed;
  left: 50%;
  top: calc(env(safe-area-inset-top) + 5px);
  width: calc(min(100vw, 560px) - 32px);
  transform: translate(-50%, -10px);
  background: #22201c;
  color: #faf8f2;
  font-size: 12.5px;
  line-height: 1.45;
  min-height: 38px;
  padding: 8px 14px;
  border-radius: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s var(--ease), transform 0.18s var(--ease);
  z-index: 60;
  display: flex; align-items: center; gap: 12px;
  box-shadow: 0 6px 20px -8px rgba(20, 18, 14, 0.5);
}
.toast span { flex: 1; min-width: 0; }
.toast.is-on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button {
  border: 0; background: transparent;
  color: #e8b981; font-size: 12.5px; font-weight: 650;
  padding: 2px 0;
  flex: 0 0 auto;
}

@media (max-height: 720px) {
  .amt-win { height: 58px; }
  .amt-win .wheels { --wh: 40px; }
  .wstrip i { font-size: 32px; }
  .wheels.dec .wstrip i { font-size: 21px; }
  .cat { height: 42px; }
  .note-editor #note-text { min-height: 64px; }
}
</style>

<body>
<div class="app" id="app">
  <header class="hdr">
    <h1 class="hdr-title" id="hdr-title">记录</h1>
    <button class="icon-btn" id="open-me" aria-label="我的">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="8.5" r="3.6" />
        <path d="M4.8 20c.6-3.9 3.6-6.2 7.2-6.2s6.6 2.3 7.2 6.2" />
      </svg>
      <span class="icon-dot" id="me-dot" hidden></span>
    </button>
  </header>

  <main class="main">
    <!-- ============ 记录 ============ -->
    <section class="view is-active" id="v-record">
      <div class="seg" id="seg-mode">
        <button class="seg-btn is-on" data-mode="txn">记账</button>
        <button class="seg-btn" data-mode="note">随笔</button>
      </div>

      <div class="pane is-active" id="pane-txn">
        <div class="amt-top">
          <div class="dir" id="dir">
            <button class="dir-btn is-on" data-dir="out">支出</button>
            <button class="dir-btn" data-dir="in">收入</button>
          </div>
          <button class="save-btn" id="save-txn">记下来</button>
        </div>

        <div class="amt-wrap">
          <button class="amt-win is-empty" id="amt-win" type="button" aria-label="输入金额">
            <span class="amt-cur">¥</span>
            <span class="wheels" id="amt-int"></span>
            <span class="w-dot" id="amt-dot">.</span>
            <span class="wheels dec" id="amt-dec"></span>
            <span class="amt-tag" id="amt-tag"></span>
            <span class="amt-cta">点这里</span>
          </button>
        </div>

        <div class="cats" id="cats"></div>
        <div class="subs is-empty" id="subs"></div>

        <div class="row-note">

/* =========================================================

"use strict";

/* ---------- 工具 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.prototype.slice.call(r.querySelectorAll(s));
const pad2 = (n) => String(n).padStart(2, "0");
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const dayKey = (ts) => { const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const fmtHM = (ts) => { const d = new Date(ts); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const fmtMD = (ts) => { const d = new Date(ts); return `${d.getMonth() + 1}/${d.getDate()}`; };
const WEEK_CN = ["日", "一", "二", "三", "四", "五", "六"];
const fmtMoney = (n) => {
  const v = Math.round(n * 100) / 100;
  return v % 1 === 0 ? String(v) : v.toFixed(2);
};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hexToRgba = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
};
/* 一周从周一开始 */
function weekStart(d) {
  const t = startOfDay(d || Date.now());
  const off = (t.getDay() + 6) % 7;
  const m = new Date(t);
  m.setDate(t.getDate() - off);
  return m;
}
const weekKey = (d) => dayKey(weekStart(d));
function weekRangeLabel(d) {
  const s = weekStart(d);
  const e = new Date(s); e.setDate(s.getDate() + 6);
  return `${s.getMonth() + 1}/${s.getDate()} – ${e.getMonth() + 1}/${e.getDate()}`;
}

/* ---------- 分类（两级） ---------- */
const CATS = [

  { id: "shop",    name: "购物", c: "#8f6ba8", subs: ["日用", "服饰", "数码", "美妆", "家居"] },
  { id: "home",    name: "居住", c: "#6b8f71", subs: ["房租", "水电", "燃气", "物业", "维修"] },
  { id: "fun",     name: "娱乐", c: "#c26b6b", subs: ["电影", "游戏", "运动", "旅行", "演出"] },

/* ---------- 状态 ---------- */

/* ---------- IndexedDB ---------- */
const DB_NAME = "life";
const DB_VER = 1;
let _db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("txns")) db.createObjectStore("txns", { keyPath: "id" });
      if (!db.objectStoreNames.contains("notes")) db.createObjectStore("notes", { keyPath: "id" });
      if (!db.objectStoreNames.contains("plans")) db.createObjectStore("plans", { keyPath: "id" });
      if (!db.objectStoreNames.contains("memos")) db.createObjectStore("memos", { keyPath: "id" });
      if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", { keyPath: "k" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function store(name, mode) {
  return _db.transaction(name, mode || "readonly").objectStore(name);
}
function dbAll(name) {
  return new Promise((res, rej) => {
    const r = store(name).getAll();
    r.onsuccess = () => res(r.result || []);
    r.onerror = () => rej(r.error);
  });
}
function dbPut(name, val) {
  return new Promise((res, rej) => {
    const r = store(name, "readwrite").put(val);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}
function dbDel(name, id) {
  return new Promise((res, rej) => {
    const r = store(name, "readwrite").delete(id);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}
function dbClear(name) {
  return new Promise((res, rej) => {
    const r = store(name, "readwrite").clear();
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg, action, onAction) {

    btn.addEventListener("click", () => {
      el.classList.remove("is-on");

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("is-on"), action ? 5200 : 2000);
}
/* iOS 不支持 vibrate；Chrome 在用户触摸前调用会报 console error，故先用标志拦住 */

/* ---------- 记录：分类 ---------- */

/* =========================================================
   机械滚轮计数器
   strip 里放 0-9 三遍：正反各滚一圈都撞不到边界。
   每一位是独立的一只轮子，低位先动、也停得快。
   ========================================================= */
const WCELLS = 30;
function makeWheel() {
  const el = document.createElement("span");
  el.className = "wheel";
  const strip = document.createElement("span");
  strip.className = "wstrip";
  let h = "";
  for (let i = 0; i < WCELLS; i++) h += "<i>" + (i % 10) + "</i>";
  strip.innerHTML = h;
  strip.style.setProperty("--y", 10);
  el.appendChild(strip);
  el._pos = 10;
  return el;
}
/**
 * @param idx 从右数第几位（0 = 最末位）。越靠右越快，模拟进位
 */
function setWheel(el, d, dir, idx) {
  const strip = el.firstChild;
  let pos = el._pos;
  if (pos < 10 || pos > 19) {            /* 静默拉回中圈：三圈重复，看不出变化 */
    pos = pos < 10 ? pos + 10 : pos - 10;
    el._pos = pos;
    strip.style.transition = "none";
    strip.style.setProperty("--y", pos);
    void strip.offsetHeight;
    strip.style.transition = "";
  }
  const cur = pos % 10;
  if (cur === d) return;
  const delta = dir >= 0 ? (d - cur + 10) % 10 : -((cur - d + 10) % 10);
  const next = pos + delta;
  el._pos = next;
  const t = 190 + idx * 44 + Math.min(Math.abs(delta), 6) * 12;
  strip.style.setProperty("--t", t + "ms");
  strip.style.setProperty("--d", idx * 16 + "ms");
  strip.style.setProperty("--y", next);

  clearTimeout(el._reset);
  if (next > 19 || next < 10) {
    el._reset = setTimeout(() => {
      const p = el._pos;
      const back = p > 19 ? p - 10 : p + 10;
      el._pos = back;
      strip.style.transition = "none";
      strip.style.setProperty("--y", back);
      void strip.offsetHeight;
      strip.style.transition = "";
    }, t + idx * 16 + 60);
  }
}
/** 让一组轮子显示 str（左侧可增位），offset = 右侧还有几位 */
function setWheelGroup(box, arr, str, dir, offset) {
  /* 位数变多：往左补新轮子 */
  while (arr.length < str.length) {
    const w = makeWheel();
    box.insertBefore(w, box.firstChild);
    arr.unshift(w);
  }
  /* 位数变少：多出来的高位置 0，等滚停后由 shrinkWheels 收走 */
  const extra = arr.length - str.length;
  for (let i = 0; i < extra; i++) {
    setWheel(arr[i], 0, dir, arr.length - 1 - i + offset);
  }
  const n = arr.length;
  const base = n - str.length;          // 有效位从 arr[base] 开始
  for (let i = 0; i < str.length; i++) {
    setWheel(arr[base + i], +str[i], dir, n - 1 - (base + i) + offset);
  }
}
function shrinkWheels(arr, want) {
  while (arr.length > want) {
    const w = arr.shift();
    if (w && w.remove) w.remove();
  }
}

/* ---------- 记录：金额（滚轮） ---------- */
let amtInt = [], amtDec = [], lastAmt = 0, shrinkTimer = null;

function amountParts(v) {
  const di = v.indexOf(".");
  let ip = di < 0 ? v : v.slice(0, di);
  let dp = di < 0 ? "" : v.slice(di + 1);
  ip = (ip || "0").replace(/^0+(?=\d)/, "") || "0";   // 去前导零，但留一个 0
  dp = (dp + "00").slice(0, 2);
  return [ip, dp];
}
function initAmount() {
  const ib = $("#amt-int"), db = $("#amt-dec");
  ib.innerHTML = ""; db.innerHTML = "";
  amtInt = [makeWheel()]; ib.appendChild(amtInt[0]);
  amtDec = [makeWheel(), makeWheel()];
  amtDec.forEach((w) => db.appendChild(w));
  renderAmount(true);
}
function renderAmtTag() {
  const el = $("#amt-tag");
  if (el) el.textContent = catLabel({ cat: ST.cat, sub: ST.sub });
}
function renderAmount(silent) {
  const v = ST.draft;
  const [ip, dp] = amountParts(v);
  const now = parseFloat(v || "0") || 0;
  const dir = silent ? 1 : (now >= lastAmt ? 1 : -1);
  lastAmt = now;

  setWheelGroup($("#amt-int"), amtInt, ip, dir, 2);
  setWheel(amtDec[0], +dp[0], dir, 1);
  setWheel(amtDec[1], +dp[1], dir, 0);

  $("#amt-win").classList.toggle("is-empty", v === "");
  renderAmtTag();

  /* 位数变少：等轮子滚完再收，别把正在转的那一位抽掉 */
  clearTimeout(shrinkTimer);
  if (amtInt.length > ip.length) {
    shrinkTimer = setTimeout(() => {
      const need = amountParts(ST.draft)[0].length;
      if (amtInt.length > need) shrinkWheels(amtInt, need);
    }, 360);
  }
}
function keyPress(k) {
  if (k === "del") {
    ST.draft = ST.draft.slice(0, -1);
  } else if (k === ".") {
    if (!ST.draft) ST.draft = "0.";
    else if (ST.draft.indexOf(".") < 0) ST.draft += ".";
  } else {
    const dot = ST.draft.indexOf(".");
    if (dot >= 0 && ST.draft.length - dot > 2) return;      // 最多两位小数
    const digits = ST.draft.replace(".", "");
    if (digits.length >= 9) return;                          // 金额上限
    if (ST.draft === "0") ST.draft = k;
    else ST.draft += k;
  }
  renderAmount();
}
function buildKeypad() {
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", ".", "0", "del"];
  const box = $("#keypad");
  box.innerHTML = keys.map((k) => {
    if (k === "del") return `<button class="key del" data-k="del">⌫</button>`;
    return `<button class="key" data-k="${k}">${k}</button>`;
  }).join("");
  box.addEventListener("click", (e) => {
    const btn = e.target.closest(".key");
    if (!btn) return;
    keyPress(btn.dataset.k);
    buzz(6);
  });
}

/* ---------- 记录：键盘（按需唤出） ---------- */
let padOpen = false;
function openPad() {
  if (padOpen) return;
  padOpen = true;
  $("#keypad").classList.add("is-open");
  $("#amt-win").classList.add("is-live");
  $("#app").classList.add("pad-open");
  buzz(8);
}
function closePad() {
  if (!padOpen) return;
  padOpen = false;
  $("#keypad").classList.remove("is-open");
  $("#amt-win").classList.remove("is-live");
  $("#app").classList.remove("pad-open");
}

/* ---------- 记录：保存流水 ---------- */
async function saveTxn() {
  const amount = Math.round(parseFloat(ST.draft || "0") * 100) / 100;
  if (!(amount > 0)) {
    const el = $("#amt-win");
    el.classList.remove("is-shake");
    void el.offsetWidth;
    el.classList.add("is-shake");
    toast("先输个金额");
    return;
  }
  const t = {
    id: uid("t"),
    at: Date.now(),
    amount,
    dir: ST.dir,
    cat: ST.cat,
    sub: ST.sub || "",
    note: $("#txn-note").value.trim(),
    inTrack: ST.inTrack,
    origin: "manual",
    createdAt: Date.now()
  };
  ST.txns.unshift(t);
  await dbPut("txns", t);

  ST.prefs.lastCat = ST.cat;
  saveMeta();

  ST.draft = "";
  $("#txn-note").value = "";
  $("#txn-note").blur();
  ST.inTrack = false;
  $("#t-track").setAttribute("aria-pressed", "false");
  renderAmount();
  closePad();
  if (navigator.vibrate) buzz(10);
  renderToday();
  renderTrack();
  renderStats();
}

/* ---------- 记录：今日流水 ---------- */
function txRow(t) {
  const c = catById(t.cat);
  return `<div class="tx" data-id="${t.id}">
      <span class="tx-time">${fmtHM(t.at)}</span>
      <span class="tx-dot" style="background:${c.c}"></span>
      <span class="tx-cat">${esc(catLabel(t))}</span>
      <span class="tx-note">${esc(t.note || "")}</span>
      ${t.inTrack ? `<span class="tx-trk">轨迹</span>` : ""}
      <span class="tx-amt ${t.dir}">${t.dir === "out" ? "-" : "+"}${fmtMoney(t.amount)}</span>
    </div>`;
}

function renderToday() {
  const box = $("#today");
  const today = dayKey(Date.now());
  const all = ST.txns.slice().sort((a, b) => b.at - a.at);
  const todays = all.filter((t) => dayKey(t.at) === today);
  const earlier = all.filter((t) => dayKey(t.at) !== today).slice(0, 8);

  if (!todays.length && !earlier.length) {
    box.innerHTML = `<div class="empty"><b>今天还没记</b>输个金额，选好分类，点「记下来」</div>`;
    return;
  }

  let html = "";
  if (todays.length) {
    let out = 0, inc = 0;
    todays.forEach((t) => { if (t.dir === "out") out += t.amount; else inc += t.amount; });
    html += `<div class="today-head">今天 · <b>${todays.length}</b> 笔` +
      (out ? ` · 支出 <b>¥${fmtMoney(out)}</b>` : "") +
      (inc ? ` · 收入 <b>¥${fmtMoney(inc)}</b>` : "") + `</div>`;
    html += todays.map(txRow).join("");
  } else {
    html += `<div class="today-head">今天还没有记录</div>`;
  }

  if (earlier.length) {
    html += `<div class="today-sep">更早</div>`;
    let lastKey = "";
    earlier.forEach((t) => {
      const k = dayKey(t.at);
      if (k !== lastKey) {
        const d = new Date(t.at);
        html += `<div class="today-day">${d.getMonth() + 1}月${d.getDate()}日 周${WEEK_CN[d.getDay()]}</div>`;
        lastKey = k;
      }
      html += txRow(t);
    });
  }

  box.innerHTML = html;
}

async function saveNote() {

function renderNoteFeed() {
  const box = $("#note-feed");
  const list = ST.notes.slice().sort((a, b) => b.at - a.at).slice(0, 40);
  if (!list.length) {
    box.innerHTML = `<div class="empty"><b>还没有随笔</b>想记什么就写，标了「大事」的会进轨迹</div>`;
    return;
  }
  let html = "";

/* ---------- 轨迹 ---------- */
function renderTrack() {
  const box = $("#track");
  const days = new Map();
  const touch = (ts) => {
    const k = dayKey(ts);
    if (!days.has(k)) days.set(k, { key: k, at: startOfDay(ts).getTime(), notes: [], out: 0, inc: 0, n: 0, trackTxns: [] });
    return days.get(k);
  };
  ST.notes.forEach((n) => { if (n.big) touch(n.at).notes.push(n); });
  ST.txns.forEach((t) => {
    const d = touch(t.at);
    d.n++;
    if (t.dir === "out") d.out += t.amount; else d.inc += t.amount;
    if (t.inTrack) d.trackTxns.push(t);
  });

  const arr = Array.from(days.values()).sort((a, b) => b.key.localeCompare(a.key));
  if (!arr.length) {
    box.innerHTML = `<div class="empty"><b>轨迹还是空的</b>记一笔账，或写一条标为「大事」的随笔，这里就会长出来</div>`;
    return;
  }

  box.innerHTML = arr.map((d) => {
    const dt = new Date(d.at);
    const hasMile = d.notes.length > 0;
    let inner = "";
    d.notes.forEach((n) => {
      inner += `<div class="mile">${esc(n.text)}</div>`;
    });
    d.trackTxns.forEach((t) => {
      const c = catById(t.cat);
      inner += `<div class="mile mile-tx">
        <span style="width:6px;height:6px;border-radius:50%;background:${c.c};flex:0 0 auto"></span>
        <span>${esc(catLabel(t))}${t.note ? " · " + esc(t.note) : ""}</span>
        <span class="mt-amt">${t.dir === "out" ? "-" : "+"}${fmtMoney(t.amount)}</span>
      </div>`;
    });
    if (d.n) {
      const parts = [];
      if (d.out) parts.push(`支出 <b>¥${fmtMoney(d.out)}</b>`);
      if (d.inc) parts.push(`收入 <b>¥${fmtMoney(d.inc)}</b>`);
      parts.push(`${d.n} 笔`);
      inner += `<div class="spend">${parts.join('<span class="sep">·</span>')}</div>`;
    }
    return `<div class="day ${hasMile ? "has-mile" : ""}">
      <span class="day-dot"></span>
      <div class="day-label"><b>${dt.getMonth() + 1}/${dt.getDate()}</b> 周${WEEK_CN[dt.getDay()]}</div>
      ${inner}
    </div>`;
  }).join("");
}

/* ---------- 计划 ---------- */
function currentPlans() {
  const wk = weekKey();

}
function renderPlan() {
  const box = $("#plan");

  const must = list.filter((p) => p.kind === "must");
  const stretch = list.filter((p) => p.kind === "stretch");

  const rate = must.length ? Math.round((doneMust / must.length) * 100) : 0;

  const row = (p) => `<div class="pl-item ${p.done ? "done" : ""} ${p.kind === "stretch" ? "stretch" : ""}" data-id="${p.id}">
    <span class="pl-box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
    <span class="pl-text">${esc(p.title)}</span>
  </div>`;

  box.innerHTML = `
    <div class="plan-h">
      <h2>本周</h2>
      <span class="sub">${weekRangeLabel()}</span>
    </div>
    <div class="rate-box">
      <span class="rate-well"${must.length ? "" : " hidden"}>
        <span class="wheels" id="rate-wheels"></span><span class="pct">%</span>
      </span>
      <span class="rate-cap">${must.length ? `必做 <b>${doneMust}/${must.length}</b>` : "还没有必做事项"}</span>
    </div>

      <div class="pl-sec-h">必做</div>
      ${must.length ? must.map(row).join("") : `<div class="pl-empty">这周必须完成的事，加一条</div>`}

      <div class="pl-sec-h">弹性目标</div>
      ${stretch.length ? stretch.map(row).join("") : `<div class="pl-empty">想做但不强求，不计入达标率</div>`}

/* ---------- 我的 ---------- */
function needBackup() {
  const total = ST.txns.length + ST.notes.length;
  const le = ST.prefs.lastExport;
  return total > 0 && (!le || Date.now() - le > 14 * 86400000);
}
const statWheels = { txn: [], note: [], plan: [] };
let rateArr = [];

function paintStat(key, n) {
  const s = String(n);
  const arr = statWheels[key];
  setWheelGroup($("#st-" + key), arr, s, 1, 0);
  if (arr.length > s.length) {
    const extra = arr.length - s.length;
    for (let i = 0; i < extra; i++) setWheel(arr[i], 0, -1, arr.length - 1 - i);
    clearTimeout(arr._shrink);
    arr._shrink = setTimeout(() => shrinkWheels(arr, s.length), 320);
  }
}
function renderStats() {
  paintStat("txn", ST.txns.length);
  paintStat("note", ST.notes.length);
  paintStat("plan", ST.plans.length);
  const le = ST.prefs.lastExport;
  const el = $("#last-export");
  if (!le) el.textContent = "从未导出";
  else {
    const days = Math.floor((Date.now() - le) / 86400000);
    el.textContent = days === 0 ? "今天" : days === 1 ? "昨天" : `${days} 天前`;
  }
  const nb = needBackup();
  el.classList.toggle("warn", nb);
  $("#me-dot").hidden = !nb;
}
function exportBackup() {
  const data = {
    app: "life",
    version: 1,
    exportedAt: Date.now(),
    txns: ST.txns,
    notes: ST.notes,
    plans: ST.plans,
    memos: ST.memos
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `life-backup-${dayKey(Date.now())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  ST.prefs.lastExport = Date.now();
  saveMeta();
  renderStats();
  toast("备份已导出，存到「文件」里");
}
async function importBackup(file) {
  let d;
  try {
    d = JSON.parse(await file.text());
  } catch (e) {
    toast("这个文件读不了");
    return;
  }
  if (!d || d.app !== "life") { toast("这不是本应用的备份"); return; }
  const n = (d.txns || []).length + (d.notes || []).length + (d.plans || []).length + (d.memos || []).length;
  if (!n) { toast("备份里没有数据"); return; }
  if (!confirm(`将用这份备份覆盖当前数据（备份含 ${n} 条记录），继续？`)) return;

  await dbClear("txns"); await dbClear("notes"); await dbClear("plans"); await dbClear("memos");
  ST.txns = d.txns || []; ST.notes = d.notes || []; ST.plans = d.plans || []; ST.memos = d.memos || [];
  for (const t of ST.txns) await dbPut("txns", t);
  for (const x of ST.notes) await dbPut("notes", x);
  for (const x of ST.plans) await dbPut("plans", x);
  for (const x of ST.memos) await dbPut("memos", x);
  renderAll();
  toast(`恢复了 ${n} 条记录`);
}
async function wipeAll() {
  if (!confirm("清空所有数据？这会删掉全部账目、随笔、计划与备忘录。\n\n建议先导出备份。")) return;
  if (!confirm("真的要清空吗？此操作无法撤销。")) return;
  await dbClear("txns"); await dbClear("notes"); await dbClear("plans"); await dbClear("memos");
  ST.txns = []; ST.notes = []; ST.plans = []; ST.memos = [];
  ST.prefs.lastExport = 0;
  saveMeta();
  renderAll();
  toast("已清空");
}

/* ---------- 长按（pointer 事件：触摸与鼠标都通） ---------- */
let suppressClickUntil = 0;
function bindLongPress(container, selector, onLong) {
  let timer = null, sx = 0, sy = 0;
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  container.addEventListener("pointerdown", (e) => {
    const row = e.target.closest(selector);
    if (!row) return;
    sx = e.clientX; sy = e.clientY;
    cancel();
    timer = setTimeout(() => {
      timer = null;
      suppressClickUntil = Date.now() + 600;
      buzz(18);
      onLong(row);
    }, 520);
  });
  container.addEventListener("pointermove", (e) => {
    if (!timer) return;
    if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) cancel();
  });
  container.addEventListener("pointerup", cancel);
  container.addEventListener("pointercancel", cancel);
  container.addEventListener("pointerleave", cancel);
  container.addEventListener("contextmenu", (e) => e.preventDefault());
}

  /* 今日流水：长按删除 */

  /* 随笔长按删除 */
  bindLongPress($("#note-feed"), ".nf-item", async (row) => {

  /* 计划 */

  $("#plan-input").addEventListener("keydown", (e) => {

  $("#plan-kind").addEventListener("click", (e) => {

  $("#plan").addEventListener("click", (e) => {

    const row = e.target.closest(".pl-item");

  bindLongPress($("#plan"), ".pl-item", async (row) => {

    await dbDel("plans", id);

  /* 备忘录 */
  $("#memo-add").addEventListener("click", addMemo);

    if (e.key === "Enter") { e.preventDefault(); addMemo(); }

  $("#memo").addEventListener("click", (e) => {

    ST.memos = ST.memos.filter((x) => x.id !== id);
    await dbDel("memos", id);
    renderMemo();
    toast("删掉了这一条");
  });

  /* 点键盘和表单以外的任何地方，收起键盘（否则误触后没有退路）
     用 composedPath：分类按钮点完会重绘，e.target 已从 DOM 摘下，closest() 会误判成"点在外面" */
  document.addEventListener("click", (e) => {
    if (!padOpen) return;
    const keep = "#keypad, #amt-win, .cats, #subs, .row-note, #save-txn, .seg, .tabbar, .hdr, .sheet";
    const path = e.composedPath ? e.composedPath() : [];
    const inside = path.some((el) => el && el.nodeType === 1 && el.matches && el.matches(keep));
    if (!inside) closePad();
  });

  /* 我的 */
  $("#open-me").addEventListener("click", () => {
    $("#sheet-me").classList.add("is-open");
    renderStats();
  });
  $("#close-me").addEventListener("click", () => $("#sheet-me").classList.remove("is-open"));
  $("#btn-export").addEventListener("click", exportBackup);
  $("#btn-import").addEventListener("click", () => $("#file-import").click());
  $("#file-import").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) importBackup(f);
    e.target.value = "";
  });
  $("#btn-wipe").addEventListener("click", wipeAll);
  $("#theme-row").addEventListener("click", (e) => {
    const b = e.target.closest(".theme-opt");
    if (!b) return;
    ST.prefs.theme = b.dataset.theme;
    applyTheme();
    saveMeta();
    buzz(6);
  });
}

/* ---------- 视口高度（iOS 键盘弹出时压缩布局） ---------- */
function fixViewport() {
  const vv = window.visualViewport;
  if (!vv) return;
  const full = Math.max(window.innerHeight, vv.height);
  const set = () => {
    document.documentElement.style.setProperty("--vh", vv.height + "px");
    /* 可视高度明显变矮 = 系统键盘弹出，这时必须让出位置，否则自绘键盘会压住输入框 */
    const kbd = full - vv.height > 130;
    document.documentElement.classList.toggle("kb-open", kbd);
  };
  set();
  vv.addEventListener("resize", set);
  vv.addEventListener("scroll", set);
  window.addEventListener("orientationchange", () => setTimeout(set, 220));
}

/* ---------- 启动 ---------- */
function renderAll() {
  renderCats();
  renderAmount();
  renderToday();
  renderNoteFeed();
  renderTrack();
  renderPlan();
  renderMemo();
  renderStats();
}

async function boot() {
  try {
    _db = await openDB();
  } catch (e) {
    document.body.innerHTML =
      '<div style="padding:40px 24px;font:14px/1.8 -apple-system,sans-serif;color:#5b564d">' +
      "这台设备的浏览器不允许本地存储，应用无法运行。<br>换 Safari 或 Chrome 再试。" +
      "</div>";
    return;
  }
  const [txns, notes, plans, memos, meta] = await Promise.all([
    dbAll("txns"), dbAll("notes"), dbAll("plans"), dbAll("memos"), dbAll("meta")
  ]);
  ST.txns = txns.sort((a, b) => b.at - a.at);
  ST.notes = notes.sort((a, b) => b.at - a.at);
  ST.plans = plans;
  ST.memos = memos;
  const p = meta.find((x) => x.k === "prefs");
  if (p && p.v) Object.assign(ST.prefs, p.v);
  ST.cat = ST.prefs.lastCat || "food";
  ST.sub = (catById(ST.cat).subs || [""])[0];

  applyTheme();
  buildKeypad();
  initAmount();
  bindEvents();
  fixViewport();
  renderAll();
  setMode("txn");
  setView("record");

}

boot();

if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
